
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b20">
<title>深夜便利店 · 夜间生活模拟</title>
<style>
:root {
  color-scheme: dark;
  --panel: rgba(12,23,27,.88);
  --line: rgba(255,255,255,.15);
  --text: #edf5ef;
  --muted: #b7c9c5;
  --accent: #b8e3bc;
}
* { box-sizing:border-box; }
html,body { margin:0;width:100%;height:100%;overflow:hidden;background:#10191c;color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;overscroll-behavior:none; }
button { font:inherit;color:var(--text);background:rgba(25,43,46,.94);border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer;touch-action:manipulation; }
button:active { background:#45645b; }
#game { position:fixed;inset:0;overflow:hidden; }
canvas { display:block;width:100%;height:100%;touch-action:none; }
#loading { position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;background:#101b20; }
.loadbox { max-width:420px;line-height:1.7; }
.loadtitle { font-size:27px;font-weight:750;margin-bottom:8px; }
#loadmsg { color:#c4d5cf;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere; }
#loadbar { height:3px;background:#344b47;margin:20px 0;border-radius:4px;overflow:hidden; }
#loadbar:after { content:"";display:block;height:100%;width:40%;background:#b8e3bc;animation:load 1.2s ease-in-out infinite alternate; }
@keyframes load { to { transform:translateX(150%); } }
#hud { position:absolute;inset:0;pointer-events:none; }
.panel { background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px); }
#brand { position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;padding:10px 13px;max-width:70%; }
#brand strong { display:block;font-size:15px; }
#brand small { color:var(--muted);font-size:11px; }
#status { position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));padding:9px 12px;text-align:right;font-size:12px; }
#task { position:absolute;top:91px;left:12px;max-width:min(270px,65vw);padding:10px 12px;font-size:12px;line-height:1.6; }
#task strong { color:var(--accent); }
#crosshair { position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.75; }
#hint { position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);max-width:80vw;text-align:center;font-size:12px;padding:6px 9px;border-radius:9px;background:rgba(0,0,0,.55);white-space:nowrap; }
#controls { position:absolute;inset:0; }
#joystick { position:absolute;left:18px;bottom:calc(26px + env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:rgba(10,20,22,.48);border:1px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none; }
#stick { position:absolute;width:48px;height:48px;left:38px;top:38px;border-radius:50%;background:rgba(206,231,215,.65);border:1px solid rgba(255,255,255,.7); }
#actions { position:absolute;right:12px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:9px;pointer-events:auto; }
#actions button { min-width:83px;box-shadow:0 3px 14px #0005; }
#interact { background:rgba(91,127,99,.95);font-weight:700; }
#dialog { position:absolute;left:50%;bottom:calc(170px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 28px));padding:15px;pointer-events:auto;display:none; }
#dialog p { margin:6px 0 12px;line-height:1.65;font-size:14px; }
#dialoghead { font-weight:750;color:var(--accent); }
#dialogfoot { display:flex;justify-content:flex-end;gap:8px; }
#start { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,rgba(9,20,22,.45),rgba(9,20,22,.9));pointer-events:auto; }
#startbox { width:min(430px,100%);padding:23px;background:rgba(12,25,27,.94);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 70px #0008; }
#startbox h1 { margin:0 0 6px;font-size:29px; }
#startbox p { font-size:13px;line-height:1.8;color:var(--muted); }
#startbtn { width:100%;padding:13px;background:#b8e3bc;color:#12221a;font-weight:800;margin-top:8px; }
#modal { position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.65);pointer-events:auto; }
#modalbox { width:min(520px,100%);max-height:75vh;overflow:auto;padding:19px; }
#modalbox h2 { margin:0 0 12px;font-size:20px; }
#modalcontent { white-space:pre-wrap;line-height:1.8;font-size:14px;color:#dce8e2; }
#modalbottom { display:flex;justify-content:flex-end;margin-top:16px; }
#toast { position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(9,20,22,.92);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;display:none;text-align:center;max-width:85vw; }
#footnote { position:absolute;left:12px;bottom:12px;font-size:10px;color:#d7e2ddaa;pointer-events:none; }
@media (min-width:760px) {
  #joystick { width:140px;height:140px; }
  #stick { left:45px;top:45px; }
  #actions { right:24px;bottom:24px; }
}
</style>
</head>
<body>
<div id="game">
  <div id="loading">
    <div class="loadbox">
      <div class="loadtitle">深夜便利店</div>
      <div id="loadmsg">正在准备 3D 场景……</div>
      <div id="loadbar"></div>
      <div style="font-size:12px;color:#8fa9a0">温馨的夜间生活模拟 · 非恐怖游戏</div>
    </div>
  </div>

  <div id="hud" style="display:none">
    <div id="brand" class="panel">
      <strong>深夜便利店</strong>
      <small>雨夜营业中 · 自由探索</small>
    </div>
    <div id="status" class="panel">23:48<br>小雨 · 夜间</div>
    <div id="task" class="panel"><strong>今夜的小事</strong><br><span id="tasktext">进店看看，熟悉一下环境。</span></div>
    <div id="crosshair"></div>
    <div id="hint">移动并靠近物品进行互动</div>
    <div id="controls">
      <div id="joystick"><div id="stick"></div></div>
      <div id="actions">
        <button id="notesbtn">📒 笔记</button>
        <button id="soundbtn">🔊 声音：开</button>
        <button id="interact">互动</button>
      </div>
    </div>
    <div id="dialog" class="panel">
      <div id="dialoghead">日常对话</div>
      <p id="dialogtext"></p>
      <div id="dialogfoot"><button id="closeDialog">继续探索</button></div>
    </div>
    <div id="modal">
      <div id="modalbox" class="panel">
        <h2 id="modaltitle">笔记</h2>
        <div id="modalcontent"></div>
        <div id="modalbottom"><button id="closeModal">关闭</button></div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="footnote">左侧移动 · 滑动屏幕转向 · 右侧互动</div>
  </div>

  <div id="start" style="display:none">
    <div id="startbox">
      <h1>深夜便利店</h1>
      <div style="color:#b8e3bc;font-size:13px">一段安静、温暖的雨夜时光</div>
      <p>窗外下着小雨，街道上偶尔有汽车驶过。店里灯光明亮，货架上摆满零食和饮料。你可以自由走动、看看商品、与店员聊聊天。</p>
      <p>操作：左侧摇杆移动，滑动画面转动视角，靠近物品后点击“互动”。声音将在开始后初始化。</p>
      <button id="startbtn">进入便利店</button>
    </div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const loadmsg = $("loadmsg");

let THREE = null;
let scene, camera, renderer, clock;
let rainPoints, rainPositions, rainSpeeds;
let player = { x:0, z:1.7, yaw:0, pitch:0 };
let running = false;
let targetObject = null;
let currentTask = 0;
let audioContext = null, rainGain = null, soundEnabled = true;
let noiseSource = null, masterGain = null;
let toastTimer = null;
const interactables = [];
const notes = [];
const keys = {};
const cars = [];
const walkers = [];
const products = [];
const worldMeshes = [];
const raycaster = { value:null };
const joystick = { active:false, dx:0, dy:0, pid:null };
const look = { active:false, x:0, y:0, pid:null };
const sceneClock = { elapsed:0 };

function setLoadMessage(text) {
  loadmsg.textContent = text;
}

function showFatal(title, error) {
  $("loading").style.display = "flex";
  $("loadbar").style.display = "none";
  $("loadmsg").textContent =
    title + "\n\n" + String(error && (error.stack || error.message) || error) +
    "\n\n请检查：\n1. three.module.js 是否与 index.html 在同一目录；\n2. 文件是否为 Three.js r160 官方模块；\n3. GitHub Pages 是否已重新发布；\n4. 请刷新页面重试。";
  console.error(title, error);
}

function addMesh(geometry, material, x, y, z, parent=scene) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x,y,z);
  parent.add(mesh);
  worldMeshes.push(mesh);
  return mesh;
}

function material(color, roughness=.8, metalness=0) {
  return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function box(x,y,z,sx,sy,sz,color,opts={}) {
  const m = addMesh(
    new THREE.BoxGeometry(sx,sy,sz),
    material(color,opts.roughness ?? .8,opts.metalness ?? 0),
    x,y,z
  );
  if(opts.name) m.name=opts.name;
  return m;
}

function cylinder(x,y,z,r1,r2,h,color,segments=12) {
  return addMesh(
    new THREE.CylinderGeometry(r1,r2,h,segments),
    material(color,.7),
    x,y,z
  );
}

function sphere(x,y,z,r,color,segments=10) {
  return addMesh(
    new THREE.SphereGeometry(r,segments,8),
    material(color,.75),
    x,y,z
  );
}

function makeLabel(text, x, y, z, color="#ffffff", width=512, height=128) {
  const canvas = document.createElement("canvas");
  canvas.width=width;
  canvas.height=height;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,width,height);
  ctx.fillStyle="rgba(14,33,28,.82)";
  ctx.fillRect(0,0,width,height);
  ctx.fillStyle=color;
  ctx.font="bold 46px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(text,width/2,height/2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  sprite.position.set(x,y,z);
  sprite.scale.set(2.3,.58,1);
  scene.add(sprite);
  return sprite;
}

function registerInteraction(object, name, action, description) {
  object.userData.interact = {name,action,description};
  interactables.push(object);
  return object;
}

function addProduct(x,y,z,color,name,description) {
  const p = box(x,y,z,.22,.34,.22,color,{roughness:.35});
  p.userData.product = true;
  registerInteraction(p,name,()=>{
    addNote("商品观察",name+"：看起来是普通的便利店商品。"+description);
    showDialog(name,description);
    if(currentTask===1) completeTask("你已经看过货架上的商品。");
  },description);
  products.push(p);
  return p;
}

function buildStore() {
  // 地面与外部人行道
  box(0,-.15,1,12,.3,13,"#4c514c");
  box(0,-.31,-10,32,.3,13,"#353d3e");
  box(0,-.12,-6,12,.18,3,"#777a72");
  box(0,-.05,-14,32,.12,11,"#252d30");
  // 道路标线
  for(let i=0;i<8;i++) box(-13+i*3.8,.02,-14,.95,.025,.12,"#c8c6ae");
  // 店铺后墙和两侧
  box(0,2.0,7,12,4,.3,"#c6bfb0");
  box(-6,2,1,.3,4,12,"#c6bfb0");
  box(6,2,1,.3,4,12,"#c6bfb0");
  // 前门两侧墙体，中央留出玻璃门口
  box(-4.7,2,-5,2.6,4,.28,"#d1cbbb");
  box(4.7,2,-5,2.6,4,.28,"#d1cbbb");
  // 玻璃窗
  const glassMat = new THREE.MeshStandardMaterial({
    color:"#9abbb9",roughness:.2,metalness:.1,
    transparent:true,opacity:.22
  });
  const windowMesh = addMesh(new THREE.PlaneGeometry(5.9,2.8),glassMat,0,2.05,-4.83);
  windowMesh.name="storeWindow";
  // 门框与玻璃门
  box(-.9,2,-4.9,.1,4,.14,"#4a5b55");
  box(.9,2,-4.9,.1,4,.14,"#4a5b55");
  box(0,3.95,-4.9,1.9,.12,.14,"#4a5b55");
  const door = box(0,1.8,-4.91,1.65,3.4,.06,"#8eb6b2");
  door.material.transparent=true;
  door.material.opacity=.24;
  registerInteraction(door,"玻璃店门",()=>{
    showDialog("玻璃店门","门边的感应器发出轻轻的提示音。门外的小雨还在下，店内暖和而明亮。");
    addNote("便利店","玻璃门连接着店内与雨夜街道。");
  },"查看玻璃店门");
  // 顶棚与灯具
  box(0,4.1,1,12,.25,13,"#ddd7c8");
  for(let x=-4;x<=4;x+=2) {
    const light = new THREE.PointLight("#ffe8b5",26,8,2);
    light.position.set(x,3.7,1);
    scene.add(light);
    box(x,3.91,1,.9,.06,1.6,"#fff3cb");
  }
  // 收银台
  box(3.9,.65,-1.2,2.8,1.3,1.1,"#a47b58");
  box(3.9,1.34,-1.2,2.9,.12,1.2,"#443d35");
  box(3.45,1.44,-1.1,.48,.2,.32,"#273b40");
  const counterItem = box(4.5,1.48,-1.15,.35,.18,.24,"#dfd9c8");
  registerInteraction(counterItem,"收银台",()=>{
    addNote("收银台","整齐的收银台旁放着收据和扫码设备。");
    showDialog("收银台","店员笑着说：“晚上好，慢慢逛。有需要随时叫我。”");
    if(currentTask===2) completeTask("你和店员打了招呼。");
  },"查看收银台");
  // 货架
  for(let row=0;row<3;row++) {
    const z=2-row*2.8;
    for(let side of [-1,1]) {
      const x=side*2.0;
      box(x,1.0,z,1.15,2,.65,"#9d8063");
      box(x,1.95,z,1.2,.09,.75,"#d5c3a5");
      box(x,1.3,z,1.2,.06,.75,"#d5c3a5");
      box(x,.68,z,1.2,.06,.75,"#d5c3a5");
      for(let i=0;i<5;i++) {
        const px=x-.48+i*.24;
        addProduct(px,1.56,z-.14,
          ["#d66d4b","#e4c55d","#65a5a2","#e4e0d2","#8b91c8"][(i+row)%5],
          ["薯片","巧克力","汽水","饼干","糖果"][(i+row)%5],
          "货架上常见的零食，适合夜间休息时享用。");
        addProduct(px,.98,z-.14,
          ["#4b9fba","#d3b25e","#75b76f","#cf7e87","#9e9e9e"][(i+row)%5],
          ["矿泉水","果汁","茶饮","咖啡","牛奶"][(i+row)%5],
          "一件普通饮品，冷藏后饮用会更清爽。");
      }
    }
  }
  // 冰柜
  box(-4.9,1.3,1,1.0,2.5,3.6,"#b9d1cb");
  box(-4.9,1.3,-.82,1.05,2.4,.08,"#8eb4b2");
  for(let i=0;i<4;i++) {
    box(-4.9,.48+i*.55,-.91,.9,.035,2.7,"#e4eee5");
  }
  const fridge = box(-4.3,1.5,1,.22,.5,.35,"#5b9eae");
  registerInteraction(fridge,"饮料冰柜",()=>{
    showDialog("饮料冰柜","冰柜里摆着矿泉水、果汁和茶饮，压缩机发出低低的运行声。");
    addNote("饮料冰柜","冰柜持续运转，玻璃门上有细小的水汽。");
  },"查看饮料冰柜");
  // 微波炉与泡面区
  box(3.9,1.55,2.2,.9,.65,.65,"#d9ddd8");
  box(3.9,1.55,1.86,.62,.36,.03,"#37494a");
  const microwave = box(3.9,1.1,2.2,.25,.12,.25,"#f4e5bd");
  registerInteraction(microwave,"微波炉",()=>{
    showDialog("微波炉","微波炉暂时空闲。你可以想象一份热腾腾的夜宵正在慢慢加热。");
    addNote("夜间热食区","微波炉旁摆放着泡面和纸杯。");
  },"查看微波炉");
  for(let i=0;i<4;i++) {
    cylinder(3.0,1.05+i*.23,2.5,.12,.12,.18,["#c8a65d","#d7d2bf","#b7bd8a","#d7b6a1"][i],12);
  }
  // 绿植与生活细节
  cylinder(-4.8,.28,-3.4,.48,.48,.5,"#8a674c");
  for(let i=0;i<7;i++) {
    const leaf=sphere(-4.8+Math.sin(i*1.8)*.3,.7+(i%3)*.13,-3.4+Math.cos(i*1.8)*.3,.28,"#558565",8);
    leaf.scale.set(.7,1.5,.65);
  }
  makeLabel("OPEN · 营业中",0,3.5,-4.72,"#c6f0c9");
  makeLabel("DRINKS", -4.9,2.9,1,"#e7fff4",320,90);
}

function buildStreet() {
  // 远处建筑剪影
  const buildingColors=["#374649","#43504e","#38454a","#4b5551"];
  for(let i=0;i<12;i++) {
    const x=-20+i*3.7;
    const h=3.5+(i*7%5)*.7;
    box(x,h/2,-23,3.1,h,2,buildingColors[i%4]);
    for(let j=0;j<4;j++) {
      box(x-0.6+(j%2)*1.2,.8+Math.floor(j/2)*1.2,-21.94,.3,.45,.025,
        (i+j)%3===0?"#d2b67a":"#536968");
    }
  }
  // 路灯
  for(let x=-12;x<=12;x+=6) {
    cylinder(x,2.1,-8,.07,.09,4.2,"#4b5552");
    const lamp = new THREE.PointLight("#f5dca5",9,9,2);
    lamp.position.set(x,4.1,-8);
    scene.add(lamp);
    sphere(x,4.1,-8,.16,"#fff0c8");
  }
  // 店外长椅
  box(-4.3,.45,-7.7,2.2,.15,.65,"#795f48");
  for(let x=-5.2;x<=-3.4;x+=.9) {
    box(x,.2,-7.7,.1,.55,.12,"#555c56");
  }
  // 斑马线
  for(let i=0;i<7;i++) box(-3+i,-.01,-10, .48,.025,1.8,"#c9c8b9");
}

function createCar(index) {
  const group = new THREE.Group();
  const bodyColor=["#a5b3b2","#547c89","#a77e68","#d1c8a8"][index%4];
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.0,.55,.95),material(bodyColor,.38,.12));
  body.position.y=.55;
  group.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0,.48,.78),material("#536a6c",.25,.1));
  cabin.position.set(-.05,.98,0);
  group.add(cabin);
  for(const x of [-.65,.65]) {
    for(const z of [-.5,.5]) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.12,12),material("#202526",.9));
      wheel.rotation.x=Math.PI/2;
      wheel.position.set(x,.27,z);
      group.add(wheel);
    }
  }
  for(const z of [-.35,.35]) {
    const lamp=new THREE.Mesh(new THREE.BoxGeometry(.08,.13,.12),new THREE.MeshBasicMaterial({color:"#ffe5a2"}));
    lamp.position.set(1,.56,z);
    group.add(lamp);
  }
  group.position.set(-20,.1,-13-index*2);
  group.userData.speed=3.3+index*.65;
  group.userData.startX=-20;
  scene.add(group);
  cars.push(group);
}

function createWalker(index) {
  const group=new THREE.Group();
  const coatColor=["#627d75","#7c7184","#a78a64"][index%3];
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.9,8),material(coatColor));
  torso.position.y=1.05;
  group.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),material("#d6b59a"));
  head.position.y=1.68;
  group.add(head);
  // 伞
  const umbrella=new THREE.Mesh(new THREE.ConeGeometry(.62,.22,12),material(["#657d8b","#a77c6e","#647e68"][index%3]));
  umbrella.position.y=2.0;
  umbrella.rotation.x=Math.PI;
  group.add(umbrella);
  cylinder(0,1.9,0,.025,.025,.28,"#4c514d");
  group.position.set(index===0?-5:5,0,-7-index*.8);
  group.userData.originX=group.position.x;
  group.userData.phase=index*1.8;
  group.userData.index=index;
  scene.add(group);
  walkers.push(group);
  const interact = registerInteraction(torso,index===0?"撑伞的顾客":"路过的行人",()=>{
    if(index===0) {
      showDialog("撑伞的顾客","顾客轻轻收起雨伞，说：“外面下雨了，进来暖和一下真好。你们店里的热饮很不错。”");
      addNote("顾客闲谈","一位撑伞的顾客进店避雨，准备买一杯热饮。");
      if(currentTask===0) completeTask("你遇见了一位夜间顾客。");
    } else {
      showDialog("路过的行人","行人朝你点点头：“晚上好，路上有点湿，走路注意安全。”");
      addNote("街道印象","夜间街道上偶尔有人撑伞经过。");
    }
  },"与行人交谈");
}

function buildRain() {
  const count=1100;
  rainPositions=new Float32Array(count*3);
  rainSpeeds=new Float32Array(count);
  for(let i=0;i<count;i++) {
    rainPositions[i*3]=(Math.random()-.5)*28;
    rainPositions[i*3+1]=Math.random()*13;
    rainPositions[i*3+2]=(Math.random()-.5)*30;
    rainSpeeds[i]=7+Math.random()*9;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(rainPositions,3));
  const mat=new THREE.PointsMaterial({
    color:"#b8d7e0",size:.045,transparent:true,opacity:.56,
    depthWrite:false,sizeAttenuation:true
  });
  rainPoints=new THREE.Points(geo,mat);
  scene.add(rainPoints);
}

function buildPuddles() {
  const puddleMat=new THREE.MeshStandardMaterial({
    color:"#667b7c",roughness:.19,metalness:.25,
    transparent:true,opacity:.52
  });
  for(let i=0;i<20;i++) {
    const puddle=new THREE.Mesh(
      new THREE.CircleGeometry(.35+Math.random()*.9,18),puddleMat
    );
    puddle.rotation.x=-Math.PI/2;
    puddle.position.set((Math.random()-.5)*11,.015,-5-Math.random()*13);
    puddle.scale.y=.45+Math.random()*.6;
    scene.add(puddle);
  }
}

function buildScene() {
  scene=new THREE.Scene();
  scene.background=new THREE.Color("#26383d");
  scene.fog=new THREE.Fog("#26383d",13,48);
  camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,100);
  camera.position.set(player.x,1.68,player.z);
  camera.rotation.order="YXZ";
  renderer=new THREE.WebGLRenderer({
    antialias:innerWidth>700,
    alpha:false,
    powerPreference:"high-performance"
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.12;
  $("game").insertBefore(renderer.domElement,$("loading"));
  renderer.domElement.style.position="absolute";
  renderer.domElement.style.inset="0";
  renderer.domElement.style.zIndex="0";

  scene.add(new THREE.HemisphereLight("#c8dfe5","#4b5147",2.0));
  const moon=new THREE.DirectionalLight("#b4d4df",1.15);
  moon.position.set(-8,12,-5);
  scene.add(moon);

  buildStore();
  buildStreet();
  buildPuddles();
  buildRain();

  for(let i=0;i<4;i++) createCar(i);
  createWalker(0);
  createWalker(1);

  raycaster.value=new THREE.Raycaster();
  clock=new THREE.Clock();
  resize();
  setLoadMessage("3D 场景已创建，正在准备交互……");
}

function resize() {
  if(!renderer||!camera) return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
}

function updateRain(dt) {
  if(!rainPoints) return;
  const p=rainPoints.geometry.attributes.position;
  for(let i=0;i<rainSpeeds.length;i++) {
    const k=i*3;
    rainPositions[k]+=dt*.8;
    rainPositions[k+1]-=rainSpeeds[i]*dt;
    if(rainPositions[k+1]<0) {
      rainPositions[k+1]=9+Math.random()*5;
      rainPositions[k]=(Math.random()-.5)*28;
      rainPositions[k+2]=(Math.random()-.5)*30;
    }
  }
  p.needsUpdate=true;
  rainPoints.position.x=camera.position.x*.15;
  rainPoints.position.z=camera.position.z*.15;
}

function updateCars(dt) {
  for(const car of cars) {
    car.position.x+=car.userData.speed*dt;
    if(car.position.x>22) {
      car.position.x=-22-Math.random()*8;
      car.position.z=-11-Math.random()*6;
    }
  }
}

function updateWalkers(t) {
  for(const w of walkers) {
    const i=w.userData.index;
    w.position.x=w.userData.originX+Math.sin(t*.35+w.userData.phase)*.85;
    w.position.z=-7-i*.8+Math.cos(t*.28+w.userData.phase)*.25;
    w.rotation.y=Math.sin(t*.35+w.userData.phase)*.12;
  }
}

function clampPlayer() {
  player.x=Math.max(-5.4,Math.min(5.4,player.x));
  player.z=Math.max(-4.3,Math.min(5.7,player.z));
  // 门外区域允许走到街边，但避免进入远处车道
  if(player.z < -4.3) player.z=-4.3;
}

function updateMovement(dt) {
  let forward=0, side=0;
  if(keys["KeyW"]||keys["ArrowUp"]) forward+=1;
  if(keys["KeyS"]||keys["ArrowDown"]) forward-=1;
  if(keys["KeyA"]||keys["ArrowLeft"]) side-=1;
  if(keys["KeyD"]||keys["ArrowRight"]) side+=1;
  forward+=-joystick.dy;
  side+=joystick.dx;
  const len=Math.hypot(forward,side);
  if(len>1) { forward/=len;side/=len; }
  const speed=3.1*dt;
  player.x+=(-Math.sin(player.yaw)*forward+Math.cos(player.yaw)*side)*speed;
  player.z+=(-Math.cos(player.yaw)*forward-Math.sin(player.yaw)*side)*speed;
  clampPlayer();
  camera.position.set(player.x,1.68,player.z);
  camera.rotation.set(player.pitch,player.yaw,0,"YXZ");
}

function updateTarget() {
  if(!raycaster.value||!camera) return;
  raycaster.value.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=raycaster.value.intersectObjects(interactables,true);
  targetObject=null;
  for(const hit of hits) {
    let obj=hit.object;
    while(obj&&!obj.userData.interact) obj=obj.parent;
    if(obj&&obj.userData.interact) {
      targetObject=obj;
      break;
    }
  }
  if(targetObject) {
    const info=targetObject.userData.interact;
    $("hint").textContent="互动 · "+info.name;
    $("interact").textContent="互动";
  } else {
    $("hint").textContent="滑动屏幕转向 · 靠近物品后互动";
    $("interact").textContent="互动";
  }
}

function doInteract() {
  if(!running) return;
  if(targetObject&&targetObject.userData.interact) {
    try { targetObject.userData.interact.action(); }
    catch(err) { console.error("互动出错",err);showToast("互动暂时无法完成"); }
    return;
  }
  // 没有指向物品时，允许继续日常探索
  showToast("附近没有可互动的物品，试着走近货架或店员。");
}

function showToast(text) {
  const el=$("toast");
  el.textContent=text;
  el.style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display="none",2400);
}

function showDialog(title,text) {
  $("dialoghead").textContent=title;
  $("dialogtext").textContent=text;
  $("dialog").style.display="block";
}

function addNote(title,text) {
  const exists=notes.some(n=>n.title===title&&n.text===text);
  if(!exists) {
    notes.push({title,text,time:new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})});
    showToast("已记录到夜间笔记");
  }
}

function completeTask(text) {
  if(currentTask>=3) return;
  currentTask++;
  $("tasktext").textContent=text;
  if(currentTask===1) {
    $("task").querySelector("strong").textContent="今夜的小事 · 1/3";
    setTimeout(()=>{
      if(currentTask===1) $("tasktext").textContent="逛逛货架，看看今晚有哪些商品。";
    },2200);
  } else if(currentTask===2) {
    $("task").querySelector("strong").textContent="今夜的小事 · 2/3";
    setTimeout(()=>{
      if(currentTask===2) $("tasktext").textContent="去收银台和店员打个招呼。";
    },2200);
  } else {
    $("task").querySelector("strong").textContent="今夜的小事 · 已完成";
    $("tasktext").textContent="今晚的便利店时光很平静。你可以继续自由探索。";
    addNote("今夜的记录","你完成了夜间小任务：认识一位顾客、看看商品、与店员打招呼。");
    showToast("今夜的小事已完成！");

function openNotes() {
  $("modaltitle").textContent="📒 夜间笔记";
  if(notes.length===0) {
    $("modalcontent").textContent="目前还没有记录。\n靠近商品、店员或环境物品进行互动，就能把观察记在这里。";
  } else {
    $("modalcontent").textContent=notes.map((n,i)=>
      (i+1)+". "+n.title+"（"+n.time+"）\n"+n.text
    ).join("\n\n");
  }
  $("modal").style.display="flex";
}

async function initSound() {
  try {
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx) {
      showToast("当前浏览器不支持网页音效");
      return;
    }
    if(!audioContext) {
      audioContext=new AudioCtx();
      masterGain=audioContext.createGain();
      masterGain.gain.value=.45;
      masterGain.connect(audioContext.destination);

      // 程序生成轻柔雨声，不需要外部音频文件
      const bufferSize=audioContext.sampleRate*2;
      const buffer=audioContext.createBuffer(1,bufferSize,audioContext.sampleRate);
      const data=buffer.getChannelData(0);
      let last=0;
      for(let i=0;i<bufferSize;i++) {
        const white=Math.random()*2-1;
        last=last*.94+white*.06;
        data[i]=last*.7+white*.12;
      }
      noiseSource=audioContext.createBufferSource();
      noiseSource.buffer=buffer;
      noiseSource.loop=true;
      const filter=audioContext.createBiquadFilter();
      filter.type="lowpass";
      filter.frequency.value=1000;
      rainGain=audioContext.createGain();
      rainGain.gain.value=soundEnabled?.10:0;
      noiseSource.connect(filter);
      filter.connect(rainGain);
      rainGain.connect(masterGain);
      noiseSource.start();

      // 轻微的店内电器环境声
      const osc=audioContext.createOscillator();
      const hum=audioContext.createGain();
      osc.type="sine";
      osc.frequency.value=58;
      hum.gain.value=.012;
      osc.connect(hum);
      hum.connect(masterGain);
      osc.start();
    }
    await audioContext.resume();
    soundEnabled=!soundEnabled;
    if(rainGain) rainGain.gain.setTargetAtTime(soundEnabled?.10:0,audioContext.currentTime,.2);
    $("soundbtn").textContent=soundEnabled?"🔊 声音：开":"🔇 声音：关";
    showToast(soundEnabled?"环境音已开启":"环境音已关闭");
  } catch(err) {
    console.error("音频初始化失败",err);
    showToast("音效无法启动，请检查浏览器音频设置");
  }
}

function bind() {
  $("startbtn").addEventListener("click",async()=>{
    $("start").style.display="none";
    $("loading").style.display="none";
    $("hud").style.display="block";
    running=true;
    try {
      if(!audioContext) {
        await createSoundOnStart();
      } else if(audioContext.state==="suspended") {
        await audioContext.resume();
      }
    } catch(err) { console.warn("音频不可用",err); }
    showToast("欢迎来到深夜便利店。祝你有一段轻松的夜晚。");
  });

  $("interact").addEventListener("click",doInteract);
  $("notesbtn").addEventListener("click",openNotes);
  $("soundbtn").addEventListener("click",toggleSound);
  $("closeDialog").addEventListener("click",()=>{$("dialog").style.display="none";});
  $("closeModal").addEventListener("click",()=>{$("modal").style.display="none";});
  $("modal").addEventListener("click",e=>{
    if(e.target===$("modal")) $("modal").style.display="none";
  });

  // 键盘支持电脑调试
  addEventListener("keydown",e=>{
    keys[e.code]=true;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
    if(e.code==="KeyE"||e.code==="Space") doInteract();
    if(e.code==="KeyN") openNotes();
  });
  addEventListener("keyup",e=>{keys[e.code]=false;});
  addEventListener("blur",()=>{for(const k in keys) keys[k]=false;});

  // 触屏虚拟摇杆
  const joy=$("joystick"),stick=$("stick");
  function joyMove(e) {
    const r=joy.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=(e.clientX-cx)/(r.width*.36);
    let dy=(e.clientY-cy)/(r.height*.36);
    const len=Math.hypot(dx,dy);
    if(len>1) {dx/=len;dy/=len;}
    joystick.dx=dx;
    joystick.dy=dy;
    stick.style.transform=`translate(${dx*35}px,${dy*35}px)`;
  }
  joy.addEventListener("pointerdown",e=>{
    e.preventDefault();
    joystick.active=true;
    joystick.pid=e.pointerId;
    joy.setPointerCapture(e.pointerId);
    joyMove(e);
  });
  joy.addEventListener("pointermove",e=>{
    if(joystick.active&&e.pointerId===joystick.pid) joyMove(e);
  });
  function joyEnd(e) {
    if(e.pointerId!==joystick.pid) return;
    joystick.active=false;
    joystick.dx=0;
    joystick.dy=0;
    joystick.pid=null;
    stick.style.transform="translate(0px,0px)";
  }
  joy.addEventListener("pointerup",joyEnd);
  joy.addEventListener("pointercancel",joyEnd);

  // 在画面空白区域滑动以转动视角
  const canvas=renderer.domElement;
  canvas.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0) return;
    look.active=true;
    look.pid=e.pointerId;
    look.x=e.clientX;
    look.y=e.clientY;
    try {canvas.setPointerCapture(e.pointerId);} catch(err) {}
  });
  canvas.addEventListener("pointermove",e=>{
    if(!look.active||e.pointerId!==look.pid||!running) return;
    const dx=e.clientX-look.x;
    const dy=e.clientY-look.y;
    look.x=e.clientX;
    look.y=e.clientY;
    player.yaw-=dx*.004;
    player.pitch-=dy*.003;
    player.pitch=Math.max(-1.15,Math.min(1.15,player.pitch));
  });
  const endLook=e=>{
    if(e.pointerId===look.pid) {
      look.active=false;
      look.pid=null;
    }
  };
  canvas.addEventListener("pointerup",endLook);
  canvas.addEventListener("pointercancel",endLook);
  addEventListener("resize",resize);
}

async function createSoundOnStart() {
  // 由“开始游戏”的用户手势触发，适配手机浏览器自动播放限制
  try {
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx) return;
    audioContext=new AudioCtx();
    masterGain=audioContext.createGain();
    masterGain.gain.value=.45;
    masterGain.connect(audioContext.destination);

    const size=audioContext.sampleRate*2;
    const buffer=audioContext.createBuffer(1,size,audioContext.sampleRate);
    const data=buffer.getChannelData(0);
    let smooth=0;
    for(let i=0;i<size;i++) {
      const n=Math.random()*2-1;
