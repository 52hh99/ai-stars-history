
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b20">
<meta name="description" content="群星闪耀：探索人工智能与大语言模型的发展历史。">
<title>群星闪耀｜AI 大模型发展史</title>

<style>
:root {
  color-scheme: dark;
  --bg: #050817;
  --panel: rgba(15, 24, 55, .76);
  --line: rgba(145, 179, 255, .22);
  --text: #eef4ff;
  --muted: #aab8d7;
  --blue: #82c8ff;
  --purple: #b6a1ff;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans SC",
    "Microsoft YaHei", sans-serif;
}
button, input, select { font: inherit; }
button, select { cursor: pointer; }
#space {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
.nebula {
  position: fixed;
  inset: -35%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 25% 35%, rgba(66, 53, 160, .34), transparent 38%),
    radial-gradient(ellipse at 75% 40%, rgba(15, 112, 170, .27), transparent 35%),
    radial-gradient(ellipse at 55% 78%, rgba(120, 44, 155, .2), transparent 37%);
  filter: blur(35px);
  animation: nebulaFlow 28s ease-in-out infinite alternate;
}
.nebula::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 70% 60%, rgba(30, 100, 180, .18), transparent 40%),
    radial-gradient(ellipse at 30% 75%, rgba(75, 35, 130, .2), transparent 35%);
  animation: nebulaFlow2 35s ease-in-out infinite alternate;
}
@keyframes nebulaFlow {
  0% { transform: translate(-3%, -2%) rotate(0deg) scale(1); }
  50% { transform: translate(4%, 3%) rotate(8deg) scale(1.12); }
  100% { transform: translate(-1%, 5%) rotate(-7deg) scale(1.05); }
}
@keyframes nebulaFlow2 {
  from { transform: translate(3%, -4%) rotate(-8deg); }
  to { transform: translate(-5%, 5%) rotate(10deg); }
}
.page {
  position: relative;
  z-index: 1;
  width: min(1050px, 100%);
  margin: auto;
  padding: 18px 18px 55px;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 8px 0 20px;
}
.brand {
  font-weight: 800;
  letter-spacing: 1px;
  color: #e5eaff;
}
.brand span { color: var(--blue); }
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.btn, select, input {
  color: var(--text);
  background: rgba(17, 29, 64, .88);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  min-height: 42px;
  outline: none;
}
.btn {
  transition: background .2s, border-color .2s, transform .2s;
}
.btn:hover { border-color: #8fcaff; }
.btn:active { transform: scale(.97); }
.btn.primary {
  background: linear-gradient(120deg, #294f9a, #6547a8);
  border-color: rgba(177, 193, 255, .45);
}
.btn.active {
  background: linear-gradient(120deg, #176b83, #394ba1);
  border-color: #76e0ff;
}
select { max-width: 100%; }
option { background: #101a38; }
.hero {
  text-align: center;
  padding: clamp(35px, 8vw, 85px) 0 42px;
}
.eyebrow {
  display: inline-block;
  padding: 7px 13px;
  border: 1px solid var(--line);
  background: rgba(13, 26, 57, .64);
  border-radius: 100px;
  color: #b8d8ff;
  font-size: 13px;
  letter-spacing: 2px;
}
h1 {
  font-size: clamp(36px, 8vw, 70px);
  line-height: 1.15;
  letter-spacing: 3px;
  margin: 23px 0 17px;
  background: linear-gradient(110deg, #fff, #8edbff 45%, #c3a5ff 80%, #fff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 45px rgba(103, 157, 255, .12);
}
.subtitle {
  max-width: 650px;
  margin: auto;
  color: var(--muted);
  line-height: 1.9;
  font-size: 15px;
}
.hero-actions {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 8px 0 36px;
}
.stat {
  border: 1px solid var(--line);
  background: rgba(10, 19, 46, .64);
  border-radius: 16px;
  text-align: center;
  padding: 17px 8px;
  backdrop-filter: blur(8px);
}
.stat strong {
  display: block;
  font-size: clamp(23px, 5vw, 34px);
  color: #a8d9ff;
}
.stat span { color: var(--muted); font-size: 12px; }
.section-title {
  font-size: 24px;
  margin: 0 0 8px;
}
.section-desc {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
  margin: 0 0 20px;
}
.panel {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 18px;
  padding: 17px;
  backdrop-filter: blur(12px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .12);
}
.filters {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 145px 145px auto;
  gap: 10px;
  margin-bottom: 24px;
}
.filters input { width: 100%; min-width: 0; }
.filters select { width: 100%; min-width: 0; }
.result-line {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 18px;
}
.timeline {
  position: relative;
  padding-left: 27px;
}
.timeline::before {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 8px;
  left: 8px;
  width: 2px;
  background: linear-gradient(#72d9ff, #9e88ff, rgba(130, 200, 255, .08));
}
.event {
  position: relative;
  margin-bottom: 18px;
  padding: 18px;
  border: 1px solid var(--line);
  background: rgba(10, 18, 44, .78);
  border-radius: 16px;
  animation: cardIn .45s ease both;
}
.event::before {
  content: "";
  position: absolute;
  left: -26px;
  top: 23px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #9ddcff;
  box-shadow: 0 0 13px #62bfff;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.event-top {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 9px;
}
.year {
  color: #8ddaff;
  font-size: 19px;
  font-weight: 800;
}
.tag {
  border: 1px solid rgba(154, 151, 255, .32);
  color: #c4bbff;
  background: rgba(91, 70, 157, .15);
  border-radius: 50px;
  font-size: 12px;
  padding: 4px 9px;
}
.event h3 { margin: 0 0 9px; font-size: 18px; }
.event p {
  margin: 0;
  color: #b7c4df;
  line-height: 1.85;
  font-size: 14px;
}
.event .importance {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid rgba(145, 179, 255, .13);
  color: #d7e5ff;
  font-size: 13px;
  line-height: 1.8;
}
.empty {
  display: none;
  text-align: center;
  color: var(--muted);
  padding: 30px 8px;
}
footer {
  margin-top: 38px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  text-align: center;
  color: #8493b7;
  font-size: 12px;
  line-height: 1.9;
}
@media (max-width: 700px) {
  .page { padding: 12px 13px 35px; }
  .topbar { align-items: flex-start; }
  .controls { width: 100%; }
  .controls .btn { flex: 1; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters input { grid-column: 1 / -1; }
  .filters .btn { width: 100%; }
  .hero { padding-top: 37px; }
  .stats { gap: 7px; }
  .stat { padding: 13px 4px; }
  .panel { padding: 13px; }
  .event { padding: 15px; }
}
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="nebula" aria-hidden="true"></div>
<canvas id="space" aria-hidden="true"></canvas>

<div class="page">
  <header class="topbar">
    <div class="brand">✦ 群星闪耀<span>· AI 宇宙</span></div>
    <div class="controls">
      <button class="btn active" id="meteorToggle" type="button"
        aria-pressed="true">流星雨：开启</button>
      <select id="meteorDensity" aria-label="选择流星密度">
        <option value="low">稀疏流星</option>
        <option value="normal">标准流星雨</option>
        <option value="high" selected>密集流星雨</option>
      </select>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">THE HISTORY OF ARTIFICIAL INTELLIGENCE</div>
      <h1>群星闪耀</h1>
      <p class="subtitle">
从最初的人工智能构想到大语言模型的崛起。沿着时间的轨迹，
探索那些照亮智能时代的思想、突破与创造。
      </p>
      <div class="hero-actions">
        <button class="btn primary" id="exploreBtn" type="button">探索时间线 ↓</button>
        <button class="btn" id="randomBtn" type="button">✧ 随机发现</button>
      </div>
    </section>

    <section class="stats" aria-label="发展史概况">
      <div class="stat"><strong>70+</strong><span>年 AI 探索历程</span></div>
      <div class="stat"><strong>1950—至今</strong><span>跨越时代的演进</span></div>
      <div class="stat"><strong>∞</strong><span>仍在延伸的未来</span></div>
    </section>

    <section id="history">
      <h2 class="section-title">探索 AI 时间线</h2>
      <p class="section-desc">
搜索技术、年份或模型名称，或者按发展阶段筛选。
每一个里程碑，都是智能历史中的一颗星。
      </p>

      <div class="panel">
        <div class="filters">
          <input id="searchInput" type="search"
            placeholder="搜索：Transformer、GPT、深度学习……"
            aria-label="搜索人工智能发展历史">
          <select id="yearFilter" aria-label="按年份筛选">
            <option value="all">全部年份</option>
            <option value="1950">1950—1999</option>
            <option value="2000">2000—2016</option>
            <option value="2017">2017—2021</option>
            <option value="2022">2022—至今</option>
          </select>
          <select id="categoryFilter" aria-label="按分类筛选">
            <option value="all">全部分类</option>
            <option value="idea">理论与思想</option>
            <option value="learning">机器学习</option>
            <option value="deep">深度学习</option>
            <option value="llm">大语言模型</option>
            <option value="multimodal">多模态与智能体</option>
          </select>
          <button class="btn" id="resetBtn" type="button">重置</button>
        </div>
        <p class="result-line" id="resultCount" aria-live="polite"></p>
        <div class="timeline" id="timeline"></div>
        <div class="empty" id="emptyState">没有找到相关记录，试试其他关键词。</div>
      </div>
