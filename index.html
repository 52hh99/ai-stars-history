
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="description" content="群星闪耀：赛博朋克风格的人工智能与大语言模型发展史。">
<title>群星闪耀 | AI 大模型发展史</title>
<style>
:root {
  --bg:#050510;
  --panel:rgba(15,16,39,.86);
  --cyan:#00f5ff;
  --pink:#ff38c7;
  --purple:#9870ff;
  --text:#f1f5ff;
  --muted:#a1a8c7;
  --border:rgba(0,245,255,.24);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;
  min-height:100vh;overflow-x:hidden
}
button,input,select{font:inherit}
button,select{cursor:pointer}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{
  position:fixed;inset:-35%;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 30%,rgba(103,35,255,.25),transparent 38%),
    radial-gradient(ellipse at 78% 38%,rgba(0,220,255,.20),transparent 35%),
    radial-gradient(ellipse at 55% 75%,rgba(255,0,170,.14),transparent 40%);
  filter:blur(38px);animation:nebula 25s ease-in-out infinite alternate
}
.nebula:after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 65% 65%,rgba(0,255,220,.13),transparent 40%);
  animation:nebula2 19s ease-in-out infinite alternate
}
@keyframes nebula{from{transform:translate(-3%,-2%) rotate(0) scale(1)}to{transform:translate(4%,3%) rotate(9deg) scale(1.12)}}
@keyframes nebula2{from{transform:translate(4%,-3%)}to{transform:translate(-5%,5%)}}
.scanlines{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.10;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(120,160,255,.16) 4px)
}
.page{position:relative;z-index:1;width:min(1080px,100%);margin:auto;padding:18px 18px 45px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 18px}
.brand{font-weight:900;letter-spacing:1px;font-size:17px}
.brand .symbol{color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:3px;font-weight:500;margin-top:4px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{
  color:var(--text);background:rgba(12,14,35,.95);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;min-height:42px;outline:none
}
input:focus,select:focus,button:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,245,255,.12)}
button{transition:transform .16s,background .2s,border-color .2s}
button:active{transform:scale(.97)}
.btn{border:1px solid rgba(0,245,255,.4)}
.btn.active,.btn.primary{
  color:#fff;background:linear-gradient(110deg,rgba(0,170,220,.22),rgba(157,51,255,.24));
  border-color:var(--cyan);box-shadow:inset 0 0 14px rgba(0,245,255,.07),0 0 12px rgba(0,245,255,.08)
}
select{max-width:100%}
option{background:#111128}
.hero{text-align:center;padding:clamp(36px,8vw,83px) 0 43px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:8px 13px;
  color:var(--cyan);font-size:11px;letter-spacing:2px;
  border:1px solid rgba(0,245,255,.35);background:rgba(0,245,255,.045);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)
}
.pulse{display:inline-block;width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 10px var(--cyan)}
h1{
  font-size:clamp(43px,10vw,82px);letter-spacing:5px;line-height:1.14;
  margin:23px 0 15px;color:#fff;
  text-shadow:0 0 12px rgba(0,245,255,.8),0 0 38px rgba(0,245,255,.3),4px 3px 0 rgba(255,56,199,.45)
}
.subtitle{max-width:660px;margin:auto;color:#aeb8d8;font-size:14px;line-height:2}
.hero-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
.section-line{height:1px;margin:0 auto 30px;max-width:720px;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 38px}
.stat{
  text-align:center;padding:17px 8px;background:linear-gradient(140deg,rgba(17,23,53,.9),rgba(10,11,29,.9));
  border:1px solid var(--border);position:relative;overflow:hidden
}
.stat:before{content:"";position:absolute;top:0;left:0;width:35%;height:1px;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
.stat strong{display:block;font-size:clamp(22px,5vw,34px);color:var(--cyan);text-shadow:0 0 14px rgba(0,245,255,.25)}
.stat:nth-child(2) strong{color:var(--pink)}
.stat:nth-child(3) strong{color:#b6a0ff}
.stat span{font-size:12px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
.section-title{font-size:23px;margin:0;letter-spacing:1px}
.section-title .hash{color:var(--cyan)}
.section-desc{font-size:13px;color:var(--muted);line-height:1.8;margin:8px 0 20px}
.panel{padding:17px;background:var(--panel);border:1px solid var(--border);box-shadow:0 0 35px rgba(0,0,0,.15)}
.filters{display:grid;grid-template-columns:minmax(0,1fr) 145px 150px auto;gap:9px;margin-bottom:17px}
.filters input,.filters select{width:100%;min-width:0}
.result-line{font-size:12px;color:var(--cyan);margin:0 0 18px}
.timeline{position:relative;padding-left:25px}
.timeline:before{
  content:"";position:absolute;top:4px;bottom:6px;left:6px;width:2px;
  background:linear-gradient(var(--cyan),var(--purple),var(--pink),transparent);
  box-shadow:0 0 10px rgba(0,245,255,.25)
}
.event{
  position:relative;margin:0 0 17px;padding:17px;
  background:linear-gradient(120deg,rgba(15,19,45,.96),rgba(12,12,31,.91));
  border:1px solid rgba(145,156,220,.20);
  transition:border-color .2s,transform .2s;
  animation:rise .35s ease both
}
.event:before{
  content:"";position:absolute;left:-25px;top:22px;width:9px;height:9px;
  background:var(--cyan);border:2px solid #08111f;border-radius:50%;
  box-shadow:0 0 11px var(--cyan)
}
.event:hover{border-color:rgba(0,245,255,.55);transform:translateX(3px)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.event-top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.year{font-size:20px;font-weight:850;color:var(--cyan);text-shadow:0 0 10px rgba(0,245,255,.2)}
.tag{font-size:11px;padding:4px 8px;border:1px solid rgba(255,56,199,.35);color:#ff9ce5;background:rgba(255,56,199,.07)}
.event h3{margin:0 0 9px;font-size:17px;line-height:1.6}
.event p{margin:0;color:#b0bad7;font-size:13px;line-height:1.9}
.importance{margin-top:12px;padding-top:10px;border-top:1px solid rgba(145,156,220,.13);color:#d1e8ff;font-size:12px;line-height:1.8}
.empty{display:none;padding:32px 8px;text-align:center;color:var(--muted);font-size:14px}
footer{margin-top:38px;padding-top:20px;border-top:1px solid var(--border);text-align:center;color:#7782a8;font-size:12px;line-height:2}
footer .footbrand{color:var(--cyan);letter-spacing:2px}
@media(max-width:720px){
  .page{padding:12px 12px 32px}
  .topbar{align-items:flex-start}
  .controls{width:100%}
  .controls .btn{flex:1}
  .controls select{flex:1;min-width:130px}
  .hero{padding-top:36px}
  h1{letter-spacing:3px}
  .filters{grid-template-columns:1fr 1fr}
  .filters input{grid-column:1/-1}
  .filters button{width:100%}
  .stats{gap:7px}
  .stat{padding:13px 4px}
  .panel{padding:12px}
  .event{padding:14px}
  .event:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
