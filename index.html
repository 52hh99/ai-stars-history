<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>王者荣耀 · 涂山红红发展史</title>
<style>
  :root {
    --bg: #0a0303;
    --text: #f5e6e6;
    --muted: #b08a8a;
    --accent: #ff3333;
    --gold: #d4af37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; min-height: 100vh; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); overflow-x: hidden;
  }
  #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }
  .glow-a { position: fixed; width: 80vw; height: 80vw; left: -30vw; top: -30vw; background: radial-gradient(circle, rgba(255, 0, 0, 0.08) 0%, transparent 60%); z-index: 0; pointer-events: none; }
  .glow-b { position: fixed; width: 70vw; height: 70vw; right: -20vw; bottom: -20vw; background: radial-gradient(circle, rgba(180, 0, 0, 0.06) 0%, transparent 60%); z-index: 0; pointer-events: none; }
  .moon { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, rgba(200, 0, 0, 0.05) 40%, transparent 70%); box-shadow: 0 0 80px rgba(255, 0, 0, 0.1); z-index: 0; pointer-events: none; }
  .wrap { position: relative; z-index: 1; width: 92%; max-width: 1120px; margin: 0 auto; padding: 50px 0 80px; }
  header { text-align: center; margin-bottom: 34px; }
  .eyebrow { display: inline-block; padding: 7px 14px; border: 1px solid rgba(255, 51, 51, 0.3); border-radius: 20px; color: var(--accent); font-size: 13px; background: rgba(255, 51, 51, 0.08); margin-bottom: 16px; }
  h1 { margin: 0 0 12px; font-size: 36px; letter-spacing: 1px; line-height: 1.2; background: linear-gradient(90deg, #ffffff, #ff9999, #ff0000); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 20px rgba(255, 0, 0, 0.2); }
  .subtitle { max-width: 720px; margin: 0 auto; color: var(--muted); line-height: 1.8; font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 28px 0 42px; }
  .filter-btn { border: 1px solid rgba(255, 51, 51, 0.2); background: rgba(20, 5, 5, 0.8); color: var(--muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
  .filter-btn:hover { border-color: rgba(255, 51, 51, 0.5); color: #fff; }
  .filter-btn.active { color: #fff; background: linear-gradient(135deg, #cc0000, #ff3333); border-color: transparent; font-weight: bold; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3); }
  .timeline { position: relative; padding: 10px 0; }
  .timeline::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); background: linear-gradient(to bottom, transparent, rgba(255, 51, 51, 0.4) 10%, rgba(255, 51, 51, 0.1) 90%, transparent); }
  .item { position: relative; width: 50%; padding: 0 40px 30px 0; }
  .item:nth-child(even) { margin-left: 50%; padding: 0 0 30px 40px; }
  .item::before { content: ""; position: absolute; top: 24px; right: -7px; width: 12px; height: 12px; border-radius: 50%; background: #0a0303; border: 2px solid var(--accent); z-index: 2; box-shadow: 0 0 10px rgba(255, 51, 51, 0.6); }
  .item:nth-child(even)::before { right: auto; left: -7px; }
  .card { cursor: pointer; border: 1px solid rgba(255, 51, 51, 0.15); border-radius: 12px; background: #140505; padding: 20px; transition: 0.2s; }
  .card:hover { border-color: rgba(255, 51, 51, 0.5); background: #1a0808; }
  .year { display: inline-block; font-size: 13px; font-weight: bold; color: var(--gold); margin-bottom: 8px; }
  .card h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.4; color: #fff; }
  .card p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
  .tags { margin-top: 12px; }
  .tag { display: inline-block; font-size: 12px; color: var(--accent); border: 1px solid rgba(255, 51, 51, 0.2); background: rgba(255, 51, 51, 0.05); padding: 2px 8px; border-radius: 10px; margin-right: 6px; margin-bottom: 6px; }
  .hint { display: block; margin-top: 12px; color: rgba(255, 51, 51, 0.5); font-size: 12px; }
  .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; display: none; background: rgba(10, 2, 2, 0.9); }
  .modal-backdrop.show { display: block; }
  .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255, 51, 51, 0.3); border-radius: 16px; background: #140505; padding: 24px; box-shadow: 0 10px 40px rgba(255, 0, 0, 0.15); }
  .modal-top { margin-bottom: 14px; }
  .modal-year { color: var(--gold); font-weight: bold; font-size: 14px; }
  .close-btn { float: right; border: 1px solid rgba(255, 51, 51, 0.2); background: rgba(255, 51, 51, 0.05); color: var(--accent); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; }
  .close-btn:hover { background: rgba(255, 51, 51, 0.15); }
  .modal h3 { margin: 0 0 14px; font-size: 22px; color: #fff; clear: both; }
  .modal .detail { color: #d4c0c0; line-height: 1.8; font-size: 15px; white-space: pre-wrap; }
  @media (max-width: 760px) {
    h1 { font-size: 28px; }
    .timeline::before { left: 10px; }
    .item, .item:nth-child(even) { width: 100%; margin-left: 0; padding: 0 0 24px 30px; }
    .item::before, .item:nth-child(even)::before { left: 3px; right: auto; top: 20px; }
  }
</style>
</head>

  function renderFilters() {
