
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071321">
<title>雨夜便利店 · 沉浸式互动</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--cyan:#67eaff;--pink:#ff69bd}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;color:#eefaff;font-family:system-ui,"Microsoft YaHei",sans-serif}
button,select,input{font:inherit}
button{cursor:pointer;color:inherit}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#07111f 0%,#183348 57%,#101c29 100%);isolation:isolate}
#sky{position:absolute;inset:0 0 30%;background:radial-gradient(ellipse at 50% 70%,#47768b55,transparent 65%),linear-gradient(#07111f,#20384a)}
#city{position:absolute;bottom:28%;left:-5%;right:-5%;height:38%;display:flex;align-items:flex-end;gap:4px}
.building{flex:1;position:relative;background:linear-gradient(90deg,#091522,#172d40,#0a1521);border-top:1px solid #436176}
.building:after{content:"";position:absolute;inset:8px 4px;background:repeating-linear-gradient(0deg,transparent 0 14px,#f6c96a22 15px 18px),repeating-linear-gradient(90deg,transparent 0 13px,#65d9ff22 14px 17px)}
#road{position:absolute;bottom:0;left:0;right:0;height:36%;background:linear-gradient(#182531,#080e17);clip-path:polygon(27% 0,73% 0,100% 100%,0 100%)}
#road:after{content:"";position:absolute;left:49.5%;top:10%;width:1%;height:90%;background:repeating-linear-gradient(#d7f3ff77 0 15px,transparent 15px 36px)}
.reflection{position:absolute;bottom:0;height:26%;width:7%;filter:blur(10px);opacity:.25;background:linear-gradient(var(--c),transparent)}
.puddle{position:absolute;border-radius:50%;height:3%;background:linear-gradient(90deg,#43b8d733,#b6f1ff25,#43b8d722);border:1px solid #a1eaff22}
#store{position:absolute;left:50%;top:44%;width:min(78vw,600px);height:min(42vh,350px);min-height:230px;transform:translate(-50%,-50%);transition:width .35s,filter .3s}
#roof{position:absolute;top:12%;left:-3%;right:-3%;height:10%;background:linear-gradient(#67859a,#182e40);border:1px solid #91c7dc}
#sign{position:absolute;z-index:2;top:0;left:0;right:0;height:19%;display:flex;justify-content:center;align-items:center;gap:9px;background:#0b1829;border:2px solid var(--cyan);box-shadow:0 0 18px #42dfff77;color:#b7f8ff;font-weight:900;font-size:clamp(15px,3vw,25px);letter-spacing:3px;text-shadow:0 0 12px #51eaff}
#sign small{font-size:9px;color:#ff8bd2;letter-spacing:1px}
#front{position:absolute;top:20%;bottom:0;left:0;right:0;padding:6px;background:linear-gradient(#1a3345,#101b27);border:2px solid #486a80;box-shadow:inset 0 0 35px #5be5ff15,0 0 30px #42cfff20}
#inside{height:100%;display:grid;grid-template-columns:1fr 1fr .62fr;gap:5px;background:#0a1825}
.window{position:relative;overflow:hidden;border:2px solid #67899a;background:linear-gradient(130deg,#22485b,#0c2638 65%,#34515d)}
.window:before{content:"";position:absolute;left:0;right:0;top:0;height:7%;background:#ffe7ad;box-shadow:0 0 18px #ffdd8b}
.shelves{position:absolute;top:15%;left:5%;right:5%;height:58%;display:flex;flex-direction:column;justify-content:space-between}
.shelf{height:29%;display:flex;align-items:flex-end;gap:2px;border-bottom:3px solid #a9b7b9;background:#162a36aa}
.item{flex:1;height:var(--h);background:var(--c);border-radius:2px 2px 0 0;position:relative;min-width:2px}
.item:after{content:"";position:absolute;top:23%;left:10%;right:10%;height:17%;background:#ffffffa0}
.counter{position:absolute;bottom:9%;left:7%;right:7%;height:22%;background:linear-gradient(#8b7966,#332c2a);border-top:4px solid #c0aa8c}
.counter:before{content:"";position:absolute;top:-37%;left:25%;width:37%;height:34%;background:#12202b;border:2px solid #86a8b6;box-shadow:inset 0 0 9px #6affd3}
#fridge{position:absolute;inset:13% 5% 8%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px;border:2px solid #a1e7f7;background:#153448}
.fridge-door{position:relative;border:1px solid #7dd7ed88;background:#8de8ff12}
.bottle{position:absolute;bottom:8%;width:25%;height:65%;border-radius:3px;background:linear-gradient(#b7f7db 0 10%,#25b58a 11% 75%,#08745c 76%);box-shadow:0 0 4px #80ffd655}
#door{position:absolute;inset:0;background:linear-gradient(90deg,#6edfff12,#ffffff03);border:1px solid #b0eaff88;cursor:pointer}
#door.open{background:#6af7df40}
#handle{position:absolute;right:14%;top:42%;width:3px;height:25%;background:#e5fbff;box-shadow:0 0 5px #5ceaff}
#doorText{position:absolute;bottom:10%;width:100%;text-align:center;font-size:9px}
#step{position:absolute;bottom:-3%;right:0;width:32%;height:6%;background:#8ca2b0;border-top:2px solid #d7f3ff}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#people,#cars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.person{position:absolute;left:-10%;bottom:20%;width:17px;height:58px;animation:walk var(--speed) linear var(--delay) infinite}
.umbrella{position:absolute;left:-30%;top:0;width:160%;height:25%;border-radius:100% 100% 10% 10%;background:var(--hat)}
.body{position:absolute;top:25%;left:20%;width:60%;height:53%;background:var(--coat);border-radius:35% 35% 10% 10%}
.head{position:absolute;top:17%;left:32%;width:36%;height:13%;background:#c8a58f;border-radius:50%}
.legs{position:absolute;bottom:0;left:25%;height:25%;width:18%;background:#101722;box-shadow:8px 0 #101722}
@keyframes walk{from{left:-10%}to{left:110%}}
.car{position:absolute;left:-25%;bottom:var(--bottom);width:105px;height:34px;animation:drive var(--speed) linear var(--delay) infinite}
.carbody{position:absolute;bottom:15%;left:3%;right:3%;height:56%;border-radius:7px 12px 3px 3px;background:var(--color);border-top:2px solid #fff7}
.cartop{position:absolute;bottom:62%;left:25%;width:48%;height:30%;background:#9ddcf777;clip-path:polygon(15% 0,80% 0,100% 100%,0 100%)}
.wheel{position:absolute;bottom:0;width:18%;height:30%;background:#060b10;border:2px solid #84949e;border-radius:50%}
.wheel.a{left:16%}.wheel.b{right:14%}
.lamp{position:absolute;right:0;top:38%;height:20%;width:9%;background:#fff4bd;box-shadow:0 0 10px 4px #ffe8a577}
@keyframes drive{from{left:-25%}to{left:120%}}
#mist{position:absolute;inset:30% 0 0;pointer-events:none;background:linear-gradient(transparent,#a8dfff09);animation:fog 8s ease-in-out infinite alternate}
@keyframes fog{to{opacity:.35;transform:translateX(2%)}}
#header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:13px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#header>*{pointer-events:auto}
h1{margin:0;font-size:clamp(18px,4vw,26px);letter-spacing:2px;text-shadow:0 0 12px #51eaff88}
.sub{font-size:9px;color:#9eb9cc;letter-spacing:1px;margin-top:4px}
#status{border:1px solid #72dfff44;border-radius:20px;padding:7px 10px;background:#071522bb;font-size:11px;align-self:flex-start;white-space:nowrap}
#weather{position:absolute;top:88px;left:13px;background:#071522b8;border-left:2px solid var(--cyan);padding:8px 10px;font-size:10px;line-height:1.8;color:#c2d8e5}
#weather strong{color:white}
#caption{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:92%;padding:8px 13px;background:#06111dcc;border:1px solid #79dcff30;border-radius:20px;text-align:center;font-size:11px;color:#e0f3ff}
#panel{position:absolute;bottom:0;left:0;right:0;padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#06101ef2 25%)}
#buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:680px;margin:auto}
.ctrl{min-width:61px;padding:8px 7px;border:1px solid #70dfff38;border-radius:10px;background:#102437ed;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;touch-action:manipulation}
.ctrl .ico{font-size:18px}
.ctrl.active{border-color:#6aeaff;background:#164056;box-shadow:0 0 12px #45dfff24}
.ctrl:active{transform:scale(.96)}
#settings{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:10px auto 0;font-size:10px;color:#c3d6e1}
.setting{display:flex;align-items:center;gap:5px}
select{max-width:85px;background:#122739;color:#e4f8ff;border:1px solid #67d9f655;border-radius:6px;padding:5px;font-size:10px}
input[type=range]{width:70px;accent-color:#66eaff}
#toast{position:absolute;z-index:5;left:50%;top:47%;transform:translate(-50%,-50%);max-width:85%;padding:13px 18px;border:1px solid #69eaff88;border-radius:12px;background:#081827f5;color:#e5faff;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#exitPhoto{display:none;position:absolute;z-index:10;right:12px;top:65px;padding:10px 14px;background:#102739;border:1px solid var(--cyan);border-radius:10px}
body.photo #exitPhoto{display:block}
body.photo #header,body.photo #weather,body.photo #caption,body.photo #panel{display:none}
body.photo #photoFrame{display:block}
#photoFrame{display:none;position:absolute;inset:12px;border:1px solid #e5faff99;pointer-events:none}
body.low .person,body.low .car{opacity:.65}
body.low #mist{display:none}
body.low .reflection{filter:blur(4px)}
body.inside #store{filter:brightness(1.2);width:min(88vw,680px)}
@media(max-width:420px){
 #store{width:94vw;height:34vh;min-height:220px;top:43%}
 #header{padding:10px}
 #weather{top:78px;left:9px}
 .ctrl{min-width:55px;padding:7px 5px}
 .ctrl .ico{font-size:16px}
 #buttons{gap:5px}
 #settings{gap:7px;margin-top:8px}
 #caption{bottom:calc(145px + env(safe-area-inset-bottom,0px))}
}
@media(max-height:550px){
 #store{height:52vh;min-height:180px;top:42%}
 #weather{top:65px}
 #panel{padding-top:5px}
 .ctrl{padding:4px 7px}
 #settings{margin-top:4px}
 #caption{bottom:110px}
}
</style>
</head>
<body>
<div id="scene">
 <div id="sky"></div><div id="city"></div><div id="road"></div>
 <div class="puddle" style="width:27%;left:8%;bottom:7%"></div>
 <div class="puddle" style="width:23%;right:8%;bottom:15%"></div>
 <div class="puddle" style="width:32%;left:36%;bottom:3%"></div>
 <div class="reflection" style="--c:#5ceaff;left:32%"></div>
 <div class="reflection" style="--c:#ff69bd;left:49%;width:5%"></div>
 <div class="reflection" style="--c:#ffd58b;left:61%;width:10%"></div>

 <div id="store">
  <div id="roof"></div>
  <div id="sign">雨夜便利店 <small>OPEN 24H</small></div>
  <div id="front">
   <div id="inside">
    <div class="window"><div class="shelves" id="shelves"></div><div class="counter"></div></div>
    <div class="window"><div id="fridge"></div></div>
    <div class="window"><div id="door"><div id="handle"></div><div id="doorText">点击进店</div></div></div>
   </div>
  </div>
  <div id="step"></div>
 </div>
 <div id="cars"></div><div id="people"></div>
 <canvas id="rain"></canvas><div id="mist"></div>

 <div id="header">
  <div><h1>雨夜便利店</h1><div class="sub">MIDNIGHT CONVENIENCE STORE</div></div>
  <div id="status">● <span id="clock">23:48</span> · 营业中</div>
 </div>
 <div id="weather"><strong>☔ 城市夜雨</strong><br><span id="rainText">中雨 · 18°C</span><br>路面湿滑 · 夜间出行</div>
 <div id="caption">雨声很轻，城市很远。今晚，慢一点也没关系。</div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="photoFrame"></div>
 <button id="exitPhoto">退出拍照模式 ✕</button>

 <div id="panel">
  <div id="buttons">
   <button class="ctrl active" id="viewBtn"><span class="ico">◉</span><span>切换视角</span></button>
   <button class="ctrl" id="rotateBtn"><span class="ico">⟳</span><span>自动旋转</span></button>
   <button class="ctrl" id="enterBtn"><span class="ico">🚪</span><span>进店体验</span></button>
   <button class="ctrl active" id="rainBtn"><span class="ico">🌧</span><span>雨幕开关</span></button>
   <button class="ctrl" id="musicBtn"><span class="ico">♫</span><span>背景音乐</span></button>
   <button class="ctrl" id="soundBtn"><span class="ico">🔊</span><span>雨声音效</span></button>
   <button class="ctrl" id="photoBtn"><span class="ico">▣</span><span>拍照模式</span></button>
  </div>
  <div id="settings">
   <label class="setting">雨量
    <select id="rainLevel"><option value="1">细雨</option><option value="2" selected>中雨</option><option value="3">大雨</option><option value="4">暴雨</option></select>
   </label>
   <label class="setting">音量
    <input id="volume" type="range" min="0" max="100" value="35">
    <span id="volText">35%</span>
   </label>
   <label class="setting">画质
    <select id="quality"><option value="high">精细</option><option value="medium" selected>均衡</option><option value="low">省电</option></select>
   </label>
  </div>
 </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const scene=$('scene');
let toastTimer;
function toast(s){
 const el=$('toast');el.textContent=s;el.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
function active(id,v){$(id).classList.toggle('active',v)}
function label(id,s){$(id).lastElementChild.textContent=s}

// 楼房
for(let i=0;i<24;i++){
 const b=document.createElement('div');b.className='building';
 b.style.height=(28+Math.random()*70)+'%';$('city').appendChild(b);
}
// 商品货架
const colors=['#e65059','#eeb748','#4bbde1','#66c78a','#df79bc','#ef8552','#e4d26c'];
for(let r=0;r<3;r++){
 const row=document.createElement('div');row.className='shelf';
 for(let i=0;i<12;i++){
  const p=document.createElement('div');p.className='item';
  p.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);
  p.style.setProperty('--h',(45+Math.random()*50)+'%');row.appendChild(p);
 }
 $('shelves').appendChild(row);
}
// 冰柜
for(let i=0;i<3;i++){
 const d=document.createElement('div');d.className='fridge-door';
 for(let j=0;j<3;j++){
  const b=document.createElement('div');b.className='bottle';
  b.style.left=(10+j*30)+'%';
  b.style.background=['linear-gradient(#a8f7d0 0 10%,#26ad7e 11% 70%,#08715a 71%)','linear-gradient(#a9eaff 0 10%,#278ed3 11% 70%,#174e87 71%)','linear-gradient(#ffe8a6 0 10%,#e58a36 11% 70%,#a64d28 71%)'][(i+j)%3];
  d.appendChild(b);
 }
 $('fridge').appendChild(d);
}
// 行人
for(let i=0;i<5;i++){
 const p=document.createElement('div');p.className='person';
 p.style.setProperty('--speed',(20+Math.random()*18)+'s');
 p.style.setProperty('--delay',(-Math.random()*30)+'s');
 p.style.setProperty('--coat',['#182d45','#483746','#253e3b','#303b58'][i%4]);
 p.style.setProperty('--hat',['#36bad5','#d94e72','#d2a54a','#8975d6','#a5cbd9'][i]);
 p.innerHTML='<div class="umbrella"></div><div class="head"></div><div class="body"></div><div class="legs"></div>';
 $('people').appendChild(p);
}
// 车辆
for(let i=0;i<3;i++){
 const c=document.createElement('div');c.className='car';
 c.style.setProperty('--speed',(19+i*7)+'s');
 c.style.setProperty('--delay',(-i*8-2)+'s');
 c.style.setProperty('--bottom',(8+i*7)+'%');
 c.style.setProperty('--color',['#254461','#70394b','#677984'][i]);
 c.innerHTML='<div class="cartop"></div><div class="carbody"></div><div class="wheel a"></div><div class="wheel b"></div><div class="lamp"></div>';
 $('cars').appendChild(c);
}

// Canvas 雨幕
const canvas=$('rain'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,drops=[];
let intensity=2,quality='medium',rainOn=true;
let running=true,last=0,raf=0;
function resize(){
 W=innerWidth;H=innerHeight;
 dpr=Math.min(devicePixelRatio||1,quality==='high'?1.5:1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 initDrops();
}
function initDrops(){
 const n=(quality==='low'?90:quality==='medium'?210:380)*intensity/2;
 drops=Array.from({length:Math.round(n)},()=>({
  x:Math.random()*W,y:Math.random()*H,
  len:8+Math.random()*18,v:400+Math.random()*650,
  drift:-35-Math.random()*45,a:.12+Math.random()*.3
 }));
}
function frame(t){
 raf=requestAnimationFrame(frame);
 if(!running||document.hidden)return;
 const interval=quality==='low'?50:quality==='medium'?30:17;
 if(t-last<interval)return;
 const dt=Math.min((t-last)/1000,.05);last=t;
 ctx.clearRect(0,0,W,H);
 if(!rainOn)return;
 ctx.lineWidth=quality==='low'?.7:1;
 for(const d of drops){
  ctx.strokeStyle='rgba(164,219,248,'+(d.a*intensity/2)+')';
  ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.drift*.025,d.y+d.len);ctx.stroke();
  d.x+=d.drift*dt;d.y+=d.v*dt;
  if(d.y>H+25||d.x<-30){d.y=-d.len;d.x=Math.random()*(W+30)}
 }
}
addEventListener('resize',resize,{passive:true});
resize();raf=requestAnimationFrame(frame);

// 页面隐藏时停止无意义绘制，恢复时重新开始
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden){last=0}
});

// 雨量
$('rainLevel').addEventListener('change',e=>{
 intensity=Number(e.target.value);initDrops();
 $('rainText').textContent=['','细雨 · 18°C','中雨 · 18°C','大雨 · 17°C','暴雨 · 16°C'][intensity];
 toast('雨量已调整：'+e.target.options[e.target.selectedIndex].text);
});
// 画质
$('quality').addEventListener('change',e=>{
 quality=e.target.value;
 document.body.classList.toggle('low',quality==='low');
 resize();toast('画质已切换');
});
// 雨幕
$('rainBtn').addEventListener('click',()=>{
 rainOn=!rainOn;active('rainBtn',rainOn);
 toast(rainOn?'雨幕已开启':'雨幕已关闭');
});

// 视角与自动旋转统一管理
let view=0,rotating=false,rotationStart=0;
function applyView(){
 const offset=rotating?Math.sin((performance.now()-rotationStart)/2600)*1.1:0;
 const scale=[1,1.16,.9][view];
 $('store').style.transform=`translate(calc(-50% + ${offset}%),-50%) scale(${scale})`;
}
$('viewBtn').addEventListener('click',()=>{
 rotating=false;active('rotateBtn',false);
 view=(view+1)%3;applyView();
 toast(['已切换标准视角','已切换近景视角','已切换远景视角'][view]);
});
$('rotateBtn').addEventListener('click',()=>{
 rotating=!rotating;rotationStart=performance.now();
 active('rotateBtn',rotating);
 if(!rotating)applyView();
 toast(rotating?'自动镜头已开启':'自动镜头已关闭');
});
function rotateFrame(){
 if(rotating)applyView();
 requestAnimationFrame(rotateFrame);
}
requestAnimationFrame(rotateFrame);

// 进店和离店
let inside=false;
function toggleInside(){
 inside=!inside;
 document.body.classList.toggle('inside',inside);
 $('door').classList.toggle('open',inside);
 $('doorText').textContent=inside?'点击离店':'点击进店';
 label('enterBtn',inside?'离开店内':'进店体验');
 $('caption').textContent=inside
 ?'欢迎光临。热咖啡、暖灯光，还有一小段安静时光。'
 :'雨声很轻，城市很远。今晚，慢一点也没关系。';
 toast(inside?'欢迎来到便利店':'你回到了雨夜街头');
}
$('enterBtn').addEventListener('click',toggleInside);
$('door').addEventListener('click',toggleInside);

// 拍照模式提供始终可见的退出按钮
function setPhoto(on){
 document.body.classList.toggle('photo',on);
 active('photoBtn',on);
}
$('photoBtn').addEventListener('click',()=>setPhoto(true));
$('exitPhoto').addEventListener('click',()=>setPhoto(false));

// 时钟
function clock(){
 const d=new Date();
 $('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
clock();setInterval(clock,15000);

// 音频：用户点击后才创建，防止浏览器自动播放限制
let ac=null,master=null,rainGain=null,musicGain=null;
let noiseSource=null,musicTimer=null,musicNodes=[];
let rainSound=false,music=false,volume=.35;
function initAudio(){
 if(ac){
  if(ac.state==='suspended')ac.$();
  textContentString;
 }
 dgetHours=padStart.String||d.getMinutes;
 padStart(!clock){setInterval(clock);// 音频：用户点击后才创建，防止浏览器自动播放限制 let}
 ac{
  null=masternull();
  rainGain=null.musicGain();null.let.noiseSource=null;musicTimer.null(musicNodes.let);
