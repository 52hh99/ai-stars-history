
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08131c">
<meta name="description" content="雨夜便利店：沉浸式电影风雨夜互动场景">
<title>雨夜便利店 | MIDNIGHT STORE</title>
<style>
:root{
  --cyan:#91eaff;
  --gold:#ffdf9b;
  --glass:#9bdfff;
  --panel:rgba(7,16,25,.91);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#08131c;color:#eef5fa;
  font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
}
button,select,input{font:inherit}
button{color:inherit;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;background:#0b1923;isolation:isolate}
#sky{
 position:absolute;inset:0 0 25%;
 background:
 radial-gradient(ellipse at 50% 55%,#526d7b3a,transparent 48%),
 linear-gradient(180deg,#07101b 0%,#142431 55%,#334653 100%);
}
#sky:after{
 content:"";position:absolute;inset:0;opacity:.22;
 background:repeating-linear-gradient(0deg,transparent 0 3px,#9bb5c008 4px 5px);
}
#haze{
 position:absolute;inset:20% -10% 10%;
 background:radial-gradient(ellipse,#a3d9f012,transparent 70%);
 animation:haze 12s ease-in-out infinite alternate;
 pointer-events:none;
}
@keyframes haze{to{transform:translateX(3%) scale(1.05);opacity:.5}}
#city{position:absolute;inset:0 0 26%;overflow:hidden}
.tower{
 position:absolute;bottom:0;
 background:linear-gradient(90deg,#101b25,#20313c 55%,#111c26);
 border-top:1px solid #718b9a25;
}
.tower:before{
 content:"";position:absolute;inset:8px 5px;
 background:repeating-linear-gradient(0deg,transparent 0 13px,#ffd58b22 14px 17px);
}
.tower:after{
 content:"";position:absolute;inset:8px 5px;
 background:repeating-linear-gradient(90deg,transparent 0 11px,#a6ddf018 12px 15px);
}
#road{
 position:absolute;bottom:0;left:0;right:0;height:35%;
 background:
 linear-gradient(180deg,#26313a 0%,#101820 55%,#090f15 100%);
 clip-path:polygon(27% 0,73% 0,100% 100%,0 100%);
 overflow:hidden;
}
#road:before{
 content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(0deg,transparent 0 32px,#c4e4f009 33px 35px);
}
#roadLines{
 position:absolute;top:8%;bottom:0;left:49.5%;width:1%;
 background:repeating-linear-gradient(180deg,#e3edf1 0 10px,transparent 10px 27px);
 opacity:.65;
}
.puddle{
 position:absolute;border-radius:50%;
 background:linear-gradient(100deg,#b6e9ff10,#7ec9e72a,#d9efff0b);
 border:1px solid #b5e8ff25;
 box-shadow:inset 0 0 12px #80d9ff0b;
}
#reflections{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.reflection{
 position:absolute;bottom:0;height:27%;
 width:7%;opacity:.22;filter:blur(10px);
 background:linear-gradient(180deg,var(--color),transparent);
 transform:perspective(100px) rotateX(-8deg);
}
#store{
 position:absolute;left:50%;top:43%;
 width:min(82vw,680px);height:min(45vh,390px);min-height:245px;
 transform:translate(-50%,-50%);
 transform-origin:center;
 transition:width .35s,filter .35s;
 filter:drop-shadow(0 16px 25px #0008);
}
#roof{
 position:absolute;top:10%;left:-3%;right:-3%;height:12%;
 background:linear-gradient(#607785,#253844 65%,#14222c);
 border:1px solid #849aa5;
 box-shadow:0 6px 12px #0005;
 transform:perspective(500px) rotateX(-4deg);
}
#sign{
 position:absolute;z-index:3;top:0;left:0;right:0;height:20%;
 display:flex;justify-content:center;align-items:center;gap:9px;
 background:linear-gradient(180deg,#101d2b,#091521);
 border:2px solid #8eeaff;
 box-shadow:0 0 12px #65dfff8a,inset 0 0 16px #3bcfff18;
 color:#c5f6ff;font-weight:900;
 font-size:clamp(14px,2.7vw,24px);letter-spacing:3px;
 text-shadow:0 0 9px #65e8ff;
}
#sign small{font-size:9px;color:#ff9bd5;letter-spacing:1px}
#awning{
 position:absolute;top:19%;left:-2%;right:-2%;height:8%;
 background:repeating-linear-gradient(90deg,#e3e0d6 0 9%,#a5484d 9% 18%);
 border-bottom:3px solid #594047;
 box-shadow:0 5px 9px #0005;
}
#front{
 position:absolute;top:25%;left:0;right:0;bottom:0;
 padding:6px;background:linear-gradient(135deg,#344b59,#172632);
 border:2px solid #78909c;
 box-shadow:inset 0 0 22px #80dfff12;
}
#interior{
 position:relative;width:100%;height:100%;
 display:grid;grid-template-columns:1fr 1fr .62fr;gap:5px;
 padding:4px;background:#172733;
}
.window{
 position:relative;overflow:hidden;
 border:2px solid #7e9ba8;
 background:
 linear-gradient(110deg,#c5eaff08,transparent 32%,#d1f2ff09 58%,transparent),
 linear-gradient(180deg,#172f3d,#0e1c28);
}
.window:before{
 content:"";position:absolute;z-index:2;top:0;left:0;right:0;height:7%;
 background:linear-gradient(#fff1c5,#ffdc92);
 box-shadow:0 0 14px #ffda8d;
}
.window:after{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(112deg,#fff2,transparent 24%,transparent 74%,#c7f0ff09);
}
#shelves{
 position:absolute;top:13%;left:5%;right:5%;height:64%;
 display:flex;flex-direction:column;justify-content:space-between;
}
.shelf{
 position:relative;height:28%;display:flex;align-items:flex-end;
 gap:2px;border-bottom:5px solid #8b999c;
 background:linear-gradient(#172a35,#263641);
 box-shadow:0 4px 5px #0004;
}
.product{
 position:relative;flex:1;min-width:2px;height:var(--height);
 border-radius:3px 3px 1px 1px;background:var(--product);
 box-shadow:inset -3px 0 2px #0005;
}
.product:before{
 content:"";position:absolute;top:-8%;left:18%;width:64%;height:10%;
 background:inherit;border-radius:3px 3px 0 0;
}
.product:after{
 content:"";position:absolute;top:27%;left:9%;right:9%;height:18%;
 background:#fff9;
}
#counter{
 position:absolute;left:7%;right:7%;bottom:8%;height:22%;
 background:linear-gradient(#9b8976,#57483e 18%,#332a27);
 border-top:4px solid #c5b39d;
 box-shadow:0 4px 10px #0007;
}
#register{
 position:absolute;left:30%;top:-33%;width:32%;height:31%;
 background:#17232b;border:2px solid #8ca4ae;
 box-shadow:inset 0 0 9px #8ce8ff28;
}
#register:after{
 content:"";position:absolute;inset:28% 15%;
 background:#70dbb0;box-shadow:0 0 7px #70dbb0;
}
#fridge{
 position:absolute;inset:13% 5% 7%;
 display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
 padding:4px;border:2px solid #9cc6d2;
 background:linear-gradient(90deg,#0d2634,#1d4050,#0c2432);
 box-shadow:0 0 10px #77e7ff20;
}
.fridge-door{
 position:relative;border:1px solid #b2e9f05c;
 background:linear-gradient(90deg,#ffffff05,#7ddcff16,#ffffff05);
}
.bottle{
 position:absolute;bottom:8%;width:23%;height:var(--bh);
 border-radius:3px 3px 5px 5px;
 background:var(--bottle);
 box-shadow:inset -2px 0 2px #0004,0 0 3px #9eefff30;
}
.bottle:before{
 content:"";position:absolute;top:-9%;left:28%;width:44%;height:12%;
 background:#b5e7eb;border-radius:2px 2px 0 0;
}
#door{
 position:relative;width:100%;height:100%;overflow:hidden;
 background:linear-gradient(90deg,#b2e9ff08,#fff1,#b2e9ff06);
 border:1px solid #b0e3ef88;
 cursor:pointer;
}
#door.open{background:#c0f8ff35}
#door:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(115deg,transparent 30%,#fff2 45%,transparent 55%);
 pointer-events:none;
}
#handle{
 position:absolute;right:14%;top:42%;height:25%;width:3px;
 background:#e6f9ff;box-shadow:0 0 6px #9beaff;
}
#doorLabel{
 position:absolute;bottom:8%;width:100%;
 text-align:center;font-size:8px;color:#e0edf2;
}
#step{
 position:absolute;bottom:-3%;right:0;width:32%;height:6%;
 background:linear-gradient(#b9cbd1,#718895);
 border-top:2px solid #dcecf1;
}
#rain,#glassRain{
 position:absolute;inset:0;width:100%;height:100%;
 pointer-events:none;
}
#glassRain{opacity:.45}
#people,#cars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.person{
 position:absolute;left:-12%;bottom:19%;
 width:clamp(13px,2vw,21px);height:clamp(42px,7vw,68px);
 animation:walk var(--speed) linear var(--delay) infinite;
 filter:drop-shadow(0 0 4px #0008);
}
.umbrella{
 position:absolute;left:-30%;top:0;width:160%;height:25%;
 border-radius:90% 90% 8% 8%;background:var(--umbrella);
 border-bottom:2px solid #c4e9f0;
}
.head{
 position:absolute;top:19%;left:33%;width:34%;height:12%;
 border-radius:50%;background:#b59a87;
}
.coat{
 position:absolute;top:28%;left:18%;width:64%;height:48%;
 background:var(--coat);border-radius:35% 35% 8% 8%;
}
.legs{
 position:absolute;bottom:0;left:27%;width:17%;height:25%;
 background:#111820;box-shadow:7px 0 #111820;
}
@keyframes walk{from{left:-12%}to{left:112%}}
.car{
 position:absolute;left:-28%;bottom:var(--bottom);
 width:clamp(75px,13vw,135px);height:clamp(25px,4vw,40px);
 animation:drive var(--speed) linear var(--delay) infinite;
 filter:drop-shadow(0 4px 4px #0008);
}
.carBody{
 position:absolute;left:2%;right:2%;bottom:12%;height:53%;
 background:var(--car);border-radius:8px 12px 3px 3px;
 border-top:2px solid #ffffff70;
}
.carRoof{
 position:absolute;left:24%;bottom:57%;width:50%;height:32%;
 background:linear-gradient(100deg,#badce8a0,#2c4859);
 clip-path:polygon(18% 0,77% 0,100% 100%,0 100%);
}
.wheel{
 position:absolute;bottom:0;width:17%;height:30%;
 border-radius:50%;background:#080c10;border:2px solid #8696a0;
}
.wheel.left{left:17%}.wheel.right{right:15%}
.headlamp{
 position:absolute;right:0;top:37%;height:20%;width:9%;
 background:#fff4c4;box-shadow:0 0 10px 5px #fff0a455;
}
.tailLamp{
 position:absolute;left:0;top:37%;height:20%;width:7%;
 background:#ff4054;box-shadow:0 0 9px #ff4054;
}
@keyframes drive{from{left:-28%}to{left:120%}}
#header{
 position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;
 padding:13px 14px;display:flex;justify-content:space-between;
 align-items:flex-start;gap:8px;pointer-events:none;
}
#header>*{pointer-events:auto}
h1{margin:0;font-size:clamp(18px,4vw,26px);letter-spacing:2px;text-shadow:0 0 12px #6adfff55}
.subtitle{margin-top:4px;font-size:9px;letter-spacing:1px;color:#9bb1bf}
#status{
 padding:7px 10px;border:1px solid #85dfff3b;border-radius:20px;
 background:#06111bbd;font-size:10px;white-space:nowrap;
}
#weather{
 position:absolute;top:85px;left:13px;padding:8px 10px;
 border-left:2px solid var(--cyan);background:#07131dc2;
 font-size:10px;line-height:1.8;color:#c1d3df;
}
#weather strong{color:#fff}
#caption{
 position:absolute;left:50%;bottom:calc(153px + env(safe-area-inset-bottom,0px));
 transform:translateX(-50%);width:max-content;max-width:92%;
 padding:8px 13px;border:1px solid #b5e7ff27;
 border-radius:24px;background:#07121bcc;
 color:#e5f2f8;font-size:11px;text-align:center;
}
#panel{
 position:absolute;bottom:0;left:0;right:0;
 padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px));
 background:linear-gradient(transparent,#07111de8 23%,#07111df8);
}
#buttons{
 display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
 max-width:720px;margin:auto;
}
.ctrl{
 min-width:57px;padding:8px 6px;border:1px solid #81dfff3d;
 border-radius:10px;background:linear-gradient(#172c3be8,#0b1926f5);
 display:flex;flex-direction:column;align-items:center;gap:4px;
 font-size:10px;transition:background .15s,border-color .15s;
}
.ctrl .ico{font-size:18px;line-height:1.1}
.ctrl.active{border-color:#91edff;background:#164052;box-shadow:0 0 10px #49dfff20}
.ctrl:active{transform:scale(.96)}
#settings{
 display:flex;justify-content:center;align-items:center;
 flex-wrap:wrap;gap:11px;margin:10px auto 0;
 font-size:10px;color:#c7d8e2;
}
.setting{display:flex;align-items:center;gap:5px}
select{
 max-width:85px;background:#122738;color:#e6f6ff;
 border:1px solid #78dfff4c;border-radius:6px;padding:5px;font-size:10px;
}
input[type=range]{width:70px;accent-color:#83eaff}
#toast{
 position:absolute;z-index:15;top:47%;left:50%;
 transform:translate(-50%,-50%);max-width:86%;
 padding:13px 18px;background:#081925f5;
 border:1px solid #8deaff88;border-radius:12px;
 color:#e8faff;text-align:center;font-size:13px;
 opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.show{opacity:1}
#photoFrame{
 display:none;position:absolute;inset:12px;
 border:1px solid #f0faff9c;pointer-events:none;
}
#exitPhoto{
 display:none;position:absolute;z-index:20;right:12px;top:65px;
 padding:10px 14px;border:1px solid #8ceaff;
 border-radius:10px;background:#0b1c29ed;
}
body.photo #photoFrame,body.photo #exitPhoto{display:block}
body.photo #header,body.photo #weather,body.photo #caption,body.photo #panel{display:none}
body.low #haze{display:none}
body.low .person,body.low .car{animation-duration:calc(var(--speed,20s) * 1.2)}
@media(max-width:430px){
 #store{width:94vw;height:35vh;min-height:220px;top:43%}
 #header{padding:10px}
 #weather{top:77px;left:9px;padding:7px 8px;font-size:9px}
 #buttons{gap:5px}
 .ctrl{min-width:52px;padding:7px 4px;font-size:9px}
 .ctrl .ico{font-size:16px}
 #settings{gap:7px;margin-top:8px}
 input[type=range]{width:60px}
 #caption{bottom:calc(150px + env(safe-area-inset-bottom,0px));font-size:10px}
}
@media(max-height:560px){
 #store{height:52vh;min-height:185px;top:42%}
 #weather{top:65px}
 #panel{padding-top:5px}
 .ctrl{padding:5px}
 #settings{margin-top:5px}
 #caption{bottom:112px}
}
@media(prefers-reduced-motion:reduce){
 #haze{animation:none}
}
</style>
</head>
<body>
<div id="app">
 <div id="sky"></div>
 <div id="city"></div>
 <div id="haze"></div>
 <div id="road"><div id="roadLines"></div></div>

 <div id="reflections">
  <div class="reflection" style="--color:#43d9ed;left:31%"></div>
  <div class="reflection" style="--color:#f65eaf;left:47%;width:6%"></div>
  <div class="reflection" style="--color:#ffdc91;left:60%;width:10%"></div>
 </div>
 <div class="puddle" style="width:27%;height:3%;left:8%;bottom:7%"></div>
 <div class="puddle" style="width:22%;height:2.5%;right:8%;bottom:15%"></div>
 <div class="puddle" style="width:29%;height:2%;left:38%;bottom:3%"></div>

 <div id="store">
  <div id="roof"></div>
  <div id="sign">雨夜便利店 <small>OPEN 24H</small></div>
  <div id="awning"></div>
  <div id="front">
   <div id="interior">
    <div class="window">
     <div id="shelves"></div>
     <div id="counter"><div id="register"></div></div>
    </div>
    <div class="window"><div id="fridge"></div></div>
    <div class="window">
     <div id="door" role="button" tabindex="0" aria-label="进入或离开便利店">
      <div id="handle"></div><div id="doorLabel">点击进店</div>
     </div>
    </div>
   </div>
  </div>
  <div id="step"></div>
 </div>

 <div id="cars"></div>
 <div id="people"></div>
 <canvas id="rain"></canvas>
 <canvas id="glassRain"></canvas>

 <div id="header">
  <div><h1>雨夜便利店</h1><div class="subtitle">MIDNIGHT CONVENIENCE STORE</div></div>
  <div id="status">● <span id="clock">23:48</span> · 营业中</div>
 </div>
 <div id="weather"><strong>☔ 城市夜雨</strong><br><span id="rainText">中雨 · 18°C</span><br>路面湿滑 · 夜间出行</div>
 <div id="caption">雨声很轻，城市很远。今晚，慢一点也没关系。</div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="photoFrame"></div>
 <button id="exitPhoto">退出拍照模式 ✕</button>

 <div id="panel">
  <div id="buttons">
   <button class="ctrl active" id="viewBtn"><span class="ico">◉</span><span>切换视角</span></button>
   <button class="ctrl" id="rotateBtn"><span class="ico">⟳</span><span>自动旋转</span></button>
   <button class="ctrl" id="enterBtn"><span class="ico">🚪</span><span>进店体验</span></button>
   <button class="ctrl active" id="rainBtn"><span class="ico">🌧</span><span>雨幕开关</span></button>
   <button class="ctrl" id="musicBtn"><span class="ico">♫</span><span>背景音乐</span></button>
   <button class="ctrl" id="soundBtn"><span class="ico">🌧</span><span>雨声音效</span></button>
   <button class="ctrl" id="photoBtn"><span class="ico">▣</span><span>拍照模式</span></button>
  </div>
  <div id="settings">
   <label class="setting">雨量
    <select id="rainLevel">
     <option value="1">细雨</option><option value="2" selected>中雨</option>
     <option value="3">大雨</option><option value="4">暴雨</option>
    </select>
   </label>
   <label class="setting">音量
    <input id="volume" type="range" min="0" max="100" value="35">
    <span id="volumeText">35%</span>
   </label>
   <label class="setting">画质
    <select id="quality">
     <option value="high">精细</option><option value="medium" selected>均衡</option><option value="low">省电</option>
    </select>
   </label>
  </div>
 </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const app=$('app');
let toastTimer=0;
function toast(message){
 const el=$('toast');el.textContent=message;el.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove('show'),1900);
}
function setActive(id,value){$(id).classList.toggle('active',value)}
function setLabel(id,value){$(id).lastElementChild.textContent=value}

// 城市楼宇
for(let i=0;i<25;i++){
 const el=document.createElement('div');el.className='tower';
 el.style.left=(i*4.2)+'%';
 el.style.width=(3+Math.random()*3)+'%';
 el.style.height=(18+Math.random()*65)+'%';
 $('city').appendChild(el);
}

// 商品货架
const productColors=['#d44749','#e4ae48','#359bbd','#5b9c73','#c56b98','#d87543','#e4d6a2','#e9eceb'];
for(let r=0;r<3;r++){
 const shelf=document.createElement('div');shelf.className='shelf';
 for(let i=0;i<13;i++){
  const item=document.createElement('div');item.className='product';
  item.style.setProperty('--product',productColors[Math.floor(Math.random()*productColors.length)]);
  item.style.setProperty('--height',(48+Math.random()*49)+'%');
  shelf.appendChild(item);
 }
 $('shelves').appendChild(shelf);
}

// 饮料冰柜
const bottleColors=[
 'linear-gradient(#d9f7dd 0 10%,#36ad75 11% 72%,#176b4c 73%)',
 'linear-gradient(#d5f1ff 0 10%,#268fc3 11% 72%,#17517e 73%)',
 'linear-gradient(#ffe6ad 0 10%,#dc8739 11% 72%,#984c2c 73%)',
 'linear-gradient(#f4d8e9 0 10%,#c55c91 11% 72%,#7e355c 73%)'
];
for(let i=0;i<3;i++){
 const door=document.createElement('div');door.className='fridge-door';
 for(let j=0;j<4;j++){
  const b=document.createElement('div');b.className='bottle';
  b.style.left=(4+j*24)+'%';
  b.style.setProperty('--bh',(55+Math.random()*25)+'%');
  b.style.setProperty('--bottle',bottleColors[(i+j)%bottleColors.length]);
  door.appendChild(b);
 }
 $('fridge').appendChild(door);
}

// 行人
for(let i=0;i<5;i++){
 const p=document.createElement('div');p.className='person';
 const speed=(20+Math.random()*16)+'s';
 p.style.setProperty('--speed',speed);
 p.style.setProperty('--delay',(-Math.random()*30)+'s');
 p.style.setProperty('--coat',['#192a3b','#44343b','#263a36','#313c51','#39352e'][i]);
 p.style.setProperty('--umbrella',['#4e9da8','#a84d60','#b8a06a','#7774a8','#9aadb4'][i]);
 p.innerHTML='<div class="umbrella"></div><div class="head"></div><div class="coat"></div><div class="legs"></div>';
 $('people').appendChild(p);
}

// 汽车
for(let i=0;i<3;i++){
 const car=document.createElement('div');car.className='car';
 car.style.setProperty('--speed',(20+i*7)+'s');
 car.style.setProperty('--delay',(-i*8-2)+'s');
 car.style.setProperty('--bottom',(8+i*7)+'%');
 car.style.setProperty('--car',['#263b4b','#5c333d','#66757e'][i]);
 car.innerHTML='<div class="carRoof"></div><div class="carBody"></div><div class="wheel left"></div><div class="wheel right"></div><div class="headlamp"></div><div class="tailLamp"></div>';
 $('cars').appendChild(car);
}

// Canvas 雨幕，限制设备像素比与帧率
const rainCanvas=$('rain'),rainCtx=rainCanvas.getContext('2d');
const glassCanvas=$('glassRain'),glassCtx=glassCanvas.getContext('2d');
let W=0,H=0,dpr=1;
let rainDrops=[],glassDrops=[];
let rainLevel=2,quality='medium',rainEnabled=true;
let lastFrame=0,frameId=0,frameNo=0;
function resize(){
 W=innerWidth;H=innerHeight;
 dpr=Math.min(devicePixelRatio||1,quality==='high'?1.5:1);
 for(const c of [rainCanvas,glassCanvas]){
  c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
  c.style.width=W+'px';c.style.height=H+'px';
 }
 rainCtx.setTransform(dpr,0,0,dpr,0,0);
 glassCtx.setTransform(dpr,0,0,dpr,0,0);
 makeRain();makeGlass();
}
function makeRain(){
 const base=quality==='low'?85:quality==='medium'?200:380;
 rainDrops=Array.from({length:Math.round(base*rainLevel/2)},()=>({
  x:Math.random()*W,y:Math.random()*H,
  length:8+Math.random()*19,
  speed:420+Math.random()*680,
  drift:-35-Math.random()*55,
  alpha:.13+Math.random()*.3
 }));
}
function makeGlass(){
 const n=quality==='low'?10:quality==='medium'?22:38;
 glassDrops=Array.from({length:n},()=>({
  x:Math.random()*W,y:Math.random()*H,
  r:1+Math.random()*3,
  speed:8+Math.random()*24,
  wobble:Math.random()*6
 }));
}
function drawRain(dt){
 rainCtx.clearRect(0,0,W,H);
 if(!rainEnabled)return;
 rainCtx.lineWidth=quality==='low'?.65:.9;
 rainCtx.lineCap='round';
 for(const d of rainDrops){
  rainCtx.strokeStyle='rgba(190,222,239,'+(d.alpha*rainLevel/2)+')';
  rainCtx.beginPath();rainCtx.moveTo(d.x,d.y);
  rainCtx.lineTo(d.x+d.drift*.025,d.y+d.length);rainCtx.stroke();
  d.x+=d.drift*dt;d.y+=d.speed*dt;
  if(d.y>H+25||d.x<-30){d.y=-d.length;d.x=Math.random()*(W+30)}
 }
}
function drawGlass(dt){
 glassCtx.clearRect(0,0,W,H);
 if(!rainEnabled||quality==='low')return;
 for(const d of glassDrops){
  d.y+=d.speed*dt;
  if(d.y>H+10){d.y=-10;d.x=Math.random()*W}
  glassCtx.beginPath();
  glassCtx.ellipse(d.x,d.y,d.r*.65,d.r*1.5,0,0,Math.PI*2);
  glassCtx.fillStyle='rgba(195,232,248,.12)';
  glassCtx.fill();
  glassCtx.strokeStyle='rgba(213,242,255,.3)';
  glassCtx.lineWidth=.7;glassCtx.stroke();
  glassCtx.beginPath();
  glassCtx.arc(d.x-d.r*.2,d.y-d.r*.4,Math.max(.4,d.r*.2),0,Math.PI*2);
  glassCtx.fillStyle='rgba(255,255,255,.55)';glassCtx.fill();
 }
}
function animate(time){
 frameId=requestAnimationFrame(animate);
 if(document.hidden)return;
 const interval=quality==='low'?50:quality==='medium'?30:17;
 if(time-lastFrame<interval)return;
 const dt=Math.min((time-lastFrame)/1000,.05);lastFrame=time;
 drawRain(dt);
 if(++frameNo%2===0)drawGlass(dt*2);
}
addEventListener('resize',resize,{passive:true});
resize();frameId=requestAnimationFrame(animate);

// 音频统一管理。需用户主动点击才初始化 AudioContext
let audio=null,master=null,rainGain=null,musicGain=null,noiseSource=null;

function setupAudio(){
 if(audio){
  if(audio.state==='suspended')audio.resume();
  return true;
 }
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){toast('当前浏览器不支持网页音频');return false}
 try{
  audio=new AC();
  master=audio.createGain();master.gain.value=volume;master.connect(audio.destination);
  const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  noiseSource=audio.createBufferSource();noiseSource.buffer=buffer;noiseSource.loop=true;
  const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1250;
  rainGain=audio.createGain();rainGain.gain.value=0;
  noiseSource.connect(filter);filter.connect(rainGain);rainGain.connect(master);
  noiseSource.start();
  musicGain=audio.createGain();musicGain.gain.value=0;musicGain.connect(master);
  return true;
 }catch(err){
  toast('音频初始化失败，请刷新后重试');return false;
 }
}
