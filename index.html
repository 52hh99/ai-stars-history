<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>雨夜冰角少女 · 3D模型</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26363c;color:#eefaff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
  #scene{position:fixed;inset:0}
  .hud{position:fixed;left:12px;right:12px;top:12px;z-index:2;pointer-events:none}
  .title{font-size:18px;font-weight:750;letter-spacing:1px;text-shadow:0 2px 12px #0009}
  .sub{font-size:12px;opacity:.78;margin-top:4px}
  .panel{position:fixed;left:12px;right:12px;bottom:12px;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{border:1px solid #bdefff55;border-radius:14px;background:#172c35cc;color:#effcff;padding:10px 13px;font-size:13px;backdrop-filter:blur(8px)}
  button:active{transform:scale(.97);background:#315563}
  .hint{position:fixed;right:12px;top:64px;font-size:11px;opacity:.75;text-align:right;pointer-events:none}
  #status{position:fixed;left:12px;bottom:68px;font-size:11px;color:#c9f5ff;opacity:.8;z-index:2}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud"><div class="title">雨夜 · 冰角少女</div><div class="sub">程序化 3D 角色概念模型 · 可旋转查看</div></div>
<div class="hint">单指拖动：旋转<br>双指：缩放/平移（视设备而定）</div>
<div id="status">正在加载 3D 场景…</div>
<div class="panel">
  <button id="rotate">自动旋转：开</button>
  <button id="rain">雨效：开</button>
  <button id="light">灯光：切换</button>
  <button id="reset">重置视角</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const mount = document.getElementById('scene');
const status = document.getElementById('status');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x34464b);
scene.fog = new THREE.FogExp2(0x34464b, 0.035);

const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5.6, 4.0, 8.8);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
mount.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 4.8;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI*0.88;

scene.add(new THREE.HemisphereLight(0xc9f2ff, 0x26313c, 2.0));
const key = new THREE.DirectionalLight(0xfff3df, 3.0);
key.position.set(4,8,5); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
const rim = new THREE.DirectionalLight(0x66dfff, 3.1); rim.position.set(-5,5,-4); scene.add(rim);
const fill = new THREE.PointLight(0x4eb6d0, 15, 12); fill.position.set(1,3,3); scene.add(fill);

const mat=(color, roughness=.65, metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const skin=mat(0xf1dfe0,.78), hair=mat(0xe6f2f3,.36), hairShade=mat(0xb5d2d9,.42),
 horn=mat(0x8dd9e8,.3,.12), hornLight=mat(0xc4f4ff,.28,.12),
 cloth=mat(0xeaf4f4,.58), cyan=mat(0x8bd9e7,.4), gold=mat(0xd7ae55,.38,.45),
 dark=mat(0x24313a,.8), eye=mat(0x3c83b6,.22), white=mat(0xffffff,.25),
 red=mat(0xc94e51,.7), brown=mat(0x67483b,.7), birdWhite=mat(0xf4eee4,.85);

const root=new THREE.Group(); scene.add(root);
function mesh(geo, material, parent=root, pos=[0,0,0], scale=null, rot=null){
 const o=new THREE.Mesh(geo,material); o.position.set(...pos); if(scale)o.scale.set(...scale); if(rot)o.rotation.set(...rot);
 o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;
}
function sphere(parent,material,pos,scale){return mesh(new THREE.SphereGeometry(1,24,16),material,parent,pos,scale);}
function cylinder(parent,material,a,b,r1,r2,segments=12){
 const start=new THREE.Vector3(...a), end=new THREE.Vector3(...b), dir=end.clone().sub(start);
 const m=mesh(new THREE.CylinderGeometry(r2,r1,dir.length(),segments),material,parent,start.clone().add(end).multiplyScalar(.5).toArray());
 m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize()); return m;
}
function curveTube(parent, points, radius, material, seg=32){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 return mesh(new THREE.TubeGeometry(curve,seg,radius,8,false),material,parent);
}
function coneBetween(parent,material,base,tip,radius,radial=9){
 const a=new THREE.Vector3(...base), b=new THREE.Vector3(...tip), d=b.clone().sub(a);
 const m=mesh(new THREE.ConeGeometry(radius,d.length(),radial),material,parent,a.clone().add(b).multiplyScalar(.5).toArray());
 m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m;
}

// Base plinth and wet ground
const ground=mesh(new THREE.CylinderGeometry(3.7,3.9,.22,64),mat(0x293d43,.35,.25),scene,[0,-.18,0],[1,1,.82]);
const floor=mesh(new THREE.PlaneGeometry(200,200),mat(0x34464b,.34,.1),scene,[0,-.31,0],[1,1,1],[-Math.PI/2,0,0]);
const ring=mesh(new THREE.TorusGeometry(2.3,.025,8,80),mat(0x5cbdce,.3,.4),scene,[0,-.055,0],[1,1,.82]);ring.rotation.x=Math.PI/2;

// Body / legs
const body=new THREE.Group();root.add(body);
sphere(body,cloth,[0,2.02,0],[.62,.78,.38]);
sphere(body,skin,[0,2.76,0],[.22,.34,.22]); // neck
// dress skirt, layered tapered forms
mesh(new THREE.ConeGeometry(.88,1.2,32),cloth,body,[0,1.18,0],[1,.92,.68]);
mesh(new THREE.ConeGeometry(.72,.95,32),cyan,body,[0,1.25,.015],[1,.92,.68]);
mesh(new THREE.ConeGeometry(.62,.86,32),cloth,body,[0,1.37,.04],[1,.92,.68]);
for(let i=0;i<7;i++){
 const a=i*Math.PI*2/7;
 curveTube(body,[[Math.cos(a)*.42,1.85,Math.sin(a)*.29],[Math.cos(a)*.56,1.35,Math.sin(a)*.39],[Math.cos(a)*.78,.72,Math.sin(a)*.47]],.018,gold,16);
}
cylinder(body,dark,[-.22,.25,0],[-.22,.68,0],.12,.11);
cylinder(body,dark,[.22,.25,0],[.22,.68,0],.12,.11);
sphere(body,mat(0xf3f4f1),[-.22,.22,.02],[.18,.09,.24]);
sphere(body,mat(0xf3f4f1),[.22,.22,.02],[.18,.09,.24]);

// Arms and gold shoulder decorations
cylinder(body,skin,[-.47,2.48,0],[-.78,1.95,.12],.13,.105);
cylinder(body,cloth,[-.78,1.95,.12],[-.65,1.55,.24],.13,.10);
cylinder(body,skin,[.47,2.48,0],[.76,2.04,.10],.13,.105);
cylinder(body,cloth,[.76,2.04,.10],[.68,1.68,.25],.13,.10);
sphere(body,gold,[-.48,2.47,.01],[.20,.10,.19]);
sphere(body,gold,[.48,2.47,.01],[.20,.10,.19]);
for(const s of [-1,1]){
 const badge=sphere(body,gold,[s*.39,2.13,.33],[.12,.17,.045]);
 curveTube(body,[[s*.4,2.05,.37],[s*.47,1.94,.4],[s*.58,1.9,.39]],.018,gold,12);
}

// Head, face, ears
const head=new THREE.Group();root.add(head);head.position.set(0,3.32,.02);
sphere(head,skin,[0,0,0],[.58,.72,.49]);
sphere(head,skin,[0,-.32,.19],[.43,.30,.35]); // jaw
sphere(head,skin,[-.56,-.02,.0],[.12,.2,.12]);sphere(head,skin,[.56,-.02,.0],[.12,.2,.12]);
// bangs and side locks
sphere(head,hair,[0,.43,-.03],[.61,.38,.51]);
for(let i=0;i<9;i++){
 const x=-.48+i*.12;
 const y=.28+Math.sin(i*.9)*.09;
 const z=.39-Math.abs(x)*.12;
 const lock=mesh(new THREE.SphereGeometry(1,16,12),hair,head,[x,y,z],[.12,.36,.11],[0,0,(x+.1)*.7]);
 coneBetween(head,hair,[x,y-.13,z+.02],[x+.035,y-.47,z+.12],.105,8);
}
for(const s of [-1,1]){
 // long flowing side hair
 sphere(head,hair,[s*.48,-.58,-.02],[.20,.72,.22]);
 curveTube(head,[[s*.48,-.35,.02],[s*.60,-.7,.03],[s*.72,-1.05,.0],[s*.82,-1.32,-.08]],.10,hair,24);
 curveTube(head,[[s*.39,-.4,.18],[s*.49,-.78,.22],[s*.45,-1.05,.25]],.027,hairShade,18);
}
// back hair cape
sphere(head,hair,[0,-.45,-.31],[.60,.83,.30]);
for(let i=0;i<11;i++){
 const x=-.5+i*.1;
 curveTube(head,[[x,.08,-.45],[x*1.18,-.5,-.52],[x*1.32,-1.05,-.4],[x*1.5,-1.35,-.2]],.025+(i%3)*.008,i%3===0?hairShade:hair,22);
}
// Eyes, brows, nose, mouth facing +Z
for(const s of [-1,1]){
 sphere(head,white,[s*.235,.0,.421],[.15,.115,.055]);
 sphere(head,eye,[s*.23,-.005,.468],[.075,.084,.025]);
 sphere(head,mat(0x172d42,.2),[s*.23,-.005,.488],[.034,.052,.012]);
 sphere(head,white,[s*.205,.035,.5],[.022,.023,.01]);
 curveTube(head,[[s*.10,.13,.44],[s*.23,.17,.47],[s*.35,.13,.43]],.018,dark,12);
 curveTube(head,[[s*.13,.16,.43],[s*.25,.19,.45],[s*.34,.15,.42]],.012,hairShade,12);
}
sphere(head,mat(0xd7b9b6),[0,-.13,.49],[.035,.025,.025]);
curveTube(head,[[-.06,-.28,.47],[0,-.30,.49],[.06,-.28,.47]],.012,mat(0x986f78),10);

// Icy antler-like horns, branching outward and upward
for(const s of [-1,1]){
 const base=[s*.31,.52,-.02], mid=[s*.52,.88,-.01], high=[s*.69,1.22,-.04], tip=[s*.91,1.52,-.08];
 curveTube(head,[base,mid,high,tip],.075,horn,24);
 curveTube(head,[[s*.56,.91,-.015],[s*.76,1.02,-.03],[s*.93,1.10,-.06]],.045,hornLight,16);
 curveTube(head,[[s*.67,1.18,-.04],[s*.70,1.38,-.06],[s*.72,1.58,-.07]],.04,hornLight,16);
 curveTube(head,[[s*.70,1.34,-.06],[s*.88,1.42,-.08]],.027,horn,12);
 sphere(head,hornLight,[s*.31,.53,.0],[.10,.08,.09]);
}
// fin / ribbon ornaments behind head
for(const s of [-1,1]){
 const fin=new THREE.Group();head.add(fin);fin.position.set(s*.50,-.25,-.24);fin.rotation.y=s*.35;
 const shape=new THREE.Shape();shape.moveTo(0,0);shape.quadraticCurveTo(.35,.45,.82,.58);shape.quadraticCurveTo(.56,.18,.18,.02);shape.quadraticCurveTo(.56,-.12,.74,-.32);shape.quadraticCurveTo(.28,-.27,0,0);
 mesh(new THREE.ShapeGeometry(shape),cyan,fin,[0,0,0]);
 curveTube(fin,[[0,0,.01],[.27,.04,.02],[.78,.56,.01]],.018,hornLight,16);
}

// Gold chest ornament
sphere(root,gold,[0,2.42,.405],[.14,.17,.07]);
sphere(root,cyan,[0,2.43,.47],[.055,.07,.025]);
curveTube(root,[[-.25,2.25,.35],[0,2.14,.43],[.25,2.25,.35]],.018,gold,16);

// Small companion bird, left of character
const bird=new THREE.Group();root.add(bird);bird.position.set(-1.18,1.48,.15);
sphere(bird,birdWhite,[0,.35,0],[.48,.57,.38]);
sphere(bird,birdWhite,[.23,.72,.04],[.35,.32,.31]);
