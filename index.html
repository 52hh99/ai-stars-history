</div>

/* =========================================================
   0. 加载 three.js —— 四个 CDN 依次兜底
   ========================================================= */
const statusEl = document.getElementById('status');
function setStatus(text, isError = false){
  statusEl.textContent = text;
  statusEl.style.color = isError ? '#ffb4a8' : '#c9f5ff';
  statusEl.style.display = text ? 'block' : 'none';
}

const CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://esm.sh/three@0.160.0'
];

async function loadThree(){
  const errors = [];
  for (const url of CDNS){
    try{
      const mod = await import(/* @vite-ignore */ url);
      if (mod && mod.WebGLRenderer){
        console.log('[three.js] 已从', url, '加载');
        return mod;
      }
      errors.push(url + ' → 模块内容异常');
    }catch(err){
      errors.push(url + ' → ' + (err && err.message ? err.message : err));
      console.warn('[three.js] 加载失败：', url, err);
    }
  }
  throw new Error(errors.join('\n'));
}

let THREE;
try{
  THREE = await loadThree();
}catch(err){
  console.error(err);
  setStatus('3D 引擎加载失败，请检查网络后刷新页面\n（已尝试 jsDelivr / unpkg / cdnjs / esm.sh）', true);
  throw err;
}

/* =========================================================
   1. 渲染器 / 场景 / 相机 / 灯光
   ========================================================= */
const mount = document.getElementById('scene');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x34464b);
scene.fog = new THREE.FogExp2(0x34464b, 0.035);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.6, 4.0, 8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9f2ff, 0x26313c, 2.0));

const keyLight = new THREE.DirectionalLight(0xfff3df, 3.0);

/* =========================================================
   2. 材质与几何工具
   ========================================================= */
const mat = (color, roughness = .65, metalness = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness });
const matDS = (color, roughness = .65, metalness = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, side: THREE.DoubleSide });

const skin      = mat(0xf1dfe0, .78);
const hair      = mat(0xe6f2f3, .36);
const hairShade = mat(0xb5d2d9, .42);
const horn      = mat(0x8dd9e8, .30, .12);
const hornLight = mat(0xc4f4ff, .28, .12);
const cloth     = mat(0xeaf4f4, .58);
const cyan      = mat(0x8bd9e7, .40);
const cyanDS    = matDS(0x8bd9e7, .40);       // 双面：用于片状鳍饰
const gold      = mat(0xd7ae55, .38, .45);
const dark      = mat(0x24313a, .80);

const red       = mat(0xc94e51, .70);

const birdWhite = mat(0xf4eee4, .85);

const root = new THREE.Group();
scene.add(root);

function mesh(geo, material, parent = root, pos = [0, 0, 0], scale = null, rot = null){
  const o = new THREE.Mesh(geo, material);
  o.position.set(pos[0], pos[1], pos[2]);
  if (scale) o.scale.set(scale[0], scale[1], scale[2]);
  if (rot)   o.rotation.set(rot[0], rot[1], rot[2]);
  o.castShadow = true;
  o.receiveShadow = true;
  parent.add(o);
  return o;
}
const sphere = (parent, material, pos, scale) =>
  mesh(new THREE.SphereGeometry(1, 24, 16), material, parent, pos, scale);

function cylinder(parent, material, a, b, r1, r2, segments = 12){
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end   = new THREE.Vector3(b[0], b[1], b[2]);
  const dir   = end.clone().sub(start);
  const mid   = start.clone().add(end).multiplyScalar(0.5);
  const m = mesh(new THREE.CylinderGeometry(r2, r1, dir.length(), segments),
                 material, parent, [mid.x, mid.y, mid.z]);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

function curveTube(parent, points, radius, material, seg = 32){
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  return mesh(new THREE.TubeGeometry(curve, seg, radius, 8, false), material, parent);
}

function coneBetween(parent, material, base, tip, radius, radial = 9){
  const a = new THREE.Vector3(base[0], base[1], base[2]);
  const b = new THREE.Vector3(tip[0], tip[1], tip[2]);
  const d = b.clone().sub(a);
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const m = mesh(new THREE.ConeGeometry(radius, d.length(), radial),
                 material, parent, [mid.x, mid.y, mid.z]);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}

bird.position.set(-1.18, BIRD_BASE_Y, .15);

sphere(bird, red, [-.08, .80, -.02], [.31, .18, .30]);   // 冠羽
