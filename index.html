<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>王者荣耀 · 李白发展史</title>
<style>
  :root {
    --bg: #030a0e; /* 深邃的青黑水墨色 */
    --text: #e0f7fa;
    --muted: #8ab4b6;
    --accent: #00ffcc; /* 青莲色 */
    --gold: #e2c070;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); overflow-x: hidden;
  }
  
  /* 背景 Canvas */
  #bgCanvas {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 0; display: block; pointer-events: none;
  }

  /* 背景水墨氛围光 */
  .bg-glow {
    position: fixed; z-index: 0; pointer-events: none; border-radius: 50%;
    will-change: transform; transform: translate3d(0, 0, 0);
  }
  .glow-a {
    width: 80vmax; height: 80vmax; left: -30vmax; top: -30vmax;
    background: radial-gradient(circle, rgba(0, 255, 204, 0.06) 0%, transparent 60%);
    animation: drift 30s ease-in-out infinite alternate;
  }
  .glow-b {
    width: 70vmax; height: 70vmax; right: -20vmax; bottom: -20vmax;
    background: radial-gradient(circle, rgba(0, 180, 255, 0.05) 0%, transparent 60%);
    animation: drift 40s ease-in-out infinite alternate-reverse;
  }
  /* 中心月轮 */
  .moon {
    position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
    width: 40vw; height: 40vw; max-width: 400px; max-height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 255, 204, 0.15) 0%, rgba(0, 255, 204, 0.03) 50%, transparent 70%);
    box-shadow: 0 0 100px rgba(0, 255, 204, 0.1);
    z-index: 0; pointer-events: none;
  }
  
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(4vw, 4vh) scale(1.1); }
  }

  .wrap {
    position: relative; z-index: 1; width: min(1120px, calc(100% - 32px));
    margin: 0 auto; padding: 56px 0 80px;
  }
  header { text-align: center; margin-bottom: 34px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px;
    border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 999px;
    color: var(--accent); font-size: 13px; background: rgba(0, 255, 204, 0.08); margin-bottom: 16px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  
  h1 {
    margin: 0 0 12px; font-size: clamp(30px, 5vw, 54px); letter-spacing: .04em; line-height: 1.15;
    background: linear-gradient(90deg, #ffffff, #a4ffec 45%, #00ffcc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
  }
  .subtitle { max-width: 720px; margin: 0 auto; color: var(--muted); line-height: 1.8; font-size: 15px; }

  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 28px 0 42px; }
  .filter-btn {
    appearance: none; border: 1px solid rgba(0, 255, 204, 0.2); background: rgba(4, 15, 20, 0.8);
    color: var(--muted); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; transition: .25s ease;
  }
  .filter-btn:hover { color: var(--accent); border-color: rgba(0, 255, 204, 0.5); }
  .filter-btn.active {
    color: #02120f; background: linear-gradient(135deg, #a4ffec, #00ffcc); border-color: transparent; font-weight: 700;
    box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
  }

  .timeline { position: relative; padding: 8px 0; }
  .timeline::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, rgba(0, 255, 204, 0.4) 8%, rgba(0, 255, 204, 0.4) 50%, rgba(0, 255, 204, 0.1) 92%, transparent);
  }
  .item {
    position: relative; width: 50%; padding: 0 42px 34px 0;
    animation: rise .55s ease forwards; opacity: 0; transform: translateY(18px);
  }
  .item:nth-child(even) { margin-left: 50%; padding: 0 0 34px 42px; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  
  .item::before {
    content: ""; position: absolute; top: 24px; right: -8px; width: 15px; height: 15px; border-radius: 50%;
    background: #030a0e; border: 2px solid var(--accent); 
    box-shadow: 0 0 0 5px rgba(0, 255, 204, 0.1), 0 0 20px rgba(0, 255, 204, 0.6); z-index: 2;
  }
  .item:nth-child(even)::before { right: auto; left: -7px; }

  .card {
    position: relative; cursor: pointer; border: 1px solid rgba(0, 255, 204, 0.15); border-radius: var(--radius);
    background: rgba(6, 18, 24, 0.9); padding: 20px 20px 18px; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); transition: .28s ease;
    backdrop-filter: blur(4px);
  }
  .card:hover { 
    transform: translateY(-4px); border-color: rgba(0, 255, 204, 0.5); 
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 204, 0.1);
  }
  
  .year { display: inline-block; font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.35; color: #fff; }
  .card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
  
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .tag { 
    font-size: 12px; color: var(--accent); border: 1px solid rgba(0, 255, 204, 0.25); 
    background: rgba(0, 255, 204, 0.05); padding: 4px 9px; border-radius: 999px; 
  }
  .hint { display: block; margin-top: 14px; color: rgba(0, 255, 204, 0.4); font-size: 12px; }

  /* 模态框 */
  .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(1, 5, 8, 0.9); backdrop-filter: blur(8px); }
  .modal-backdrop.show { display: flex; }
  .modal { 
    width: min(640px, 100%); max-height: 85vh; overflow: auto; 
    border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 24px; 
    background: #061218; padding: 30px; box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 255, 204, 0.1); 
  }
  .modal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .modal-year { color: var(--gold); font-weight: 800; }
  .close-btn { border: 1px solid rgba(0, 255, 204, 0.2); background: rgba(0, 255, 204, 0.05); color: var(--accent); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 20px; transition: 0.2s; }
  .close-btn:hover { background: rgba(0, 255, 204, 0.2); }
  .modal h3 { margin: 0 0 14px; font-size: 24px; color: #fff; }
  .modal .detail { color: #b0d4d4; line-height: 1.9; font-size: 15px; white-space: pre-wrap; }

  @media (max-width: 760px) {
    .timeline::before { left: 10px; transform: none; }
    .item, .item:nth-child(even) { width: 100%; margin-left: 0; padding: 0 0 26px 34px; }
    .item::before, .item:nth-child(even)::before { left: 3px; right: auto; top: 22px; }
  }
</style>
</head>
<body>
  <!-- 背景元素 -->
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>
  <div class="moon"></div>
  <canvas id="bgCanvas"></canvas>

  <main class="wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span> 一篇诗，一斗酒，一曲长歌，一剑天涯</div>
      <h1>王者荣耀 · 李白发展史</h1>
      <p class="subtitle">青莲剑仙编年史 · 从初代吸血剑仙，到无相机制的技术型刺客。</p>
    </header>

    <div class="toolbar" id="toolbar"></div>
    <section class="timeline" id="timeline"></section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <article class="modal">
      <div class="modal-top">
        <div class="modal-year" id="modalYear"></div>
        <button class="close-btn" id="closeBtn">×</button>
      </div>
      <h3 id="modalTitle"></h3>
      <div class="detail" id="modalDetail"></div>
      <div class="tags" id="modalTags"></div>
    </article>
  </div>

  var activeCategory = "全部";

  for (var i = 0; i < events.length; i++) {
    if (categories.indexOf(events[i].category) === -1) {
      categories.push(events[i].category);
    }
  }

  function renderFilters() {
    var html = "";
    for (var i = 0; i < categories.length; i++) {
      var cat = categories[i];
      var activeClass = (cat === activeCategory) ? "active" : "";
      html += '<button class="filter-btn ' + activeClass + '" data-cat="' + cat + '">' + cat + '</button>';
    }
    toolbarEl.innerHTML = html;
    var btns = toolbarEl.querySelectorAll(".filter-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].onclick = function() {
        activeCategory = this.getAttribute("data-cat");
        renderFilters();
        renderTimeline();
      };
    }
  }

  function renderTimeline() {
    var list = [];
    if (activeCategory === "全部") {
      list = events;
    } else {
      for (var k = 0; k < events.length; k++) {
        if (events[k].category === activeCategory) list.push(events[k]);
      }
    }

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var idx = events.indexOf(e);
      var delay = Math.min(i * 60, 480);
      var tagHtml = "";
      for (var t = 0; t < Math.min(3, e.tags.length); t++) {
        tagHtml += '<span class="tag">' + e.tags[t] + '</span>';
      }
      html += '<article class="item" style="animation-delay:' + delay + 'ms">' +

                  '<span class="year">' + e.year + '</span>' +
                  '<h2>' + e.title + '</h2>' +
                  '<p>' + e.summary + '</p>' +
                  '<div class="tags">' + tagHtml + '</div>' +
                  '<span class="hint">点击卡片查看详情 →</span>' +
                '</div>' +
              '</article>';

    timelineEl.innerHTML = html;

        document.getElementById("modalTitle").textContent = e.title;
        document.getElementById("modalDetail").textContent = e.detail;
        
        var tagHtml = "";
        for (var i = 0; i < e.tags.length; i++) {
          tagHtml += '<span class="tag">' + e.tags[i] + '</span>';
        }
        document.getElementById("modalTags").innerHTML = tagHtml;
        
        backdrop.className = "modal-backdrop show";
      };
    }
  }

  closeBtn.onclick = function() { backdrop.className = "modal-backdrop"; };
