
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08131e">
<title>雨夜便利店 · Midnight Store</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#effaff;font-family:system-ui,"Microsoft YaHei",sans-serif}
button,select,input{font:inherit}
button{touch-action:manipulation;color:inherit;cursor:pointer}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#08121f,#1b3444 65%,#09141d)}
#sky{position:absolute;inset:0 0 24%;background:radial-gradient(ellipse at 50% 52%,#52758855,transparent 65%),linear-gradient(#07111e,#263c4b)}
#city{position:absolute;inset:0 0 27%;overflow:hidden}
.building{position:absolute;bottom:0;background:linear-gradient(90deg,#0c1823,#203442,#101c28)}
.building:after{content:"";position:absolute;inset:7px;background:repeating-linear-gradient(0deg,transparent 0 13px,#e8c58b20 14px 17px),repeating-linear-gradient(90deg,transparent 0 13px,#a6e6ff18 14px 17px)}
#road{position:absolute;bottom:0;left:0;width:100%;height:38%;background:linear-gradient(#243744,#101c27 60%,#080e14);clip-path:polygon(26% 0,74% 0,100% 100%,0 100%)}
#road:after{content:"";position:absolute;inset:5% 49.3% 0;background:repeating-linear-gradient(180deg,#eaf6fa 0 10px,transparent 10px 29px);opacity:.6}
.reflection{position:absolute;bottom:0;height:28%;width:8%;filter:blur(9px);opacity:.26;pointer-events:none}
#store{position:absolute;z-index:3;left:50%;top:43%;width:min(88vw,660px);height:min(43vh,350px);min-height:220px;transform:translate(-50%,-50%);transition:transform .3s}
#sign{height:19%;position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid #9aeaff;background:#0b1929;box-shadow:0 0 18px #53dfff8c;color:#d4faff;font-weight:900;letter-spacing:3px;font-size:clamp(15px,3.2vw,24px);text-shadow:0 0 9px #61e5ff}
#sign small{font-size:9px;letter-spacing:1px;color:#ff8fc9}
#awning{height:8%;margin:0 -2%;background:repeating-linear-gradient(90deg,#e8d8b6 0 12%,#a94b50 12% 24%);border-bottom:3px solid #6b5552;box-shadow:0 5px 10px #0007}
#front{height:73%;padding:5px;border:2px solid #8199a7;background:#182b39;box-shadow:0 12px 28px #0008}
#inside{height:100%;display:grid;grid-template-columns:1fr 1fr .62fr;gap:5px;padding:4px;background:#10212e}
.window{position:relative;overflow:hidden;border:2px solid #7896a4;background:linear-gradient(115deg,#d7f4ff0b,transparent 45%),linear-gradient(#254352,#0b1b27)}
.window:before{content:"";position:absolute;top:0;left:0;right:0;height:7%;background:#ffe0a0;box-shadow:0 0 13px #ffd37a;z-index:2}
#shelves{position:absolute;top:13%;left:5%;right:5%;height:65%;display:flex;flex-direction:column;justify-content:space-between}
.shelf{height:28%;display:flex;align-items:flex-end;gap:2px;border-bottom:5px solid #a5aeb1;background:#293d49;box-shadow:0 4px 5px #0007}
.product{flex:1;height:var(--h);background:var(--c);border-radius:3px 3px 0 0;position:relative}
.product:after{content:"";position:absolute;top:30%;left:10%;right:10%;height:18%;background:#fff9}
#counter{position:absolute;bottom:7%;left:5%;right:5%;height:20%;background:linear-gradient(#b2a08d,#59483d 30%,#322824);border-top:4px solid #dfc7a4}
#register{position:absolute;left:30%;top:-36%;width:32%;height:34%;background:#12232d;border:2px solid #a4c6ce}
#register:after{content:"";position:absolute;inset:25%;background:#8ce8c0;box-shadow:0 0 7px #8ce8c0}
#fridge{position:absolute;inset:14% 5% 7%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:2px solid #a4d5df;background:#102c3b}
.fridgeDoor{position:relative;border:1px solid #b9eaff70;background:linear-gradient(90deg,#ffffff08,#81dcff18,#ffffff08)}
.bottle{position:absolute;bottom:8%;width:20%;height:var(--h);background:var(--c);border-radius:3px 3px 4px 4px;box-shadow:inset -2px 0 2px #0006}
.bottle:before{content:"";position:absolute;top:-10%;left:28%;width:44%;height:12%;background:#d5eff5}
#door{width:100%;height:100%;position:relative;cursor:pointer;background:linear-gradient(90deg,#d9f5ff08,#fff1,#c5efff09);border:1px solid #b5e5f4;transition:background .2s}
#door.open{background:#a7edff3b;box-shadow:inset 0 0 20px #7ceaff33}
#handle{position:absolute;right:15%;top:40%;height:25%;width:4px;background:#e5fbff;box-shadow:0 0 8px #9aeaff}
#doorText{position:absolute;bottom:7%;width:100%;font-size:9px;text-align:center}
#step{height:5%;width:32%;margin-left:auto;background:#9bafb9;border-top:2px solid #dcebf0}
#rain,#glass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rain{z-index:8}
#glass{z-index:7;opacity:.6}
#people,#cars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#people{z-index:5}
#cars{z-index:4}
.person{position:absolute;left:-12%;bottom:20%;width:23px;height:65px;animation:walk var(--duration) linear var(--delay) infinite;filter:drop-shadow(0 3px 5px #000a)}
.umbrella{position:absolute;top:0;left:-25%;width:150%;height:24%;border-radius:90% 90% 5% 5%;background:var(--umbrella);border-bottom:2px solid #d8f1f5}
.head{position:absolute;top:19%;left:33%;width:34%;height:13%;border-radius:50%;background:#c2a28a}
.coat{position:absolute;top:30%;left:18%;width:64%;height:45%;border-radius:30% 30% 5% 5%;background:var(--coat)}
.legs{position:absolute;bottom:0;left:27%;width:18%;height:28%;background:#0a1016;box-shadow:8px 0 #0a1016}
@keyframes walk{from{left:-12%}to{left:112%}}
.car{position:absolute;left:-30%;bottom:var(--bottom);width:clamp(80px,15vw,145px);height:42px;animation:drive var(--duration) linear var(--delay) infinite;filter:drop-shadow(0 4px 5px #000b)}
.carRoof{position:absolute;left:24%;bottom:55%;width:53%;height:32%;background:linear-gradient(90deg,#7599a8,#1b3547);clip-path:polygon(15% 0,78% 0,100% 100%,0 100%)}
.carBody{position:absolute;bottom:12%;left:2%;right:2%;height:52%;background:var(--car);border-radius:9px 13px 4px 4px;border-top:2px solid #b6d4e2}
.wheel{position:absolute;bottom:0;width:18%;height:29%;border:2px solid #8b9ca4;border-radius:50%;background:#080b10}
.wheel.l{left:15%}.wheel.r{right:15%}
.headlamp{position:absolute;right:0;top:40%;width:9%;height:18%;background:#fff6cb;box-shadow:0 0 13px 7px #fff1a95c}
.taillamp{position:absolute;left:0;top:40%;width:8%;height:18%;background:#ff4054;box-shadow:0 0 12px #ff304c}
@keyframes drive{from{left:-30%}to{left:125%}}
#header{position:absolute;z-index:10;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px;pointer-events:none}
h1{margin:0;font-size:clamp(19px,4vw,27px);letter-spacing:2px;text-shadow:0 0 10px #7deaff66}
.sub{margin-top:4px;font-size:9px;letter-spacing:1px;color:#9db4c3}
#clock{font-size:10px;padding:7px 10px;border:1px solid #9aeaff50;border-radius:20px;background:#07131ddf}
#weather{position:absolute;z-index:10;top:77px;left:12px;font-size:10px;line-height:1.8;padding:8px 10px;background:#081520cc;border-left:2px solid #91eaff}
#caption{position:absolute;z-index:10;bottom:155px;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;font-size:11px;padding:8px 12px;border:1px solid #b9e9ff30;border-radius:20px;background:#07121ddd}
#controls{position:absolute;z-index:12;left:0;right:0;bottom:0;padding:12px 7px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#07111df2 22%,#07111dfc)}
#buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;max-width:720px;margin:auto}
.ctrl{min-width:54px;padding:8px 5px;border:1px solid #83dfff50;border-radius:9px;background:linear-gradient(#183141,#0b1926);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px}
.ctrl .ico{font-size:18px}
.ctrl.active{border-color:#a2f0ff;background:#17465a;box-shadow:0 0 10px #55dfff26}
.ctrl:active{transform:scale(.96)}
#settings{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:10px;color:#c9dbe5}
select{max-width:80px;padding:5px;color:#eefaff;background:#122839;border:1px solid #8bdfff50;border-radius:6px;font-size:10px}
input[type=range]{width:65px;accent-color:#8deaff}
#volumeText{min-width:28px}
#toast{position:absolute;z-index:20;top:48%;left:50%;transform:translate(-50%,-50%);max-width:90%;padding:12px 16px;border:1px solid #8deaff;background:#071925f5;border-radius:10px;text-align:center;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#error{display:none;position:absolute;z-index:30;left:8px;right:8px;top:115px;background:#591e28;color:#fff;padding:10px;border:1px solid #ff9ba7;border-radius:8px;font-size:12px;overflow-wrap:anywhere}
#exitPhoto{display:none;position:absolute;z-index:25;right:12px;top:65px;padding:9px 12px;border:1px solid #a0edff;border-radius:9px;background:#0a1928}
#photoFrame{display:none;position:absolute;z-index:22;inset:10px;border:1px solid #e7f9ff99;pointer-events:none}
body.photo #header,body.photo #weather,body.photo #caption,body.photo #controls{display:none}
body.photo #exitPhoto,body.photo #photoFrame{display:block}
body.low #glass{display:none}
body.low .reflection{filter:blur(4px)}
@media(max-width:430px){
 #store{width:94vw;height:35vh;min-height:215px;top:43%}
 #buttons{gap:4px}
 .ctrl{min-width:49px;padding:7px 3px;font-size:9px}
 .ctrl .ico{font-size:16px}
 #settings{gap:6px}
 #caption{bottom:151px;font-size:10px}
}
@media(max-height:560px){
 #store{height:52vh;min-height:175px;top:40%}
 #controls{padding-top:4px}
 .ctrl{padding:4px}
 #weather{top:62px}
 #caption{bottom:108px}
}
</style>
</head>
<body>
<div id="scene">
 <div id="sky"></div><div id="city"></div>
 <div id="road"></div>
 <div class="reflection" style="left:30%;background:#43d9ed"></div>
 <div class="reflection" style="left:46%;background:#f65eaf;width:6%"></div>
 <div class="reflection" style="left:62%;background:#ffdc91;width:10%"></div>

 <div id="store">
  <div id="sign">雨夜便利店 <small>OPEN 24H</small></div>
  <div id="awning"></div>
  <div id="front">
   <div id="inside">
    <div class="window"><div id="shelves"></div><div id="counter"><div id="register"></div></div></div>
    <div class="window"><div id="fridge"></div></div>
    <div class="window"><div id="door" role="button" tabindex="0" aria-label="进出便利店"><div id="handle"></div><div id="doorText">点击进店</div></div></div>
   </div>
  </div>
  <div id="step"></div>
 </div>

 <div id="cars"></div><div id="people"></div>
 <canvas id="glass"></canvas><canvas id="rain"></canvas>

 <header id="header">
  <div><h1>雨夜便利店</h1><div class="sub">MIDNIGHT CONVENIENCE STORE</div></div>
  <div id="clock">23:48 · 营业中</div>
 </header>
 <div id="weather">☔ <b>城市夜雨</b><br><span id="weatherText">中雨 · 18°C</span><br>路面湿滑 · 夜间出行</div>
 <div id="caption">雨声很轻，城市很远。今晚，慢一点也没关系。</div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="error" role="alert"></div>
 <div id="photoFrame"></div>
 <button id="exitPhoto">退出拍照模式 ✕</button>

 <div id="controls">
  <div id="buttons">
   <button class="ctrl active" id="viewBtn"><span class="ico">◉</span><span>切换视角</span></button>
   <button class="ctrl" id="rotateBtn"><span class="ico">⟳</span><span>自动旋转</span></button>
   <button class="ctrl" id="enterBtn"><span class="ico">🚪</span><span>进店体验</span></button>
   <button class="ctrl active" id="rainBtn"><span class="ico">🌧</span><span>雨幕开关</span></button>
   <button class="ctrl" id="musicBtn"><span class="ico">♫</span><span>背景音乐</span></button>
   <button class="ctrl" id="soundBtn"><span class="ico">💧</span><span>雨声音效</span></button>
   <button class="ctrl" id="photoBtn"><span class="ico">▣</span><span>拍照模式</span></button>
  </div>
  <div id="settings">
   <label>雨量 <select id="rainLevel"><option value="1">细雨</option><option value="2" selected>中雨</option><option value="3">大雨</option><option value="4">暴雨</option></select></label>
   <label>音量 <input id="volume" type="range" min="0" max="100" value="35"><span id="volumeText">35%</span></label>
   <label>画质 <select id="quality"><option value="high">精细</option><option value="medium" selected>均衡</option><option value="low">省电</option></select></label>
  </div>
 </div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const toastEl=$("toast");
let toastTimer;
function toast(s){
 toastEl.textContent=s;
 toastEl.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toastEl.classList.remove("show"),1800);
}
function active(id,on){$(id).classList.toggle("active",!!on)}
function fail(err){
 const e=$("error");
 e.style.display="block";
 e.textContent="网页运行错误："+(err&&err.message?err.message:String(err));
}

// 页面级错误可见化，避免静默失效
window.addEventListener("error",e=>fail(e.message||e.error));
window.addEventListener("unhandledrejection",e=>fail(e.reason||"异步任务失败"));

try{
// 城市建筑
for(let i=0;i<25;i++){
 const b=document.createElement("div");
 b.className="building";
 b.style.left=(i*4.15)+"%";
 b.style.width=(3+Math.random()*3)+"%";
 b.style.height=(20+Math.random()*60)+"%";
 $("city").appendChild(b);
}

// 便利店商品
const colors=["#df4148","#e8b447","#3e9fc2","#55a274","#d36b9a","#d8793e","#eee0b2","#e8eeee"];
for(let r=0;r<3;r++){
 const s=document.createElement("div");s.className="shelf";
 for(let i=0;i<13;i++){
  const p=document.createElement("div");p.className="product";
  p.style.setProperty("--c",colors[Math.floor(Math.random()*colors.length)]);
  p.style.setProperty("--h",(48+Math.random()*48)+"%");
  s.appendChild(p);
 }
 $("shelves").appendChild(s);
}
const bottleColors=["#38af76","#299bd0","#df8a3a","#c45c90"];
for(let i=0;i<3;i++){
 const d=document.createElement("div");d.className="fridgeDoor";
 for(let j=0;j<4;j++){
  const b=document.createElement("div");b.className="bottle";
  b.style.left=(5+j*24)+"%";
  b.style.setProperty("--h",(55+Math.random()*30)+"%");
  b.style.setProperty("--c",bottleColors[(i+j)%4]);
  d.appendChild(b);
 }
 $("fridge").appendChild(d);
}

// 明显可见的动态人物
for(let i=0;i<5;i++){
 const p=document.createElement("div");p.className="person";
 p.style.setProperty("--duration",(19+Math.random()*13)+"s");
 p.style.setProperty("--delay",(-Math.random()*28)+"s");
 p.style.setProperty("--coat",["#344c67","#67404c","#31554c","#44465f","#554a3c"][i]);
 p.style.setProperty("--umbrella",["#56aeb9","#ce6579","#c5ad68","#9187ca","#a9c8d1"][i]);
 p.innerHTML='<div class="umbrella"></div><div class="head"></div><div class="coat"></div><div class="legs"></div>';
 $("people").appendChild(p);
}
// 行人后方汽车
for(let i=0;i<3;i++){
 const c=document.createElement("div");c.className="car";
 c.style.setProperty("--duration",(18+i*6)+"s");
 c.style.setProperty("--delay",(-i*7-2)+"s");
 c.style.setProperty("--bottom",(8+i*7)+"%");
 c.style.setProperty("--car",["#2b4b61","#75404a","#63747d"][i]);
 c.innerHTML='<div class="carRoof"></div><div class="carBody"></div><div class="wheel l"></div><div class="wheel r"></div><div class="headlamp"></div><div class="taillamp"></div>';
 $("cars").appendChild(c);
}

// 雨滴 Canvas
const rc=$("rain"),rx=rc.getContext("2d");
const gc=$("glass"),gx=gc.getContext("2d");
let W=0,H=0,dpr=1,drops=[],beads=[];
let rainLevel=2,quality="medium",rainOn=true;
let raf=0,last=0,lastGlass=0;
function makeDrops(){
 const n=(quality==="low"?90:quality==="medium"?190:330)*rainLevel/2;
 drops=Array.from({length:Math.round(n)},()=>({
  x:Math.random()*W,y:Math.random()*H,
  len:8+Math.random()*19,speed:450+Math.random()*650,
  drift:-25-Math.random()*55,a:.15+Math.random()*.28
 }));
}
function makeBeads(){
 const n=quality==="low"?8:quality==="medium"?22:38;
 beads=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,s:8+Math.random()*24}));
}
function resize(){
 W=window.innerWidth;H=window.innerHeight;
 dpr=Math.min(window.devicePixelRatio||1,quality==="high"?1.5:1);
 [rc,gc].forEach(c=>{
  c.width=Math.max(1,Math.round(W*dpr));
  c.height=Math.max(1,Math.round(H*dpr));
  c.style.width=W+"px";c.style.height=H+"px";
 });
 rx.setTransform(dpr,0,0,dpr,0,0);
 gx.setTransform(dpr,0,0,dpr,0,0);
 makeDrops();makeBeads();
}
function drawRain(dt){
 rx.clearRect(0,0,W,H);
 if(!rainOn)return;
 rx.lineWidth=quality==="low"?.7:1;
 rx.lineCap="round";
 for(const d of drops){
  rx.strokeStyle="rgba(192,225,245,"+(d.a*rainLevel/2)+")";
  rx.beginPath();rx.moveTo(d.x,d.y);rx.lineTo(d.x+d.drift*.03,d.y+d.len);rx.stroke();
  d.x+=d.drift*dt;d.y+=d.speed*dt;
  if(d.y>H+25||d.x<-30){d.y=-d.len;d.x=Math.random()*(W+30)}
 }
}
function drawGlass(dt){
 gx.clearRect(0,0,W,H);
 if(!rainOn||quality==="low")return;
 for(const d of beads){
  d.y+=d.s*dt;
  if(d.y>H+8){d.y=-8;d.x=Math.random()*W}
  gx.beginPath();gx.ellipse(d.x,d.y,d.r*.65,d.r*1.4,0,0,Math.PI*2);
  gx.fillStyle="rgba(185,225,246,.12)";gx.fill();
  gx.strokeStyle="rgba(225,245,255,.38)";gx.lineWidth=.8;gx.stroke();
 }
}
function loop(t){
 raf=requestAnimationFrame(loop);
 if(document.hidden)return;
 const interval=quality==="low"?55:quality==="medium"?30:17;
 if(t-last<interval)return;
 const dt=Math.min((t-last)/1000,.05);last=t;
 drawRain(dt);
 if(t-lastGlass>35){drawGlass(dt*2);lastGlass=t}
}
window.addEventListener("resize",resize,{passive:true});
resize();
raf=requestAnimationFrame(loop);

// 雨量和画质
$("rainLevel").addEventListener("change",e=>{
 rainLevel=Number(e.target.value);makeDrops();
 $("weatherText").textContent=["","细雨 · 18°C","中雨 · 18°C","大雨 · 17°C","暴雨 · 16°C"][rainLevel];
 toast("雨量已调整："+e.target.options[e.target.selectedIndex].text);
});
$("quality").addEventListener("change",e=>{
 quality=e.target.value;
 document.body.classList.toggle("low",quality==="low");
 resize();toast("画质已切换："+e.target.options[e.target.selectedIndex].text);
});
$("rainBtn").addEventListener("click",()=>{
 rainOn=!rainOn;active("rainBtn",rainOn);
 toast(rainOn?"动态雨幕已开启":"动态雨幕已关闭");
});

// 视角与旋转
let view=0,rotating=false,rotStart=performance.now();
function applyView(){
 const scales=[1,1.15,.86];
 const offset=rotating?Math.sin((performance.now()-rotStart)/2200)*1.2:0;
 $("store").style.transform="translate(calc(-50% + "+offset+"%),-50%) scale("+scales[view]+")";
}
$("viewBtn").addEventListener("click",()=>{
 rotating=false;active("rotateBtn",false);
 view=(view+1)%3;applyView();
 toast(["标准视角","近景视角","远景视角"][view]);
});
$("rotateBtn").addEventListener("click",()=>{
 rotating=!rotating;rotStart=performance.now();
 active("rotateBtn",rotating);
 toast(rotating?"自动旋转已开启":"自动旋转已关闭");
});
function rotationLoop(){
 if(rotating)applyView();
 requestAnimationFrame(rotationLoop);
}
requestAnimationFrame(rotationLoop);

// 进店与离店
let inside=false;
function toggleDoor(){
 inside=!inside;
 $("door").classList.toggle("open",inside);
 $("doorText").textContent=inside?"点击离店":"点击进店";
 $("enterBtn").lastElementChild.textContent=inside?"离开店内":"进店体验";
 $("enterBtn").querySelector(".ico").textContent=inside?"🚶":"🚪";
 $("caption").textContent=inside?
 "欢迎光临。暖灯、饮料和热咖啡，让雨夜慢下来。":
 "雨声很轻，城市很远。今晚，慢一点也没关系。";
 toast(inside?"欢迎来到雨夜便利店":"你已回到雨夜街头");
}

// Web Audio：用户点击后启动，不依赖外部音频文件
let ctx=null,master=null,rainGain=null,musicGain=null,noise=null;
let rainSound=false,music=false,volume=.35,musicTimer=null,step=0;
let activeOscillators=[];
const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,220,261.63,329.63,261.63];

function initAudio(){
 if(ctx)return true;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){toast("当前浏览器不支持网页音频");return false}
 try{
  ctx=new AC();
  master=ctx.createGain();master.gain.value=volume;master.connect(ctx.destination);

  // 连续雨声：过滤白噪声
  const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;
  const filter=ctx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=1300;
  rainGain=ctx.createGain();rainGain.gain.value=0;
  noise.connect(filter);filter.connect(rainGain);rainGain.connect(master);noise.start();

  musicGain=ctx.createGain();musicGain.gain.value=0;musicGain.connect(master);
  return true;
 }catch(e){fail(e);return false}
}
async function unlockAudio(){
 if(!initAudio())return false;
 try{
  if(ctx.state!=="running")await ctx.resume();
 }catch(e){fail(e)}
 if(ctx.state!=="running"){
  toast("音频未启动，请再点击一次声音按钮");
  return false;
 }
 return true;
}
