
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深夜便利店 · 雨夜生活</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:#09141bdc;border:1px solid #ffffff24;border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px);font-size:12px;line-height:1.6}
#title{font-size:16px;font-weight:800;letter-spacing:1px}
#status{color:#a8e8ff}
#help{position:fixed;left:50%;top:75px;transform:translateX(-50%);background:#09141bdc;padding:7px 12px;border-radius:20px;font-size:12px;white-space:nowrap;pointer-events:none}
#bottom{position:fixed;left:12px;right:12px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
#move{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:48px 48px;gap:5px;pointer-events:auto}
button{border:1px solid #ffffff38;background:#122630e8;color:white;border-radius:13px;font-size:14px;min-height:43px;padding:10px;touch-action:none}
button:active{background:#276078}
.move{font-size:20px;padding:0;min-height:46px}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:7px;pointer-events:auto;align-items:stretch}
#interact{background:#b47a35e8;border-color:#ffcf86;font-weight:700}
#message{position:fixed;left:50%;bottom:145px;transform:translateX(-50%);width:max-content;max-width:85%;background:#09141bf0;border:1px solid #ffffff2a;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;border:1px solid #ffffffaa;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#101820;color:#d9f2ff;z-index:10}
#loading small{display:block;margin-top:10px;color:#9eb5c0}
@media(min-width:700px){#move{grid-template-columns:58px 58px 58px}#message{bottom:25px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
  <div class="panel">
    <div id="title">深夜便利店</div>
    <div>雨夜生活模拟 · 第一阶段</div>
    <div id="status">正在准备场景……</div>
  </div>
  <div class="panel" style="text-align:right">
    <div>夜间 23:48</div>
    <div>小雨持续中</div>
    <div id="soundState">环境音：关闭</div>
  </div>
</div>

<div id="help">拖动屏幕转动视角 · 按住方向键移动</div>
<div id="cross"></div>

<div id="bottom">
  <div id="move">
    <button class="move" id="up" aria-label="前进">▲</button>
    <button class="move" id="left" aria-label="左移">◀</button>
    <button class="move" id="down" aria-label="后退">▼</button>
    <button class="move" id="right" aria-label="右移">▶</button>
  </div>
  <div id="actions">
    <button id="interact">互动 / 查看</button>
    <button id="sound">开启环境音</button>
    <button id="reset">返回起点</button>
  </div>
</div>

<div id="message">雨一直下着，便利店的灯还亮着。</div>

<div id="loading">
  <div>
    <div style="font-size:20px;font-weight:800">深夜便利店</div>
    <div id="loadText">正在准备 3D 场景……</div>
    <small>正在启动本地 Three.js 引擎</small>
  </div>
</div>

<script type="module">
const loadText = document.getElementById("loadText");
const loading = document.getElementById("loading");
const status = document.getElementById("status");
const message = document.getElementById("message");

function showError(error){
  loading.style.display = "flex";
  loadText.textContent = "场景启动失败：" + (error?.message || error);
  status.textContent = "启动失败";
  console.error(error);
}

try {
  loadText.textContent = "正在加载本地 Three.js 模块……";
  const THREE = await import("./three.module.js");
  loadText.textContent = "引擎加载成功，正在构建场景……";

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x17232d);
  scene.fog = new THREE.FogExp2(0x17232d, 0.018);

  const camera = new THREE.PerspectiveCamera(
    72, innerWidth / innerHeight, 0.1, 150
  );
  camera.position.set(0, 1.7, 12);

  const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance"
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.getElementById("game").appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xa6c8e8, 0x273027, 2));

  const moonLight = new THREE.DirectionalLight(0x9bb9d8, 1.2);
  moonLight.position.set(-5, 10, 6);
  scene.add(moonLight);

  const warmLight = new THREE.PointLight(0xffc16a, 22, 18);
  warmLight.position.set(0, 3.2, 0.6);
  scene.add(warmLight);

  const mat = (color, roughness=0.8, metalness=0) =>
    new THREE.MeshStandardMaterial({color, roughness, metalness});

  const materials = {
    ground: mat(0x242d34),
    wall: mat(0x34434b),
    dark: mat(0x101a20),
    metal: mat(0x75838a, 0.45, 0.55),
    glass: new THREE.MeshStandardMaterial({
      color:0x9bc9d5, transparent:true, opacity:0.18,
      roughness:0.18, metalness:0.1
    }),
    wood: mat(0x75533a),
    shelf: mat(0x3b4850),
    white: mat(0xe6e2d5),
    red: mat(0xc85045),
    blue: mat(0x3988b9),
    green: mat(0x5a9c64),
    yellow: mat(0xe5b64c),
    purple: mat(0x8b6cb0),
    orange: mat(0xe48a43)
  };

  function box(parent, x,y,z, sx,sy,sz, material, extra={}){
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(sx,sy,sz), material
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = false;
    mesh.receiveShadow = false;
    if(extra.rotationY) mesh.rotation.y=extra.rotationY;
    parent.add(mesh);
    return mesh;
  }

  function cylinder(parent,x,y,z,r1,r2,h,material,segments=12){
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(r1,r2,h,segments),material
    );
    mesh.position.set(x,y,z);
    parent.add(mesh);
    return mesh;
  }

  // 地面、道路、路缘和人行道
  box(scene,0,-0.18,3,60,0.3,40,materials.ground);
  box(scene,0,-0.015,9,60,0.04,9,mat(0x20262b));
  box(scene,0,0.015,9,60,0.035,0.12,mat(0xd7cba4));
  box(scene,0,0.015,5.1,60,0.035,0.12,mat(0x858b89));

  for(let x=-24;x<=24;x+=5){
    box(scene,x,0.012,9,2.3,0.025,0.12,mat(0xb7b7a8));
  }

  // 远处建筑轮廓
  for(let i=0;i<12;i++){
    const x=-27+i*5;
    const h=3+(i*7%6);
    box(scene,x,h/2,-12,4,h,3,mat(i%2?0x27363e:0x303b43));
    for(let j=0;j<3;j++){
      for(let k=0;k<Math.floor(h/2);k++){
        const windowMat=mat((i+j+k)%3===0?0xe7b96b:0x3c505b);
        box(scene,x-0.7+j*0.7,k*1.3+0.8,-10.44,0.24,0.42,0.035,windowMat);
      }
    }
  }

  // 便利店主体：前方透明，方便看见店内
  box(scene,0,2.55,-1.1,10,5.1,6,materials.wall);
  // 挖出视觉上的正面：用两侧墙、后墙和屋顶代替完整封闭盒
  // 覆盖正面墙，留出大玻璃橱窗和门
  box(scene,-4.35,2.35,1.94,1.3,4.7,0.18,materials.wall);
  box(scene,4.35,2.35,1.94,1.3,4.7,0.18,materials.wall);
  box(scene,0,4.8,1.94,7.4,0.45,0.18,materials.wall);
  box(scene,0,0.35,1.94,7.4,0.7,0.18,materials.wall);

  // 建筑内部的深色后墙
  box(scene,0,2.5,-3.98,8.8,4.8,0.15,materials.dark);

  // 前窗和入口玻璃
  box(scene,-2.15,2.55,1.84,3.2,3.2,0.045,materials.glass);
  box(scene,2.15,2.55,1.84,3.2,3.2,0.045,materials.glass);
  box(scene,0,2.55,1.83,0.12,3.5,0.08,materials.metal);
  box(scene,0.72,1.8,1.78,1.25,2.9,0.06,materials.glass);
  box(scene,1.35,1.8,1.72,0.06,0.4,0.07,materials.metal);

  // 门框、招牌、暖色发光招牌
  box(scene,0,5.15,1.8,7.6,0.72,0.28,mat(0x13272d));
  box(scene,0,5.18,1.62,6.9,0.48,0.06,mat(0x8bd7cc,0.5));
  const signCanvas=document.createElement("canvas");
  signCanvas.width=512;signCanvas.height=128;
  const ctx=signCanvas.getContext("2d");
  ctx.fillStyle="#173a3a";ctx.fillRect(0,0,512,128);
  ctx.fillStyle="#ffe2a1";ctx.font="bold 54px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("深夜便利店",256,64);
  const signTexture=new THREE.CanvasTexture(signCanvas);
  signTexture.colorSpace=THREE.SRGBColorSpace;
  const sign=new THREE.Mesh(
    new THREE.PlaneGeometry(6.7,0.42),
    new THREE.MeshBasicMaterial({map:signTexture})
  );
  sign.position.set(0,5.18,1.57);scene.add(sign);

  // 室内地面
  box(scene,0,0.04,-1.0,8.6,0.12,5.8,mat(0x786c58));

  // 天花板灯具
  for(const x of [-2.5,0,2.5]){
    box(scene,x,4.55,-0.7,1.7,0.06,0.28,mat(0xffe3a1));
    const lamp=new THREE.PointLight(0xffd18b,7,8);
    lamp.position.set(x,4.2,-0.7);scene.add(lamp);
  }

  // 货架与彩色商品
  const productMats=[
    materials.red,materials.blue,materials.green,
    materials.yellow,materials.purple,materials.orange
  ];

  for(const x of [-3.1,-1.35,2.5]){
    box(scene,x,1.45,-1.1,0.95,2.8,0.65,materials.shelf);
    for(let level=0;level<4;level++){
      const y=0.55+level*0.62;
      box(scene,x,y,-0.72,1.0,0.055,0.72,materials.metal);
      for(let n=0;n<5;n++){
        const px=x-0.38+n*0.19;
        const height=0.28+(n%2)*0.09;
        box(scene,px,y+0.05+height/2,-0.92,0.13,height,0.18,productMats[(n+level)%productMats.length]);
      }
    }
  }

  // 冷柜、收银台、微波炉
  box(scene,3.6,1.1,-2.8,1.0,2.0,1.2,materials.metal);
  box(scene,3.6,1.1,-2.16,0.82,1.7,0.035,materials.glass);
  for(let i=0;i<3;i++){
    box(scene,3.6,0.55+i*0.45,-2.12,0.65,0.035,0.025,mat(0x93cbd7));
  }
  box(scene,0.3,0.8,0.3,2.0,1.0,0.85,materials.wood);
  box(scene,0.3,1.35,0.3,2.0,0.12,0.85,materials.metal);
  box(scene,-0.1,1.65,0.15,0.5,0.38,0.4,materials.dark);
  box(scene,-0.1,1.66,0.36,0.36,0.22,0.025,mat(0x92c6b2));

  // 门外台阶
  box(scene,0,0.06,2.5,5.4,0.12,1.0,mat(0x555e61));

  // 路灯
  for(const x of [-10,10]){
    cylinder(scene,x,2.6,5.3,0.09,0.12,5.2,materials.dark);
    box(scene,x,5.2,5.3,1.0,0.12,0.18,mat(0xffdca0));
    const light=new THREE.PointLight(0xffc978,10,9);
    light.position.set(x,4.8,5.3);scene.add(light);
  }

  // 雨滴：用点云持续循环下落
  const rainCount=1200;
  const rainPositions=new Float32Array(rainCount*3);
  const rainSpeeds=new Float32Array(rainCount);
  for(let i=0;i<rainCount;i++){
    rainPositions[i*3]=(Math.random()-0.5)*34;
    rainPositions[i*3+1]=Math.random()*13;
    rainPositions[i*3+2]=-3+Math.random()*22;
    rainSpeeds[i]=8+Math.random()*12;
  }
  const rainGeo=new THREE.BufferGeometry();
  rainGeo.setAttribute("position",new THREE.BufferAttribute(rainPositions,3));
  const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({
    color:0xb9d9ef,size:0.045,transparent:true,opacity:0.72,
    depthWrite:false
  }));
  scene.add(rain);

  // 水洼
  const puddleMat=new THREE.MeshStandardMaterial({
    color:0x435966,roughness:0.16,metalness:0.45,
    transparent:true,opacity:0.65
  });
  for(let i=0;i<16;i++){
    const puddle=new THREE.Mesh(
      new THREE.CircleGeometry(0.3+Math.random()*0.7,18),puddleMat
    );
    puddle.rotation.x=-Math.PI/2;
    puddle.position.set((Math.random()-0.5)*25,0.025,5+Math.random()*7);
    puddle.scale.y=0.35;
    scene.add(puddle);
  }

  // 汽车：车身、车顶、车窗、车灯、车轮
  const cars=[];
  function createCar(color,x,z,speed){
    const g=new THREE.Group();
    box(g,0,0.48,0,2.0,0.55,0.95,mat(color,0.4,0.2));
    box(g,-0.08,0.87,-0.02,1.1,0.42,0.78,mat(0x607a86,0.25,0.25));
    for(const wx of [-0.63,0.63]){
      for(const wz of [-0.49,0.49]){
        const wheel=cylinder(g,wx,0.27,wz,0.22,0.22,0.12,mat(0x111519),12);
        wheel.rotation.x=Math.PI/2;
      }
    }
    for(const wz of [-0.36,0.36]){
      box(g,1.01,0.52,wz,0.07,0.15,0.13,mat(0xffe4a0));
      box(g,-1.01,0.52,wz,0.06,0.13,0.13,mat(0xe64c3c));
    }
    g.position.set(x,0,z);scene.add(g);
    cars.push({g,speed,z});
  }
  createCar(0x315b73,-14,9.1,4.4);
  createCar(0x9a4338,8,10.4,-3.5);
  createCar(0x777d80,-22,8.0,5.2);

  // 撑伞行人
  const walkers=[];
  function createWalker(x,z,speed,coat,umbrella){
    const g=new THREE.Group();
    const body=mat(coat);
    cylinder(g,0,1.0,0,0.19,0.24,0.68,body,10);
    const headMat=mat(0xc99570);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,10,8),headMat);
    head.position.set(0,1.48,0);g.add(head);
    const legMat=mat(0x252c31);
    for(const lx of [-0.1,0.1]){
      box(g,lx,0.37,0,0.12,0.55,0.13,legMat);
    }
    const umbrellaMat=new THREE.MeshStandardMaterial({
      color:umbrella,side:THREE.DoubleSide,roughness:0.55
    });
    const canopy=new THREE.Mesh(
      new THREE.SphereGeometry(0.62,12,6,0,Math.PI*2,0,Math.PI/2),
      umbrellaMat
    );
    canopy.position.y=1.92;canopy.scale.y=0.45;g.add(canopy);
    cylinder(g,0,1.65,0,0.025,0.025,0.55,materials.dark,6);
    g.position.set(x,0,z);scene.add(g);
    walkers.push({g,speed,origin:x});
  }
  createWalker(-7,5.2,0.65,0x526d80,0x354d72);
  createWalker(7,4.8,-0.48,0x795448,0x8d4339);

  // 视角和触屏移动
  let yaw=0,pitch=-0.08;
  let moving={forward:false,back:false,left:false,right:false};
  const keys={};
  let lastTouchX=null,lastTouchY=null;
  let playerX=0,playerZ=12;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function updateCamera(){
    pitch=clamp(pitch,-0.8,0.55);
    camera.position.set(playerX,1.7,playerZ);
    const direction=new THREE.Vector3(
      Math.sin(yaw)*Math.cos(pitch),
      Math.sin(pitch),
      -Math.cos(yaw)*Math.cos(pitch)
    );
    camera.lookAt(camera.position.clone().add(direction));
  }
  updateCamera();

  renderer.domElement.addEventListener("pointerdown",e=>{
    lastTouchX=e.clientX;lastTouchY=e.clientY;
    renderer.domElement.setPointerCapture?.(e.pointerId);
  });
  renderer.domElement.addEventListener("pointermove",e=>{
    if(lastTouchX===null)return;
    const dx=e.clientX-lastTouchX,dy=e.clientY-lastTouchY;
    yaw-=dx*0.004;
    pitch-=dy*0.003;
    lastTouchX=e.clientX;lastTouchY=e.clientY;
    updateCamera();
  });
  function endLook(){lastTouchX=null;lastTouchY=null}
  renderer.domElement.addEventListener("pointerup",endLook);
  renderer.domElement.addEventListener("pointercancel",endLook);

  const buttonMap={up:"forward",down:"back",left:"left",right:"right"};
  for(const [id,direction] of Object.entries(buttonMap)){
    const b=document.getElementById(id);
    const on= e=>{e.preventDefault();moving[direction]=true};
    const off= e=>{e.preventDefault();moving[direction]=false};
    b.addEventListener("pointerdown",on);
    b.addEventListener("pointerup",off);
    b.addEventListener("pointercancel",off);
    b.addEventListener("pointerleave",off);
  }

  addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();
  });
  addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

  // 简单可用的互动提示
  let interactionCount=0;
  document.getElementById("interact").addEventListener("click",()=>{
    interactionCount++;
    const distance=Math.hypot(playerX,playerZ-2.7);
    if(distance<4.2){
      message.textContent="店门就在面前。下一阶段将加入开门、购买商品和店员对话。";
    }else if(distance<8){
      message.textContent="透过玻璃可以看见货架和冷柜。继续向前靠近店门。";
    }else{
      message.textContent="雨水打在路面上，便利店的暖光照亮了街道。向前走近店门试试。";
    }
  });

  // 用户点击后才启动声音，避免浏览器拦截自动播放
  let audioCtx=null,noiseSource=null,noiseGain=null,humOsc=null,humGain=null;
  let soundOn=false;
  function startSound(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){message.textContent="当前浏览器不支持 Web Audio 音效。";return}
    if(!audioCtx){
      audioCtx=new AC();
      const length=audioCtx.sampleRate*2;
      const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*0.28;
      noiseSource=audioCtx.createBufferSource();
      noiseSource.buffer=buffer;noiseSource.loop=true;
      const filter=audioCtx.createBiquadFilter();
      filter.type="lowpass";filter.frequency.value=950;
      noiseGain=audioCtx.createGain();noiseGain.gain.value=0;
      noiseSource.connect(filter);filter.connect(noiseGain);noiseGain.connect(audioCtx.destination);
      noiseSource.start();
      humOsc=audioCtx.createOscillator();humOsc.type="sine";humOsc.frequency.value=72;
      humGain=audioCtx.createGain();humGain.gain.value=0;
      humOsc.connect(humGain);humGain.connect(audioCtx.destination);humOsc.start();
    }
    audioCtx.resume();
    noiseGain.gain.setTargetAtTime(0.12,audioCtx.currentTime,0.3);
    humGain.gain.setTargetAtTime(0.012,audioCtx.currentTime,0.3);
    soundOn=true;
    document.getElementById("soundState").textContent="环境音：开启";
    document.getElementById("sound").textContent="关闭环境音";
    message.textContent="雨声与室内低鸣已开启。";
  }
  function stopSound(){
    if(audioCtx){
      noiseGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.15);
      humGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.15);
    }
    soundOn=false;
    document.getElementById("soundState").textContent="环境音：关闭";
    document.getElementById("sound").textContent="开启环境音";
  }
  document.getElementById("sound").addEventListener("click",()=>{
    if(soundOn)stopSound();else startSound();
  });
