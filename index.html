<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<title>蓝色星球 · 3D 地球仪</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#edf7ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#globe{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,#03061066 75%,#02040bd9 130%);z-index:1}
.top{position:fixed;z-index:3;left:18px;top:18px;pointer-events:none;text-shadow:0 2px 18px #000}
.kicker{font-size:10px;letter-spacing:.24em;color:#8be9ff;font-weight:700}.title{font-size:clamp(22px,4vw,34px);font-weight:750;letter-spacing:.02em;margin-top:4px}.desc{font-size:12px;color:#9fb7d2;margin-top:5px}
.status{position:fixed;z-index:3;left:18px;top:105px;display:flex;gap:8px;align-items:center;font-size:11px;color:#a9c6df}.dot{width:6px;height:6px;border-radius:50%;background:#69e7ff;box-shadow:0 0 12px #69e7ff}
.panel{position:fixed;z-index:4;right:16px;top:16px;bottom:16px;width:min(300px,calc(100vw - 32px));border:1px solid #8dcff52b;border-radius:22px;background:linear-gradient(150deg,#0b1935d9,#071021df);box-shadow:0 18px 60px #0008;backdrop-filter:blur(18px);padding:16px;display:flex;flex-direction:column;overflow:hidden}
.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.panelTitle{font-size:14px;font-weight:700;letter-spacing:.04em}.eyebrow{font-size:10px;color:#7f9cb9;letter-spacing:.14em;margin-top:4px}
.iconBtn,button{color:#e7f7ff;background:#112746;border:1px solid #3b6787;border-radius:12px;padding:9px 11px;font:inherit;cursor:pointer}.iconBtn{padding:6px 10px}.iconBtn:active,button:active{transform:scale(.98)}
.places{overflow:auto;margin:15px -5px 12px;padding:0 5px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.place{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:#0d1b30a8;border:1px solid #26435c;border-radius:14px;padding:10px;transition:background .2s,border-color .2s}
.place.active{background:#173c55cc;border-color:#63dfff;box-shadow:inset 0 0 20px #2bb8e51a}
.place .pin{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--c);box-shadow:0 0 13px var(--c)}
.place .name{font-size:12px;font-weight:650}.place .region{font-size:10px;color:#8fa9c5;margin-top:3px}
.footer{margin-top:auto;border-top:1px solid #25415a;padding-top:12px}.selected{font-size:12px;font-weight:700}.coords{font-size:10px;color:#8fa9c5;margin-top:4px}
.controls{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.controls button{font-size:11px;flex:1}.controls button.active{background:#164c66;border-color:#6ce8ff}
.tip{position:fixed;z-index:3;bottom:20px;left:18px;font-size:11px;color:#b0c5da;text-shadow:0 2px 8px #000;pointer-events:none}
#toast{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);background:#071629eF;border:1px solid #4a8eb0;border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#loading{position:fixed;z-index:8;inset:0;display:grid;place-items:center;background:#050914;color:#bdeeff;font-size:13px;letter-spacing:.06em;transition:opacity .4s}
.spinner{width:25px;height:25px;border:2px solid #254b63;border-top-color:#70e9ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:620px){.top{top:14px;left:14px}.status{top:91px;left:14px}.panel{top:auto;left:10px;right:10px;bottom:10px;width:auto;height:220px;padding:12px;border-radius:18px}.panelHead{flex-shrink:0}.places{flex-direction:row;overflow-x:auto;overflow-y:hidden;margin:10px -3px;padding:0 3px;gap:8px}.place{min-width:145px;width:145px;align-items:flex-start;padding:9px}.place .region{white-space:normal}.footer{display:flex;align-items:center;gap:10px;padding-top:9px;flex-wrap:wrap}.selected{font-size:11px}.coords{margin:0}.controls{margin:0 0 0 auto;flex-wrap:nowrap}.controls button{padding:7px 9px;white-space:nowrap}.tip{bottom:244px;left:14px;font-size:10px}}
</style>
</head>
<body>
<canvas id="globe"></canvas><div class="vignette"></div>
<header class="top"><div class="kicker">PLANET EARTH / 01</div><div class="title">蓝色星球</div><div class="desc">在星海中，寻找属于你的坐标。</div></header>
<div class="status"><span class="dot"></span><span id="liveStatus">地球正在缓慢自转</span></div>
<aside class="panel">
 <div class="panelHead"><div><div class="panelTitle">精选坐标</div><div class="eyebrow">SELECTED DESTINATIONS</div></div><button class="iconBtn" id="hidePanel" aria-label="收起地点列表">−</button></div>
 <div class="places" id="places"></div>
 <div class="footer"><div><div class="selected" id="selectedName">太平洋 · 初始视角</div><div class="coords" id="selectedCoords">拖动地球，探索世界</div></div>
 <div class="controls"><button id="auto" class="active">自动旋转：开</button><button id="home">重置视角</button></div></div>
</aside>
<div class="tip">拖动旋转 · 点击发光标记聚焦 · 滚轮或双指缩放</div><div id="toast"></div>
<div id="loading"><div style="text-align:center"><div class="spinner"></div>正在点亮地球…</div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('globe'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);
const places=[
{name:'台北',region:'台湾 · 东亚',lat:25.033,lon:121.5654,color:'#79eaff'},
{name:'东京',region:'日本 · 东亚',lat:35.6762,lon:139.6503,color:'#ffbd88'},
{name:'巴黎',region:'法国 · 欧洲',lat:48.8566,lon:2.3522,color:'#c4a0ff'},
{name:'纽约',region:'美国 · 北美洲',lat:40.7128,lon:-74.006,color:'#ff83a6'},
{name:'开普敦',region:'南非 · 非洲',lat:-33.9249,lon:18.4241,color:'#8df5c6'},
{name:'里约热内卢',region:'巴西 · 南美洲',lat:-22.9068,lon:-43.1729,color:'#ffe78c'},
{name:'悉尼',region:'澳大利亚 · 大洋洲',lat:-33.8688,lon:151.2093,color:'#89aaff'},
{name:'冰岛',region:'北大西洋',lat:64.1466,lon:-21.9426,color:'#75f1ef'}
];
let W=0,H=0,D=1,rotY=-.4,rotX=.15,targetY=rotY,targetX=rotX,zoom=1,targetZoom=1,auto=true,drag=null,last=0,interactingUntil=0,selected=-1,hidden=false;
let stars=[],clouds=[],landPolys=[],earthCanvas=null,earthCtx=null,earthTextureReady=false;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);draw()}
function toast(s){let e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600)}
function list(){const el=$('places');places.forEach((p,i)=>{let b=document.createElement('button');b.className='place';b.style.setProperty('--c',p.color);b.innerHTML='<span class="pin"></span><span><div class="name">'+p.name+'</div><div class="region">'+p.region+'</div></span>';b.onclick=()=>focusPlace(i);el.appendChild(b)})}
function updateList(){[...$('places').children].forEach((e,i)=>e.classList.toggle('active',i===selected))}
function vec(lat,lon){let a=lat*Math.PI/180,b=lon*Math.PI/180;return{x:Math.cos(a)*Math.sin(b),y:Math.sin(a),z:Math.cos(a)*Math.cos(b)}}
function rotate(v){let cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);let x=v.x*cy+v.z*sy,z=-v.x*sy+v.z*cy,y=v.y;return{x,y:y*cx-z*sx,z:y*sx+z*cx}}
function project(v,cx,cy,r){let q=rotate(v);return{x:cx+q.x*r,y:cy-q.y*r,z:q.z,visible:q.z>-.06}}
function focusPlace(i){selected=i;let p=places[i],v=vec(p.lat,p.lon);targetY=-Math.atan2(v.x,v.z);targetX=Math.atan2(v.y,Math.sqrt(v.x*v.x+v.z*v.z));targetX=Math.max(-1.25,Math.min(1.25,targetX));auto=false;interactingUntil=performance.now()+5000;$('auto').textContent='自动旋转：关';$('auto').classList.remove('active');$('liveStatus').textContent='镜头正在聚焦：'+p.name;$('selectedName').textContent=p.name+' · '+p.region;$('selectedCoords').textContent=p.lat.toFixed(4)+'°, '+p.lon.toFixed(4)+'°';updateList()}
function buildTexture(){
 earthCanvas=document.createElement('canvas');earthCanvas.width=1024;earthCanvas.height=512;earthCtx=earthCanvas.getContext('2d');
 let g=earthCtx.createLinearGradient(0,0,0,512);g.addColorStop(0,'#0d3452');g.addColorStop(.5,'#0c5278');g.addColorStop(1,'#092943');earthCtx.fillStyle=g;earthCtx.fillRect(0,0,1024,512);
 // procedural stylized continents using polygons in equirectangular coordinates (longitude maps x, latitude maps y)
 const polys=[
 [[70,90],[115,70],[155,90],[175,130],[155,160],[140,205],[115,220],[95,180],[80,145]],
 [[150,230],[190,240],[210,285],[195,350],[175,390],[155,340],[145,285]],
 [[260,80],[310,65],[360,90],[390,120],[370,150],[340,145],[320,175],[285,160],[260,125]],
 [[320,185],[355,195],[370,240],[355,295],[330,350],[310,315],[300,265]],
 [[420,100],[470,70],[530,75],[565,105],[600,95],[635,125],[620,155],[585,160],[570,190],[530,175],[500,205],[470,180],[445,145]],
 [[485,205],[520,220],[535,270],[515,330],[490,370],[465,310],[470,255]],
 [[620,85],[690,70],[755,90],[800,125],[780,160],[740,170],[715,145],[680,155],[650,125]],
 [[700,200],[750,205],[775,245],[755,280],[730,270],[710,240]],
 [[820,290],[870,275],[905,300],[890,325],[850,330]],
 [[910,125],[930,110],[945,130],[935,155]]
 ];
 earthCtx.fillStyle='#347b78';earthCtx.strokeStyle='#69b5a5';earthCtx.lineWidth=2;
 polys.forEach((poly,k)=>{earthCtx.beginPath();poly.forEach((p,i)=>i?earthCtx.lineTo(p[0]/1024*1024,p[1]/512*512):earthCtx.moveTo(p[0],p[1]));earthCtx.closePath();earthCtx.fill();earthCtx.stroke()});
 // soft latitude/longitude grid
 earthCtx.strokeStyle='rgba(132,220,255,.13)';earthCtx.lineWidth=1;for(let x=0;x<=1024;x+=64){earthCtx.beginPath();earthCtx.moveTo(x,0);earthCtx.lineTo(x,512);earthCtx.stroke()}for(let y=0;y<=512;y+=32){earthCtx.beginPath();earthCtx.moveTo(0,y);earthCtx.lineTo(1024,y);earthCtx.stroke()}
 // polar ice
 earthCtx.fillStyle='#bce8ed';earthCtx.fillRect(0,0,1024,18);earthCtx.fillRect(0,494,1024,18);
 // random ocean speckles
 for(let i=0;i<1800;i++){let x=Math.random()*1024,y=Math.random()*512;earthCtx.fillStyle=Math.random()>.5?'rgba(99,192,211,.10)':'rgba(1,20,45,.12)';earthCtx.fillRect(x,y,Math.random()*3+1,Math.random()*2+1)}
 earthTextureReady=true;
}
function starfield(){stars=[];for(let i=0;i<220;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.25,a:Math.random()*.6+.15,phase:Math.random()*6.28})}
function draw(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#050914';ctx.fillRect(0,0,W,H);
 const now=performance.now()/1000;
 for(const s of stars){ctx.globalAlpha=s.a*(.75+.25*Math.sin(now*1.1+s.phase));ctx.fillStyle='#b9e8ff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // subtle nebula glow
 let neb=ctx.createRadialGradient(W*.45,H*.44,2,W*.45,H*.44,Math.max(W,H)*.65);neb.addColorStop(0,'rgba(23,81,125,.2)');neb.addColorStop(1,'rgba(4,9,22,0)');ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
 let panelOn=innerWidth<=620&&!hidden;let cx= W*.5,cy=H*.49,r=Math.min(W*.34,H*.37)*zoom;
 if(innerWidth>620){cx=W*.43;r=Math.min(W*.32,H*.40)*zoom}else{cy=H*.39;r=Math.min(W*.42,H*.29)*zoom}
 // atmospheric halo
 let halo=ctx.createRadialGradient(cx,cy,r*.72,cx,cy,r*1.45);halo.addColorStop(0,'rgba(53,187,255,0)');halo.addColorStop(.7,'rgba(53,187,255,.13)');halo.addColorStop(1,'rgba(53,187,255,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r*1.45,0,Math.PI*2);ctx.fill();
 // sphere shading and ocean
 let sphere=ctx.createRadialGradient(cx-r*.35,cy-r*.38,r*.05,cx,cy,r*1.08);sphere.addColorStop(0,'#2b9ec5');sphere.addColorStop(.42,'#11638d');sphere.addColorStop(.78,'#0b3458');sphere.addColorStop(1,'#020b1c');ctx.fillStyle=sphere;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
 // latitude-longitude lines projected on sphere
 ctx.strokeStyle='rgba(123,213,244,.16)';ctx.lineWidth=.7;
 for(let lat=-60;lat<=60;lat+=30){ctx.beginPath();for(let lon=-180;lon<=180;lon+=3){let p=project(vec(lat,lon),cx,cy,r);if(p.z>0){if(lon===-180)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}}ctx.stroke()}
 for(let lon=-150;lon<=180;lon+=30){ctx.beginPath();let first=true;for(let lat=-90;lat<=90;lat+=2){let p=project(vec(lat,lon),cx,cy,r);if(p.z>0){if(first){ctx.moveTo(p.x,p.y);first=false}else ctx.lineTo(p.x,p.y)}}ctx.stroke()}
 // stylized continents as many projected dots, forming land masses
 for(let lat=-65;lat<=75;lat+=2.5)for(let lon=-180;lon<180;lon+=3){
   const n=Math.sin((lon+lat*1.7)*.075)+Math.cos((lon-lat*1.2)*.11)+Math.sin(lon*.17+lat*.08);
   const land=(lat>5&&lat<72&&lon>-165&&lon<-30&&n>.2)||(lat>-55&&lat<12&&lon>-82&&lon<-32&&n>-.3)||(lat>-35&&lat<70&&lon>-18&&lon<55&&n>-.15)||(lat>5&&lat<78&&lon>45&&lon<160&&n>-.15)||(lat>-45&&lat<0&&lon>112&&lon<155&&n>.0);
   if(!land)continue;let p=project(vec(lat,lon),cx,cy,r);if(p.z<0)continue;
   ctx.globalAlpha=.32+Math.max(0,p.z)*.38;ctx.fillStyle=(lat>58||lat<-48)?'#b8e1d9':'#55b49d';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.65,r/230),0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 // directional lighting
 let shade=ctx.createLinearGradient(cx-r,cy-r*.1,cx+r,cy+r*.15);shade.addColorStop(0,'rgba(0,4,20,.65)');shade.addColorStop(.38,'rgba(0,10,30,.03)');shade.addColorStop(1,'rgba(0,2,16,.66)');ctx.fillStyle=shade;ctx.fillRect(cx-r,cy-r,r*2,r*2);
 ctx.restore();
 // rim highlight
 ctx.beginPath();ctx.arc(cx,cy,r-.5,0,Math.PI*2);ctx.strokeStyle='rgba(117,224,255,.6)';ctx.lineWidth=1.2;ctx.stroke();
 // location markers
 for(let i=0;i<places.length;i++){let p=places[i],v=rotate(vec(p.lat,p.lon));if(v.z<-.02)continue;let x=cx+v.x*r,y=cy-v.y*r,scale=.7+.3*Math.max(0,v.z),rr=(i===selected?5:3.2)*scale;
   ctx.globalAlpha=.18;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,rr*4.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.8;ctx.strokeStyle=p.color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,rr*2.1+Math.sin(now*2+i)*1.1,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,rr*.62,0,Math.PI*2);ctx.fill();
   if(i===selected){ctx.font='12px system-ui';ctx.fillStyle='#effaff';ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.fillText(p.name,x+10,y-10);ctx.shadowBlur=0}
 }
 // pointer drag indicator
 if(drag){ctx.strokeStyle='rgba(150,235,255,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(drag.x,drag.y);ctx.lineTo(drag.x+drag.dx,drag.y+drag.dy);ctx.stroke()}
}
function tick(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(auto&&!drag&&now>interactingUntil){targetY-=dt*.12;$('liveStatus').textContent='地球正在缓慢自转'}rotY+=(targetY-rotY)*Math.min(1,dt*4);rotX+=(targetX-rotX)*Math.min(1,dt*4);zoom+=(targetZoom-zoom)*Math.min(1,dt*4);draw();requestAnimationFrame(tick)}
function nearest(x,y){let cx=innerWidth>620?W*.43:W*.5,cy=innerWidth>620?H*.49:H*.39,r=Math.min(innerWidth>620?Math.min(W*.32,H*.40):Math.min(W*.42,H*.29),Math.min(W*.34,H*.37))*zoom;let best=-1,bd=Infinity;places.forEach((p,i)=>{let v=rotate(vec(p.lat,p.lon));if(v.z<-.02)return;let dx=cx+v.x*r-x,dy=cy-v.y*r-y,d=Math.hypot(dx,dy);if(d<Math.max(18,r*.075)&&d<bd){best=i;bd=d}});return best}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx:0,dy:0,moved:false,ry:rotY,rx:rotX};interactingUntil=performance.now()+5000});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.dx=dx;drag.dy=dy;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;targetY=drag.ry+dx*.008;targetX=Math.max(-1.3,Math.min(1.3,drag.rx+dy*.008));rotY=targetY;rotX=targetX;auto=false;$('auto').textContent='自动旋转：关';$('auto').classList.remove('active');$('liveStatus').textContent='手动探索中'});
canvas.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;interactingUntil=performance.now()+5000;if(!d.moved){let i=nearest(e.clientX,e.clientY);if(i>=0)focusPlace(i)}});
canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();targetZoom=Math.max(.72,Math.min(1.55,targetZoom*(e.deltaY>0?.92:1.08)));interactingUntil=performance.now()+5000},{passive:false});
let pinchDist=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchDist){targetZoom=Math.max(.72,Math.min(1.55,targetZoom*d/pinchDist))}pinchDist=d;interactingUntil=performance.now()+5000}},{passive:true});
$('auto').onclick=()=>{auto=!auto;$('auto').textContent='自动旋转：'+(auto?'开':'关');$('auto').classList.toggle('active',auto);if(auto){interactingUntil=performance.now()+500;$('liveStatus').textContent='自动旋转即将恢复'}else $('liveStatus').textContent='自动旋转已关闭'};
$('home').onclick=()=>{selected=-1;targetY=-.4;targetX=.15;targetZoom=1;$('selectedName').textContent='太平洋 · 初始视角';$('selectedCoords').textContent='拖动地球，探索世界';updateList();interactingUntil=performance.now()+5000;toast('已回到初始视角')};
$('hidePanel').onclick=()=>{hidden=!hidden;document.querySelector('.panel').style.display=hidden?'none':'flex';toast(hidden?'地点列表已收起':'地点列表已展开')};
list();starfield();resize();buildTexture();$('loading').style.opacity='0';setTimeout(()=>$('loading').remove(),450);requestAnimationFrame(tick);
})();
</script></body></html>
