<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>爱红红 ·  发展史</title>
<style>
  :root {
    --bg: #05080f;
    --text: #eaf1ff;
    --muted: #9fb0d0;
    --accent: #6ea8fe;
    --gold: #f5c76b;
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    overflow-x: hidden;
  }

  #bgCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
    display: block;
    pointer-events: none;
  }

  .nebula {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    border-radius: 50%;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  .nebula-a {
    width: 75vmax; height: 75vmax;
    left: -25vmax; top: -28vmax;
    background: radial-gradient(circle at 50% 50%, rgba(64, 124, 255, .13) 0%, rgba(64, 124, 255, .05) 32%, transparent 72%);
    animation: drift-a 30s ease-in-out infinite alternate;
  }

  .nebula-b {
    width: 65vmax; height: 65vmax;
    right: -22vmax; top: -12vmax;
    background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, .11) 0%, rgba(139, 92, 246, .04) 34%, transparent 70%);
    animation: drift-b 38s ease-in-out infinite alternate;
  }

  .nebula-c {
    width: 80vmax; height: 80vmax;
    left: 10vmax; bottom: -45vmax;
    background: radial-gradient(circle at 50% 50%, rgba(245, 199, 107, .07) 0%, rgba(245, 199, 107, .025) 35%, transparent 70%);
    animation: drift-c 44s ease-in-out infinite alternate;
  }

  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(5vw, 4vh, 0) scale(1.12); }
  }
  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0) scale(1.08); }
    to   { transform: translate3d(-6vw, 6vh, 0) scale(0.95); }
  }
  @keyframes drift-c {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(4vw, -5vh, 0) scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula { animation: none !important; }
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding: 56px 0 80px;
  }

  header { text-align: center; margin-bottom: 34px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border: 1px solid rgba(110, 168, 254, .35);
    border-radius: 999px;
    color: #bcd2ff;
    font-size: 13px;
    background: rgba(18, 26, 48, 0.8); /* 移除了容易卡死的 blur */
    margin-bottom: 16px;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 14px var(--gold);
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 5vw, 54px);
    letter-spacing: .04em;
    line-height: 1.15;
    background: linear-gradient(90deg, #ffffff, #b9d1ff 45%, #d8c2ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    max-width: 720px;
    margin: 0 auto;
    color: var(--muted);
    line-height: 1.8;
    font-size: 15px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 28px 0 42px;
  }

  .filter-btn {
    appearance: none;
    border: 1px solid rgba(140, 170, 230, .25);
    background: rgba(18, 26, 48, .8); /* 移除了 blur */
    color: var(--muted);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    transition: .25s ease;
  }

  .filter-btn:hover {
    border-color: rgba(110, 168, 254, .55);
    color: #fff;
  }

  .filter-btn.active {
    color: #07101f;
    background: linear-gradient(135deg, #9ec5ff, #c7b4ff);
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 8px 26px rgba(110, 168, 254, .22);
  }

  .timeline { position: relative; padding: 8px 0; }

  .timeline::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 2px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, rgba(110, 168, 254, .55) 8%, rgba(139, 92, 246, .5) 50%, rgba(245, 199, 107, .45) 92%, transparent);
  }

  .item {
    position: relative;
    width: 50%;
    padding: 0 42px 34px 0;
    opacity: 0;
    transform: translateY(18px);
    animation: rise .55s ease forwards;
  }

  .item:nth-child(even) {
    margin-left: 50%;
    padding: 0 0 34px 42px;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .item::before {
    content: "";
    position: absolute;
    top: 24px;
    right: -8px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #0b1224;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 5px rgba(110, 168, 254, .12), 0 0 18px rgba(110, 168, 254, .55);
    z-index: 2;
  }

  .item:nth-child(even)::before { right: auto; left: -7px; }

  .card {
    position: relative;
    cursor: pointer;
    border: 1px solid rgba(140, 170, 230, .2);
    border-radius: var(--radius);
    background: rgba(15, 23, 42, 0.95); /* 移除了 backdrop-filter，改用高不透明度纯色，防黑屏 */
    padding: 20px 20px 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    transition: .28s ease;
    overflow: hidden;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(110, 168, 254, .55);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .42), 0 0 0 1px rgba(110, 168, 254, .12);
  }

  .year {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .card h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.35; }
  .card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }

  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }

  .tag {
    font-size: 12px;
    color: #bcd2ff;
    border: 1px solid rgba(110, 168, 254, .22);
    background: rgba(110, 168, 254, .08);
    padding: 4px 9px;
    border-radius: 999px;
  }

  .hint {
    display: block;
    margin-top: 14px;
    color: rgba(159, 176, 208, .72);
    font-size: 12px;
  }

  .empty { text-align: center; color: var(--muted); padding: 50px 0; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(2, 6, 16, .85);
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    width: min(640px, 100%);
    max-height: 85vh;
    overflow: auto;
    border: 1px solid rgba(140, 170, 230, .3);
    border-radius: 24px;
    background: #151e36;
    padding: 30px;
    box-shadow: 0 30px 100px rgba(0, 0, 0, .6);
    transform: translateY(18px) scale(.98);
    opacity: 0;
    transition: .3s ease;
  }

  .modal-backdrop.show .modal {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .modal-top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .modal-year { color: var(--gold); font-weight: 800; letter-spacing: .08em; }

  .close-btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .05);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    flex: 0 0 auto;
  }

  .modal h3 { margin: 0 0 14px; font-size: 24px; line-height: 1.3; }

  .modal .detail {
    color: #c3d0e8;
    line-height: 1.9;
    font-size: 15px;
  }

  .modal .tags { margin-top: 20px; }

  @media (max-width: 760px) {
    .wrap { padding-top: 38px; }
    .timeline::before { left: 10px; transform: none; }

    .item,
    .item:nth-child(even) {
      width: 100%;
      margin-left: 0;
      padding: 0 0 26px 34px;
    }

    .item::before,
    .item:nth-child(even)::before {
      left: 3px; right: auto; top: 22px;
    }

    .card { padding: 18px; }
    .modal { padding: 24px; }
  }
</style>
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>
  <div class="nebula nebula-a" aria-hidden="true"></div>
  <div class="nebula nebula-b" aria-hidden="true"></div>
  <div class="nebula nebula-c" aria-hidden="true"></div>

  <main class="wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span> 从思想的萌芽，到智能时代的星河</div>
      <h1>群星闪耀</h1>
      <p class="subtitle">
        AI 大模型发展史 · 点击每张历史卡片，查看改变人工智能方向的关键时刻。
      </p>
    </header>

    <div class="toolbar" id="toolbar" aria-label="按类别筛选"></div>
    <section class="timeline" id="timeline" aria-live="polite"></section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <article class="modal">
      <div class="modal-top">
        <div class="modal-year" id="modalYear"></div>
        <button class="close-btn" id="closeBtn" aria-label="关闭">×</button>
      </div>
      <h3 id="modalTitle"></h3>
      <div class="detail" id="modalDetail"></div>
      <div class="tags" id="modalTags"></div>
    </article>
  </div>

<script>
// 将逻辑包在 DOMContentLoaded 确保执行安全
document.addEventListener("DOMContentLoaded", function () {
  
  /* ========== 数据 ========== */
  var events = [
    { year: "1950", title: "图灵测试：机器能思考吗？", category: "思想奠基",
      summary: "艾伦·图灵提出“机器能思考吗？”这一问题，并构想以对话判断机器智能的方法。",
      detail: "图灵在论文《计算机器与智能》中提出著名的“模仿游戏”，后来被称为图灵测试。它没有直接定义智能，而是给出一种可操作的外部判断方式，为人工智能学科埋下思想种子。",
      tags: ["图灵", "图灵测试", "思想实验"] },
    { year: "1956", title: "达特茅斯会议：AI 正式命名", category: "思想奠基",
      summary: "约翰·麦卡锡等人发起达特茅斯研讨会，“人工智能”作为学科名称正式出现。",
      detail: "达特茅斯夏季人工智能研究项目汇聚了早期研究者，讨论如何让机器使用语言、形成抽象概念并解决人类问题。它通常被视为人工智能学科诞生的标志。",
      tags: ["达特茅斯", "AI 学科", "麦卡锡"] },
    { year: "1986", title: "反向传播推动神经网络训练", category: "技术突破",
      summary: "反向传播算法被系统化推广，为多层神经网络训练提供了关键方法。",
      detail: "反向传播通过链式法则计算梯度，让多层神经网络能够根据误差调整权重。它成为深度学习的重要基础，影响了此后数十年的神经网络研究。",
      tags: ["反向传播", "神经网络", "梯度"] },
    { year: "1997", title: "深蓝战胜国际象棋世界冠军", category: "技术突破",
      summary: "IBM 深蓝击败加里·卡斯帕罗夫，展示专用搜索与计算系统的强大能力。",
      detail: "深蓝结合大规模并行计算、启发式搜索和国际象棋领域知识，在六局比赛中战胜世界冠军卡斯帕罗夫。它成为“专用智能系统”的标志性事件。",
      tags: ["深蓝", "国际象棋", "IBM"] },
    { year: "2012", title: "AlexNet 引爆深度学习", category: "技术突破",
      summary: "AlexNet 在 ImageNet 图像识别竞赛中大幅领先，深度学习革命加速。",
      detail: "AlexNet 使用卷积神经网络，并借助 GPU 训练，在 ImageNet 竞赛中显著降低错误率。它让学术界和产业界重新认识到深度神经网络的潜力。",
      tags: ["AlexNet", "CNN", "ImageNet", "GPU"] },
    { year: "2016", title: "AlphaGo 战胜李世石", category: "技术突破",
      summary: "深度强化学习与搜索结合，AlphaGo 在围棋对局中战胜人类顶尖棋手。",
      detail: "AlphaGo 结合深度神经网络、蒙特卡洛树搜索和强化学习，在复杂围棋领域取得突破。它展示了深度学习与强化学习结合解决高难度决策问题的潜力。",
      tags: ["AlphaGo", "强化学习", "围棋"] },
    { year: "2017", title: "Transformer 架构诞生", category: "范式变革",
      summary: "《Attention Is All You Need》提出 Transformer，成为后续大模型的核心基础。",
      detail: "Transformer 以自注意力机制为核心，摆脱了循环结构在并行计算上的限制。它后来成为 GPT、BERT 等大规模预训练模型的基础架构，深刻改变了自然语言处理方向。",
      tags: ["Transformer", "Attention", "大模型基础"] },
    { year: "2018", title: "BERT 推动预训练语言模型", category: "范式变革",
      summary: "BERT 采用双向 Transformer 预训练，推动自然语言理解进入预训练时代。",
      detail: "BERT 通过大规模无标注文本预训练，再在下游任务上微调，刷新了多项自然语言理解基准。它让“预训练 + 微调”成为主流范式之一。",
      tags: ["BERT", "预训练", "NLP"] },
    { year: "2020", title: "GPT-3 展示规模涌现能力", category: "范式变革",
      summary: "GPT-3 以大规模参数和少样本学习能力，展示大模型的通用潜力。",
      detail: "GPT-3 通过更大规模参数和训练数据，在少样本甚至零样本任务中表现出较强能力。它让“规模扩展”与“通用语言模型”成为大模型发展的重要方向。",
      tags: ["GPT-3", "少样本学习", "规模扩展"] },
    { year: "2022", title: "ChatGPT 让对话式 AI 走向大众", category: "普及与前沿",
      summary: "ChatGPT 以自然对话交互迅速普及，生成式 AI 进入大众视野。",
      detail: "ChatGPT 基于大语言模型和对话式交互，让普通用户可以直接用自然语言完成写作、问答、编程辅助等任务。它成为生成式 AI 普及的重要节点。",
      tags: ["ChatGPT", "对话式 AI", "生成式 AI"] },
    { year: "2023", title: "多模态与智能助手加速发展", category: "普及与前沿",
      summary: "文本、图像、语音等模态加速融合，AI 助手能力从对话扩展到多模态理解。",
      detail: "多模态模型能够同时处理文本、图像、音频等信息，智能助手开始具备更丰富的感知与交互能力。AI 应用从单轮问答走向更复杂的任务协作。",
      tags: ["多模态", "智能助手", "视觉", "语音"] },
    { year: "2024+", title: "推理、实时交互与智能体工作流", category: "普及与前沿",
      summary: "大模型向更强推理、实时语音视觉和智能体工作流方向演进。",
      detail: "前沿探索聚焦于复杂推理、工具调用、长期记忆、实时多模态交互和智能体协作。AI 系统不再只是回答问题，而是尝试规划并完成多步骤任务。",
      tags: ["推理", "智能体", "Agent", "实时交互"] }
  ];

  /* ========== 渲染逻辑 ========== */
  var timelineEl = document.getElementById("timeline");
  var toolbarEl = document.getElementById("toolbar");
  var backdrop = document.getElementById("modalBackdrop");
  var closeBtn = document.getElementById("closeBtn");
  var modalYear = document.getElementById("modalYear");
  var modalTitle = document.getElementById("modalTitle");
  var modalDetail = document.getElementById("modalDetail");
  var modalTags = document.getElementById("modalTags");

  var activeCategory = "全部";
  var categories = ["全部"];
  
  // 安全的数组去重，不使用 new Set，防止部分旧浏览器报错
  for (var i = 0; i < events.length; i++) {
    if (categories.indexOf(events[i].category) === -1) {
      categories.push(events[i].category);
    }
  }

  function renderFilters() {
    var html = "";
    for (var i = 0; i < categories.length; i++) {
      var cat = categories[i];
      var activeClass = (cat === activeCategory) ? "active" : "";
      html += '<button class="filter-btn ' + activeClass + '" data-cat="' + cat + '">' + cat + '</button>';
    }
    toolbarEl.innerHTML = html;

    var btns = toolbarEl.querySelectorAll(".filter-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].onclick = function() {
        activeCategory = this.getAttribute("data-cat");
        renderFilters();
        renderTimeline();
      };
    }
  }

  function renderTimeline() {
    var list = [];
    if (activeCategory === "全部") {
      list = events;
    } else {
      for (var k = 0; k < events.length; k++) {
        if (events[k].category === activeCategory) {
          list.push(events[k]);
        }
      }
    }

    if (list.length === 0) {
      timelineEl.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var idx = events.indexOf(e);
      var delay = Math.min(i * 60, 480);
      
      // 安全的字符串拼接，完全不使用嵌套模板反引号，规避部分手机浏览器解析崩溃
      var tagHtml = "";
      for (var t = 0; t < Math.min(3, e.tags.length); t++) {
        tagHtml += '<span class="tag">' + e.tags[t] + '</span>';
      }

      html += '<article class="item" style="animation-delay:' + delay + 'ms">' +
                '<div class="card" tabindex="0" role="button" data-index="' + idx + '" aria-label="查看 ' + e.year + ' ' + e.title + '">' +
                  '<span class="year">' + e.year + '</span>' +
                  '<h2>' + e.title + '</h2>' +
                  '<p>' + e.summary + '</p>' +
                  '<div class="tags">' + tagHtml + '</div>' +
                  '<span class="hint">点击卡片查看详情 →</span>' +
                '</div>' +
              '</article>';
    }
    timelineEl.innerHTML = html;

    // 绑定卡片事件
    var cards = timelineEl.querySelectorAll(".card");
    for (var c = 0; c < cards.length; c++) {
      cards[c].onclick = function() {
        openModal(parseInt(this.getAttribute("data-index"), 10));
      };
    }
  }

  function openModal(index) {
    var e = events[index];
    modalYear.textContent = e.year;
    modalTitle.textContent = e.title;
    modalDetail.textContent = e.detail;
    
    var tagHtml = "";
    for (var i = 0; i < e.tags.length; i++) {
      tagHtml += '<span class="tag">' + e.tags[i] + '</span>';
    }
    modalTags.innerHTML = tagHtml;

    backdrop.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    backdrop.classList.remove("show");
    document.body.style.overflow = "";
  }

  closeBtn.onclick = closeModal;
  backdrop.onclick = function(e) {
    if (e.target === backdrop) closeModal();
  };

  renderFilters();
  renderTimeline();


  /* ========== 冷白流星雨背景 ========== */
  try {
    var canvas = document.getElementById("bgCanvas");
    var ctx = canvas.getContext("2d");
    var TAU = Math.PI * 2;

    var PALETTES = [
      { head: "rgba(255,255,255,", tail: "rgba(205,228,255,", weight: 30 },
      { head: "rgba(248,252,255,", tail: "rgba(185,215,255,", weight: 30 },
      { head: "rgba(255,255,255,", tail: "rgba(220,238,255,", weight: 20 },
      { head: "rgba(238,246,255,", tail: "rgba(165,205,255,", weight: 20 }
    ];
    var PALETTE_WEIGHT_SUM = 0;
    for (var i = 0; i < PALETTES.length; i++) PALETTE_WEIGHT_SUM += PALETTES[i].weight;

    var SPRITE_LEN = 420;
    var SPRITE_H = 32;
    var SPRITE_DPR = Math.min(window.devicePixelRatio || 1, 2);
    var WIDTHS = [0.8, 1.3, 1.9];
    var sprites = [];

    for (var pi = 0; pi < PALETTES.length; pi++) {
      for (var wi = 0; wi < WIDTHS.length; wi++) {
        var p = PALETTES[pi];
        var width = WIDTHS[wi];
        
        var c = document.createElement("canvas");
        c.width = SPRITE_LEN * SPRITE_DPR;
        c.height = SPRITE_H * SPRITE_DPR;
        var g = c.getContext("2d");
        g.scale(SPRITE_DPR, SPRITE_DPR);

        var cy = SPRITE_H / 2;
        var headX = SPRITE_LEN - 4;

        var grad = g.createLinearGradient(headX, cy, 0, cy);
        grad.addColorStop(0,    p.head + "1)");
        grad.addColorStop(0.08, p.head + "0.85)");
        grad.addColorStop(0.3,  p.tail + "0.42)");
        grad.addColorStop(0.65, p.tail + "0.12)");
        grad.addColorStop(1,    p.tail + "0)");

        g.strokeStyle = grad;
        g.lineWidth = width;
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(headX, cy);
        g.lineTo(2, cy);
        g.stroke();

        var haloR = width * 4.5;
        var halo = g.createRadialGradient(headX, cy, 0, headX, cy, haloR);
        halo.addColorStop(0,   p.head + "0.9)");
        halo.addColorStop(0.35, p.tail + "0.35)");
        halo.addColorStop(1,   p.tail + "0)");
        g.fillStyle = halo;
        g.beginPath();
        g.arc(headX, cy, haloR, 0, TAU);
        g.fill();

        sprites.push(c);
      }
    }

    var LAYERS = [
      { share: 0.58, widthIdx: 0, speed: [280, 560], len: [70, 150], alpha: [0.28, 0.48], decay: [0.07, 0.11] },
      { share: 0.30, widthIdx: 1, speed: [480, 880], len: [110, 220], alpha: [0.42, 0.65], decay: [0.10, 0.15] },
      { share: 0.12, widthIdx: 2, speed: [700, 1150], len: [170, 320], alpha: [0.60, 0.85], decay: [0.14, 0.20] }
    ];

    var W = 0, H = 0, DPR = 1;
    var isMobile = false;
    var maxMeteors = 200;
    var METEOR_RATE = 99;

    var stars = [];
    var meteors = [];
    var rafId = null;
    var lastTime = 0;
    var spawnAccum = 0;

    function pick(arr) { return arr[0] + Math.random() * (arr[1] - arr[0]); }

    function pickLayer() {
      var r = Math.random();
      var acc = 0;
      for (var i = 0; i < LAYERS.length; i++) {
        acc += LAYERS[i].share;
        if (r <= acc) return LAYERS[i];
      }
      return LAYERS[0];
    }

    function createStars() {
      var count = isMobile ? 70 : 140;
      stars = [];
      for (var i = 0; i < count; i++) {
        var depth = Math.random();
        stars.push({
          x: -20 + Math.random() * (W + 40),
          y: -20 + Math.random() * (H + 40),
          r: 0.3 + depth * 1.2,
          baseAlpha: 0.16 + depth * 0.42,
          twinkle: 0.5 + Math.random() * 1.6,
          phase: Math.random() * TAU,
          vy: 1.2 + depth * 4,
          vx: (Math.random() - 0.5) * 1.2,
          color: Math.random() < 0.5 ? "#e8f2ff" : "#ffffff"
        });
      }
    }

    function createMeteor(layer) {
      var L = layer || pickLayer();
      var goingRight = Math.random() < 0.7;
      var angleDeg = goingRight ? 50 + Math.random() * 35 : 95 + Math.random() * 35;
      var angle = angleDeg * Math.PI / 180;

      var speed = pick(L.speed);
      var vx = Math.cos(angle) * speed;
      var vy = Math.sin(angle) * speed;

      var x, y;
      var edge = Math.random();
      if (edge < 0.62) {
        x = -W * 0.35 + Math.random() * W * 1.7;
        y = -40 - Math.random() * H * 0.35;
      } else {
        if (goingRight) {
          x = -40 - Math.random() * W * 0.4;
          y = -H * 0.15 + Math.random() * H * 1.0;
        } else {
          x = W + 40 + Math.random() * W * 0.4;
          y = -H * 0.15 + Math.random() * H * 1.0;
        }
      }

      var r = Math.random() * PALETTE_WEIGHT_SUM;
      var pi = 0;
      for (var i = 0; i < PALETTES.length; i++) {
        r -= PALETTES[i].weight;
        if (r <= 0) { pi = i; break; }
      }
      
      var sprite = sprites[pi * WIDTHS.length + L.widthIdx];

      return {
        x: x, y: y, vx: vx, vy: vy,
        life: 1,
        len: pick(L.len),
        baseAlpha: pick(L.alpha),
        decay: pick(L.decay),
        sprite: sprite
      };
    }

    function seedMeteors() {
      meteors = [];
      spawnAccum = 0;
      var initial = Math.floor(maxMeteors * 0.8);
      for (var i = 0; i < initial; i++) {
        var m = createMeteor();
        m.x = Math.random() * W;
        m.y = Math.random() * H;
        m.life = 0.3 + Math.random() * 0.7;
        meteors.push(m);
      }
    }

    function draw(t, dt) {
      ctx.clearRect(0, 0, W, H);

      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        if (dt > 0) {
          s.y -= s.vy * dt;
          s.x += s.vx * dt;
          if (s.y < -20) { s.y = H + 20; s.x = -20 + Math.random() * (W + 40); }
          if (s.x < -20) s.x = W + 20;
          if (s.x > W + 20) s.x = -20;
        }
        var a = s.baseAlpha * (0.55 + 0.45 * Math.sin(t * s.twinkle + s.phase));
        ctx.globalAlpha = Math.max(0, Math.min(1, a));
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (dt > 0 && meteors.length < maxMeteors) {
        spawnAccum += dt * METEOR_RATE;
        if (spawnAccum > 6) spawnAccum = 6;
        while (spawnAccum >= 1 && meteors.length < maxMeteors) {
          spawnAccum -= 1;
          meteors.push(createMeteor());
        }
      }

      for (var j = meteors.length - 1; j >= 0; j--) {
        var m = meteors[j];
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        m.life -= m.decay * dt;

        if (m.life <= 0 || m.x < -W * 0.9 || m.x > W * 1.9 || m.y > H * 1.5) {
          meteors.splice(j, 1);
          continue;
        }

        var alpha = m.baseAlpha * Math.min(1, m.life * 2.2);
        var angle = Math.atan2(m.vy, m.vx);
        var lenScale = (m.len * (0.45 + 0.55 * m.life)) / SPRITE_LEN;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(m.x, m.y);
        ctx.rotate(angle);
        ctx.scale(lenScale, 1);
        ctx.drawImage(m.sprite, -SPRITE_LEN, -SPRITE_H / 2, SPRITE_LEN, SPRITE_H);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function frame(now) {
      if (!lastTime) lastTime = now;
      var dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      draw(now / 1000, dt);
      rafId = requestAnimationFrame(frame);
    }

    function start() {
      if (rafId) return;
      lastTime = 0;
      rafId = requestAnimationFrame(frame);
    }

    function stop() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      isMobile = W < 760;
      var area = W * H;
      var densityFactor = isMobile ? 1 : Math.min(1.5, Math.max(0.9, area / (1600 * 900)));
      maxMeteors = Math.round((isMobile ? 120 : 200) * densityFactor);

      createStars();
      seedMeteors();
    }

    var resizeTimer;
    window.addEventListener("resize", function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150);
    });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden) stop(); else start();
    });

    resize();
    start();
  } catch (err) {
    // 如果背景报错，保证不影响页面内容
    console.warn("背景动画加载失败", err);
  }

});
</script>
</body>
</html>
