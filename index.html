<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>雨夜便利店 · Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070d}
  canvas{display:block}
  #hint{position:fixed;left:16px;bottom:14px;color:#6f86a8;font:12px/1.6 system-ui;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">雨夜便利店 · Three.js 程序化场景</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ---------- 基础 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a12);
scene.fog = new THREE.FogExp2(0x060a12, 0.02);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(7.5, 3.6, 10.5);
camera.lookAt(0, 2.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

/* ---------- 环境贴图（给湿地面反射用） ---------- */
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#0a1224');
  g.addColorStop(0.55, '#141c2e');
  g.addColorStop(1.0, '#04060a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  // 暖色光斑：模拟便利店灯光在环境中的贡献
  const rg = ctx.createRadialGradient(300, 175, 8, 300, 175, 130);
  rg.addColorStop(0, 'rgba(255,200,120,0.85)');
  rg.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, 512, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(makeEnvTexture()).texture;

/* ---------- 程序化噪声贴图 ---------- */
function noiseTexture(size, base, variance, repeat) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = Math.max(0, Math.min(255, base + (Math.random() - 0.5) * variance));
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  return tex;
}
const roughMap = noiseTexture(256, 55, 130, 10); // 越暗越光滑 → 水洼
const colorMap = noiseTexture(256, 28, 18, 10);

/* ---------- 灯光 ---------- */
scene.add(new THREE.AmbientLight(0x223355, 0.55));
const moon = new THREE.DirectionalLight(0x4466aa, 0.6);
moon.position.set(-12, 16, -8);
scene.add(moon);

/* ---------- 地面（湿沥青） ---------- */
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1b202b,
  map: colorMap,
  roughnessMap: roughMap,
  roughness: 0.35,
  metalness: 0.9,
  envMapIntensity: 1.0,
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------- 便利店 ---------- */
const store = new THREE.Group();
scene.add(store);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x2b303b, roughness: 0.75, metalness: 0.05 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 0.5, metalness: 0.1 });
const shelfMat = new THREE.MeshStandardMaterial({ color: 0x4b515d, roughness: 0.6, metalness: 0.1 });

// 后墙 / 侧墙 / 顶 / 地板
const backWall = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.25), wallMat);
backWall.position.set(0, 2, -3.1);
store.add(backWall);

for (const sx of [-1, 1]) {
  const side = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4, 6.4), wallMat);
  side.position.set(sx * 4.0, 2, 0);
  store.add(side);
}
const roof = new THREE.Mesh(new THREE.BoxGeometry(8.3, 0.25, 6.4), wallMat);
roof.position.set(0, 4.05, 0);
store.add(roof);
const floor = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.12, 6.2), floorMat);
floor.position.set(0, 0.06, 0);
store.add(floor);

// 室内灯管（发光的细长条）
const tubeMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfff4da).multiplyScalar(1.8) });
for (const z of [-1.8, -0.2, 1.4]) {
  const tube = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.1, 0.12), tubeMat);
  tube.position.set(0, 3.7, z);
  store.add(tube);
}

// 室内暖光
const storeLight = new THREE.PointLight(0xffd9a3, 90, 22, 2);
storeLight.position.set(0, 3.1, 0);
store.add(storeLight);
const storeLight2 = new THREE.PointLight(0xffe4b8, 45, 16, 2);
storeLight2.position.set(0, 2.2, 2.0);
store.add(storeLight2);

// 货架（透过玻璃看到的轮廓）
for (let i = -1; i <= 1; i++) {
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.0, 0.5), shelfMat);
  shelf.position.set(i * 2.1, 1.05, -2.4);
  store.add(shelf);
}
// 收银台
const counter = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.0, 0.7), shelfMat);
counter.position.set(2.3, 0.55, 1.0);
store.add(counter);

// 玻璃门面
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x9fc0dd,
  transparent: true,
  opacity: 0.16,
  roughness: 0.06,
  metalness: 0.0,
  envMapIntensity: 1.6,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const glass = new THREE.Mesh(new THREE.PlaneGeometry(7.9, 3.9), glassMat);
glass.position.set(0, 2.0, 3.18);
store.add(glass);

// 招牌
const signMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffcf6e).multiplyScalar(2.2) });
const sign = new THREE.Mesh(new THREE.BoxGeometry(8.4, 0.85, 0.18), signMat);
sign.position.set(0, 4.62, 3.15);
store.add(sign);

// 招牌补光
const signLight = new THREE.PointLight(0xffc86a, 35, 10, 2);
signLight.position.set(0, 4.4, 3.9);
store.add(signLight);

// 雨棚
const awning = new THREE.Mesh(
  new THREE.BoxGeometry(8.6, 0.1, 1.7),
  new THREE.MeshStandardMaterial({ color: 0x3a4050, roughness: 0.45, metalness: 0.4 })
);
awning.position.set(0, 4.12, 3.95);
awning.rotation.x = -0.14;
store.add(awning);

/* ---------- 雨 ---------- */
const RAIN_COUNT = 2600;
const rainGeo = new THREE.BoxGeometry(0.014, 0.55, 0.014);
const rainMat = new THREE.MeshBasicMaterial({
  color: 0xaaccff,
  transparent: true,
  opacity: 0.38,
  depthWrite: false,
});
const rain = new THREE.InstancedMesh(rainGeo, rainMat, RAIN_COUNT);
rain.frustumCulled = false;
scene.add(rain);

const dummy = new THREE.Object3D();
const drops = [];
for (let i = 0; i < RAIN_COUNT; i++) {
  const d = {
    x: (Math.random() - 0.5) * 60,
    y: Math.random() * 22,
    z: (Math.random() - 0.5) * 60,
    v: 14 + Math.random() * 10,
  };
  drops.push(d);
  dummy.position.set(d.x, d.y, d.z);
  dummy.rotation.set(0, 0, 0.08);
  dummy.updateMatrix();
  rain.setMatrixAt(i, dummy.matrix);
}
rain.instanceMatrix.needsUpdate = true;

function updateRain(dt) {
  for (let i = 0; i < RAIN_COUNT; i++) {
    const d = drops[i];
    d.y -= d.v * dt;
    if (d.y < 0) {
      d.y = 22;
      d.x = (Math.random() - 0.5) * 60;
      d.z = (Math.random() - 0.5) * 60;
      d.v = 14 + Math.random() * 10;
    }
    dummy.position.set(d.x, d.y, d.z);
    dummy.rotation.set(0, 0, 0.08);
    dummy.updateMatrix();
    rain.setMatrixAt(i, dummy.matrix);
  }
  rain.instanceMatrix.needsUpdate = true;
}

/* ---------- 后期：辉光 ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.85,  // strength 辉光强度
  0.5,   // radius   扩散半径
  0.75   // threshold 触发阈值
);
composer.addPass(bloom);

/* ---------- 循环 ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateRain(dt);
  composer.render();
}
animate();

/* ---------- 自适应 ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
