
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06101e">
<meta name="description" content="雨夜便利店——沉浸式霓虹雨夜互动体验">
<title>雨夜便利店 · MIDNIGHT STORE</title>
<style>
:root{
  --cyan:#56eaff;
  --blue:#4d7cff;
  --pink:#ff4fba;
  --gold:#ffd58b;
  --night:#06101e;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:var(--night);
  color:#eaf7ff;
  font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit}
button{color:inherit;cursor:pointer}
#world{
  position:fixed;inset:0;overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(ellipse at 50% 38%,#17324a 0%,transparent 55%),
    linear-gradient(#071321 0%,#0b1b2b 52%,#080f19 100%);
}
#sky{
  position:absolute;inset:0 0 28%;
  background:
    radial-gradient(ellipse at 75% 25%,#17415a55,transparent 35%),
    linear-gradient(180deg,#07101f 0%,#12263a 70%,#213b4b 100%);
}
.stars{
  position:absolute;inset:0;opacity:.55;
  background-image:
    radial-gradient(1px 1px at 12% 19%,#fff,transparent),
    radial-gradient(1px 1px at 80% 12%,#b8edff,transparent),
    radial-gradient(2px 2px at 63% 27%,#fff,transparent),
    radial-gradient(1px 1px at 32% 33%,#fff,transparent),
    radial-gradient(1px 1px at 92% 39%,#fff,transparent);
}
.city{
  position:absolute;left:-5%;right:-5%;bottom:27%;
  height:32%;display:flex;align-items:flex-end;
  gap:5px;opacity:.82;
}
.building{
  flex:1;min-width:24px;height:var(--h);
  position:relative;
  background:linear-gradient(90deg,#08101c,#16283a 50%,#0a1320);
  border-top:1px solid #29445b;
}
.building:before{
  content:"";position:absolute;inset:8px 4px;
  background:repeating-linear-gradient(0deg,transparent 0 13px,#f5c56b20 14px 17px);
}
.building:after{
  content:"";position:absolute;inset:8px 4px;
  background:repeating-linear-gradient(90deg,transparent 0 12px,#6adfff30 13px 16px);
}
#horizon{
  position:absolute;bottom:27%;left:0;right:0;height:2px;
  background:#8edbff55;box-shadow:0 0 24px #58c9ff;
}
#road{
  position:absolute;left:0;right:0;bottom:0;height:35%;
  background:
    linear-gradient(180deg,#17222d 0%,#080e17 100%);
  clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);
}
#road:before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent 0 26px,#a7d9ff09 27px 29px);
}
.road-line{
  position:absolute;left:49.5%;top:8%;width:1%;
  height:90%;opacity:.25;
  background:repeating-linear-gradient(180deg,#e8f8ff 0 22px,transparent 22px 48px);
  transform:perspective(120px) rotateX(15deg);
}
.puddle{
  position:absolute;border-radius:50%;
  background:linear-gradient(100deg,#3aa7d522,#9de9ff20,#101e2a55);
  border:1px solid #8bdfff18;
  filter:blur(1px);
}
.p1{width:28%;height:4%;bottom:7%;left:10%}
.p2{width:19%;height:3%;bottom:17%;right:8%}
.p3{width:32%;height:3%;bottom:3%;right:25%}
.neon-reflection{
  position:absolute;bottom:0;height:27%;
  width:9%;filter:blur(10px);opacity:.22;
  background:linear-gradient(180deg,var(--c),transparent);
  transform:perspective(90px) rotateX(-8deg);
}
#store{
  position:absolute;
  width:min(70vw,680px);
  height:min(49vh,440px);
  min-height:265px;
  left:50%;top:43%;
  transform:translate(-50%,-50%);
  transition:transform .6s ease,width .5s;
  filter:drop-shadow(0 12px 35px #0009);
}
#store-front{
  position:absolute;inset:12% 0 0;
  border:2px solid #466d84;
  background:linear-gradient(180deg,#20394b,#111e2a);
  box-shadow:inset 0 0 30px #55cfff18,0 0 18px #44d9ff18;
}
.roof{
  position:absolute;left:-3%;right:-3%;top:7%;height:10%;
  background:linear-gradient(180deg,#42637b,#182b3b 70%,#0a1725);
  border:1px solid #7394a9;
  transform:skewX(-8deg);
}
.sign{
  position:absolute;left:5%;right:5%;top:0;height:16%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#101e32,#0a1525);
  border:2px solid #4feaff;
  box-shadow:0 0 12px #30dfff, inset 0 0 18px #25cfff33;
  color:#9af7ff;font-weight:900;
  letter-spacing:clamp(3px,1vw,9px);
  font-size:clamp(15px,2.3vw,28px);
  text-shadow:0 0 7px #3ceaff,0 0 20px #2edbff;
  z-index:4;
}
.sign small{
  color:#ff8bd3;font-size:.38em;letter-spacing:2px;
  margin-left:10px;text-shadow:0 0 8px #ff4fba;
}
.windows{
  position:absolute;inset:20% 3% 5%;
  display:grid;grid-template-columns:1fr 1fr 27%;
  gap:7px;
  padding:7px;background:#0c1a27;
}
.window{
  position:relative;overflow:hidden;
  border:3px solid #58778b;
  background:
    linear-gradient(180deg,#0a2537aa,#b2d8e71b),
    linear-gradient(90deg,#183c51,#152b3b 45%,#244355);
  box-shadow:inset 0 0 25px #75dfff25;
}
.window:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,#fff1 0%,transparent 30%,#c9f8ff08 50%,transparent 72%);
}
.interior-light{
  position:absolute;inset:0 0 auto;height:9%;
  background:#ffe7ad;
  box-shadow:0 0 20px #ffda8d;
}
.shelf{
  position:absolute;left:5%;right:5%;top:20%;
  height:52%;
  display:flex;flex-direction:column;justify-content:space-between;
}
.shelf-row{
  height:27%;border-bottom:3px solid #9aa9ac;
  display:flex;align-items:flex-end;gap:3px;
  background:#18242d77;
}
.product{
  flex:1;height:var(--ph,70%);
  min-width:3px;border-radius:2px 2px 1px 1px;
  background:var(--pc);
  box-shadow:inset -2px 0 2px #0004,0 0 4px color-mix(in srgb,var(--pc),transparent 50%);
  position:relative;
}
.product:after{
  content:"";position:absolute;top:25%;left:10%;right:10%;
  height:18%;background:#fff8;
}
.fridge{
  position:absolute;inset:14% 6% 8%;
  border:3px solid #93c4d4;
  background:linear-gradient(90deg,#102d40,#24495a,#0b2435);
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;padding:5px;
  box-shadow:0 0 12px #5ee7ff33;
}
.fridge-door{
  position:relative;border:1px solid #a5eaff6b;
  background:linear-gradient(90deg,#ffffff08,#9cecff14,#ffffff06);
}
.bottle{
  position:absolute;bottom:8%;left:20%;width:60%;height:70%;
  border-radius:3px 3px 5px 5px;
  background:repeating-linear-gradient(180deg,#7bffb0 0 8%,#159b72 9% 20%,#0c604f 21% 25%);
  box-shadow:0 0 5px #70ffbd66;
}
.bottle:before{
  content:"";position:absolute;width:45%;height:12%;
  top:-10%;left:28%;background:#9af7cb;border-radius:2px 2px 0 0;
}
.cashier{
  position:absolute;left:8%;right:8%;bottom:10%;height:23%;
  background:linear-gradient(180deg,#6e5c4a,#302a2a);
  border-top:4px solid #b6a18a;
}
.cashier:before{
  content:"";position:absolute;top:-45%;left:25%;width:35%;height:40%;
  background:#1a222a;border:2px solid #8fa4a8;
  box-shadow:inset 0 0 8px #60f1ff33;
}
.cashier:after{
  content:"";position:absolute;top:-31%;left:30%;width:25%;height:18%;
  background:#64ffbb;box-shadow:0 0 10px #64ffbb;
}
.floor{
  position:absolute;bottom:0;left:0;right:0;height:10%;
  background:linear-gradient(180deg,#d9a76a22,#16222c);
}
.door{
  position:absolute;inset:0;
  border:2px solid #b3d7df66;
  background:linear-gradient(90deg,#8ceaff10,#ffffff03);
  transition:background .3s;
}
.door.open{background:#b3f7ff28}
.door-handle{
  position:absolute;right:12%;top:47%;
  width:3px;height:22%;background:#d9eff5;
  box-shadow:0 0 5px #8deaff;
}
.door-label{
  position:absolute;bottom:10%;left:0;right:0;
  text-align:center;font-size:9px;color:#d1efff;
}
.awning{
  position:absolute;top:16%;left:-2%;right:-2%;height:8%;
  background:repeating-linear-gradient(90deg,#f0f3ed 0 9%,#c94362 9% 18%);
  border-bottom:3px solid #6c3549;
}
.entrance-step{
  position:absolute;bottom:0;right:1%;width:28%;height:6%;
  background:#8b9ba5;border-top:2px solid #d2e4e9;
}
.shop-glow{
  position:absolute;inset:8% -15% -8%;
  background:radial-gradient(ellipse at 50% 35%,#52caff20,transparent 65%);
  pointer-events:none;
}
#people,#cars,#rain,#drops,#ripples{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.person{
  position:absolute;bottom:21%;
  width:clamp(13px,2vw,23px);height:clamp(40px,7vw,75px);
  animation:walk var(--duration) linear infinite;
  animation-delay:var(--delay);
  left:-10%;
  filter:drop-shadow(0 0 5px #6acfff35);
}
.person .umbrella{
  position:absolute;top:0;left:-35%;width:170%;height:27%;
  border-radius:80% 80% 8% 8%;
  background:var(--umbrella);
  border-bottom:2px solid #c4edff;
}
.person .body{
  position:absolute;top:25%;left:20%;width:60%;height:53%;
  border-radius:40% 40% 12% 12%;
  background:var(--coat);
}
.person .head{
  position:absolute;top:18%;left:32%;width:36%;height:13%;
  border-radius:50%;background:#bda28f;
}
.person .legs{
  position:absolute;bottom:0;left:24%;width:18%;height:27%;
  background:#111b26;box-shadow:9px 0 #111b26;
}
@keyframes walk{
  0%{left:-10%;transform:translateY(0)}
  100%{left:110%;transform:translateY(0)}
}
.car{
  position:absolute;left:-30%;bottom:var(--bottom);
  width:clamp(75px,14vw,150px);height:clamp(25px,4vw,42px);
  animation:drive var(--speed) linear infinite;
  animation-delay:var(--delay);
}
.car-body{
  position:absolute;bottom:15%;left:4%;right:4%;height:55%;
  border-radius:8px 12px 3px 3px;
  background:var(--carcolor);
  border-top:2px solid #d6edff66;
}
.car-top{
  position:absolute;bottom:58%;left:25%;width:48%;height:35%;
  background:linear-gradient(110deg,#9cd8edaa,#192f40);
  clip-path:polygon(18% 0,78% 0,100% 100%,0 100%);
}
.wheel{
  position:absolute;bottom:0;width:18%;height:30%;
  background:#080c12;border:2px solid #758795;border-radius:50%;
}
.wheel.a{left:18%}.wheel.b{right:15%}
.headlight{
  position:absolute;right:0;top:40%;width:9%;height:22%;
  background:#fff5c5;box-shadow:0 0 12px 5px #fff3a066;
}
.taillight{
  position:absolute;left:0;top:40%;width:7%;height:22%;
  background:#ff3654;box-shadow:0 0 10px #ff3654;
}
@keyframes drive{
  from{left:-30%}
  to{left:120%}
}
#rain{opacity:.7}
#rain canvas,#drops canvas{
  width:100%;height:100%;display:block;
}
#drops{opacity:.7}
#mist{
  position:absolute;inset:25% 0 0;pointer-events:none;
  background:linear-gradient(180deg,transparent,#91d9ff06 55%,#c4e7ff09);
  animation:mist 8s ease-in-out infinite alternate;
}
@keyframes mist{to{opacity:.4;transform:translateX(2%)}}
#topbar{
  position:absolute;top:env(safe-area-inset-top,0px);
  left:0;right:0;padding:14px 16px;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;pointer-events:none;
}
.brand{pointer-events:auto}
.brand h1{
  margin:0;font-size:clamp(18px,4vw,27px);
  letter-spacing:3px;font-weight:800;
  text-shadow:0 0 15px #59dfff7c;
}
.brand p{margin:4px 0 0;color:#9ab6ca;font-size:10px;letter-spacing:2px}
.status{
  pointer-events:auto;padding:7px 10px;border:1px solid #72cce744;
  background:#061421aa;backdrop-filter:blur(8px);
  font-size:11px;color:#bcefff;border-radius:20px;
  display:flex;align-items:center;gap:7px;
}
.dot{width:6px;height:6px;border-radius:50%;background:#66ffb6;box-shadow:0 0 9px #66ffb6}
#clock{font-variant-numeric:tabular-nums}
#weather{
  position:absolute;top:100px;left:16px;
  font-size:11px;line-height:1.8;color:#b6ccdb;
  padding:9px 12px;background:#071522a8;
  border-left:2px solid #5fe4ff;
  backdrop-filter:blur(8px);
}
#weather strong{color:#e3faff;font-weight:600}
#caption{
  position:absolute;left:50%;bottom:calc(125px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  width:max-content;max-width:90%;
  color:#d8edfa;font-size:12px;letter-spacing:1px;
  text-align:center;text-shadow:0 2px 8px #000;
  padding:8px 15px;background:#06111d88;
  border:1px solid #7fdcff22;border-radius:30px;
  transition:opacity .5s;
}
#panel{
  position:absolute;left:0;right:0;bottom:0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,#06101edb 22%,#06101ef5);
}
.controls{
  display:flex;justify-content:center;gap:8px;
  flex-wrap:wrap;max-width:700px;margin:0 auto;
}
.ctrl{
  min-width:66px;padding:10px 12px;
  border:1px solid #72dfff35;border-radius:12px;
  background:linear-gradient(180deg,#14293bdc,#091725ed);
  box-shadow:inset 0 1px #ffffff0a;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;transition:.2s;
}
.ctrl .ico{font-size:19px;line-height:1.2}
.ctrl:active{transform:scale(.95)}
.ctrl.active{border-color:#58eaffa8;background:#123346;box-shadow:0 0 14px #36dfff16}
.ctrl.primary{border-color:#5ceaff80}
.settings{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:12px;margin:12px auto 0;
  max-width:620px;color:#aac4d5;font-size:11px;
}
.setting{display:flex;align-items:center;gap:7px}
input[type=range]{width:85px;accent-color:#5be6ff;height:18px}
select{
  max-width:105px;color:#d9f7ff;
  background:#122536;border:1px solid #5cbbd955;
  padding:5px 6px;border-radius:7px;font-size:11px;
}
#toast{
  position:absolute;top:48%;left:50%;
  transform:translate(-50%,-50%);
  padding:14px 22px;background:#071725ed;
  border:1px solid #68e6ff80;border-radius:12px;
  color:#d8f9ff;font-size:13px;
  box-shadow:0 0 30px #3bceff25;
  opacity:0;pointer-events:none;transition:opacity .3s;
  text-align:center;z-index:20;
}
#toast.show{opacity:1}
#photo-frame{
  position:absolute;inset:10px;border:1px solid #d4f5ff88;
  pointer-events:none;opacity:0;transition:opacity .3s;
}
body.photo-mode #photo-frame{opacity:1}
body.photo-mode #topbar,body.photo-mode #panel,
body.photo-mode #weather,body.photo-mode #caption{opacity:0;pointer-events:none}
body.inside #store{width:min(90vw,760px);transform:translate(-50%,-48%) scale(1.1)}
body.inside #world{background:#091722}
body.inside #sky{filter:brightness(.65)}
body.low #people,body.low #cars{opacity:.65}
body.low #mist,body.low .neon-reflection{display:none}
body.low *{animation-duration:calc(var(--duration, 1s) * 1.6)}
@media(max-width:480px){
  #store{width:91vw;height:36vh;min-height:235px;top:43%}
  .windows{gap:4px;padding:4px}
  .window{border-width:2px}
  #weather{top:88px;left:10px;padding:7px 9px;font-size:10px}
  #topbar{padding:12px 11px}
  .brand h1{letter-spacing:2px}
  #panel{padding-left:8px;padding-right:8px}
  .controls{gap:6px}
  .ctrl{min-width:57px;padding:8px 8px;font-size:10px}
  .ctrl .ico{font-size:17px}
  .settings{gap:8px;font-size:10px}
  input[type=range]{width:65px}
  #caption{bottom:calc(145px + env(safe-area-inset-bottom,0px));font-size:10px}
}
@media(max-height:540px){
  #store{height:55vh;min-height:190px;top:43%}
  #weather{top:65px}
  #panel{padding-top:5px}
  .ctrl{padding:5px 8px}
  .ctrl .ico{font-size:15px}
  .settings{margin-top:5px}
  #caption{bottom:110px}
}
</style>
</head>
<body>
<div id="world">
  <div id="sky"><div class="stars"></div></div>
  <div class="city" id="city"></div>
  <div id="horizon"></div>
  <div id="road"><div class="road-line"></div></div>
  <div class="puddle p1"></div><div class="puddle p2"></div><div class="puddle p3"></div>
  <div class="neon-reflection" style="--c:#4beaff;left:31%"></div>
  <div class="neon-reflection" style="--c:#ff4fba;left:48%;width:6%"></div>
  <div class="neon-reflection" style="--c:#ffd58b;left:61%;width:12%"></div>

  <div class="shop-glow"></div>
  <div id="store">
    <div class="roof"></div>
    <div class="sign">雨夜便利店 <small>OPEN 24H</small></div>
    <div class="awning"></div>
    <div id="store-front">
      <div class="windows">
        <div class="window">
          <div class="interior-light"></div>
          <div class="shelf" id="snack-shelf"></div>
          <div class="cashier"></div>
          <div class="floor"></div>
        </div>
        <div class="window">
          <div class="interior-light"></div>
          <div class="fridge" id="fridge"></div>
          <div class="floor"></div>
        </div>
        <div class="window">
          <div class="interior-light"></div>
          <div class="door" id="door">
            <div class="door-handle"></div>
            <div class="door-label">PUSH / 推</div>
          </div>
          <div class="floor"></div>
        </div>
      </div>
    </div>
    <div class="entrance-step"></div>
  </div>

  <div id="cars"></div>
  <div id="people"></div>
  <div id="rain"><canvas id="rainCanvas"></canvas></div>
  <div id="drops"><canvas id="dropCanvas"></canvas></div>
  <div id="ripples"></div>
  <div id="mist"></div>

  <div id="topbar">
    <div class="brand">
      <h1>雨夜便利店</h1>
      <p>MIDNIGHT CONVENIENCE STORE</p>
    </div>
    <div class="status"><span class="dot"></span><span id="clock">23:48</span><span>营业中</span></div>
  </div>

  <div id="weather">
    <strong>☔ 城市夜雨</strong><br>
    <span id="rainLabel">中雨 · 18°C</span><br>
    <span>路面湿滑 · 能见度低</span>
  </div>

  <div id="caption">雨声很轻，城市很远。今晚，慢一点也没关系。</div>
  <div id="toast"></div>
  <div id="photo-frame"></div>

  <div id="panel">
    <div class="controls">
      <button class="ctrl primary" id="viewBtn"><span class="ico">◉</span><span>切换视角</span></button>
      <button class="ctrl" id="rotateBtn"><span class="ico">⟳</span><span>自动旋转</span></button>
      <button class="ctrl" id="enterBtn"><span class="ico">🚪</span><span>进店体验</span></button>
      <button class="ctrl active" id="rainBtn"><span class="ico">🌧</span><span>雨幕开关</span></button>
      <button class="ctrl" id="musicBtn"><span class="ico">♫</span><span>背景音乐</span></button>
      <button class="ctrl" id="soundBtn"><span class="ico">🔊</span><span>雨声音效</span></button>
      <button class="ctrl" id="photoBtn"><span class="ico">▣</span><span>拍照模式</span></button>
    </div>
    <div class="settings">
      <label class="setting">雨量
        <select id="rainLevel">
          <option value="1">细雨</option>
          <option value="2" selected>中雨</option>
          <option value="3">大雨</option>
          <option value="4">暴雨</option>
        </select>
      </label>
      <label class="setting">音量
        <input id="volume" type="range" min="0" max="100" value="35">
        <span id="volumeLabel">35%</span>
      </label>
      <label class="setting">画质
        <select id="quality">
          <option value="high">精细</option>
          <option value="medium" selected>均衡</option>
          <option value="low">省电</option>
        </select>
      </label>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const body=document.body;
let toastTimer=0;
function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1900);
}
function buttonState(id,on){
  $(id).classList.toggle('active',on);
}

// 随机城市楼房
const city=$('city');
for(let i=0;i<22;i++){

// 雨幕 Canvas：使用设备像素比限制，减少手机性能消耗
const rainCanvas=$('rainCanvas');
const rainCtx=rainCanvas.getContext('2d',{alpha:true});
const dropCanvas=$('dropCanvas');
const dropCtx=dropCanvas.getContext('2d',{alpha:true});
let W=0,H=0,dpr=1;
let rainDrops=[],groundDrops=[];
let rainIntensity=2,quality='medium',rainEnabled=true;
let lastFrame=0,raf=0;
let frameCount=0;

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,quality==='high'?1.5:1);
  for(const c of [rainCanvas,dropCanvas]){
    c.width=Math.round(W*dpr);
    c.height=Math.round(H*dpr);
    c.style.width=W+'px';
    c.style.height=H+'px';
  }
  rainCtx.setTransform(dpr,0,0,dpr,0,0);
  dropCtx.setTransform(dpr,0,0,dpr,0,0);
  initRain();
}
function initRain(){
  const base=quality==='low'?100:quality==='medium'?240:430;
  const count=Math.round(base*rainIntensity/2);
  rainDrops=Array.from({length:count},()=>({
    x:Math.random()*W,y:Math.random()*H,
    len:8+Math.random()*20,
    speed:450+Math.random()*750,
    drift:-70-Math.random()*55,
    alpha:.12+Math.random()*.35
  }));
  groundDrops=Array.from({length:quality==='low'?7:18},()=>({
    x:Math.random()*W,y:H*(.64+Math.random()*.34),
    r:2+Math.random()*9,phase:Math.random()*Math.PI*2,
    speed:.8+Math.random()*1.5
  }));
}
function drawRain(dt){
  rainCtx.clearRect(0,0,W,H);
  if(!rainEnabled)return;
  rainCtx.lineWidth=quality==='low'?0.7:1;
  rainCtx.lineCap='round';
  for(const d of rainDrops){
    rainCtx.strokeStyle='rgba(161,218,246,'+(d.alpha*(rainIntensity/2))+')';
    rainCtx.beginPath();
    rainCtx.moveTo(d.x,d.y);
    rainCtx.lineTo(d.x+d.drift*.025,d.y+d.len);
    rainCtx.stroke();
    d.x+=d.drift*dt;
    d.y+=d.speed*dt;
    if(d.y>H+30||d.x<-30){
      d.y=-d.len;
      d.x=Math.random()*(W+50);
    }
  }
}
function drawDrops(time){
  dropCtx.clearRect(0,0,W,H);
  if(!rainEnabled||quality==='low')return;
  for(const d of groundDrops){
    const phase=(time*.001*d.speed+d.phase)%(Math.PI*2);
    const r=d.r*(.5+Math.abs(Math.sin(phase)));
    dropCtx.beginPath();
    dropCtx.ellipse(d.x,d.y,r,r*.36,0,0,Math.PI*2);
    dropCtx.strokeStyle='rgba(151,218,255,'+(0.15+Math.abs(Math.sin(phase))*.2)+')';
    dropCtx.lineWidth=1;
    dropCtx.stroke();
  }
}
function animate(time){
  raf=requestAnimationFrame(animate);
  if(time-lastFrame<(quality==='low'?50:quality==='medium'?30:16))return;
  const dt=Math.min((time-lastFrame)/1000,.05);
  lastFrame=time;
  frameCount++;
  drawRain(dt);
  if(frameCount%2===0)drawDrops(time);
}
window.addEventListener('resize',resize,{passive:true});
resize();
raf=requestAnimationFrame(animate);

// Web Audio：本地合成雨声与柔和背景音乐，不依赖外部音频文件
let audioCtx=null,master=null,rainGain=null,musicGain=null;
let rainSource=null,rainFilter=null,musicNodes=[];
let rainSoundOn=false,musicOn=false;
let audioReady=false;
let volume=.35;

function ensureAudio(){
  if(audioCtx){
    if(audioCtx.state==='suspended')audioCtx.resume();
    return;
  }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){toast('此浏览器暂不支持网页音频');return}
  audioCtx=new AC();
  master=audioCtx.createGain();
  master.gain.value=volume;
  master.connect(audioCtx.destination);

  // 连续随机噪声，经滤波后形成柔和雨声
  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  rainSource=audioCtx.createBufferSource();
  rainSource.buffer=buffer;
  rainSource.loop=true;
  rainFilter=audioCtx.createBiquadFilter();
  rainFilter.type='lowpass';
  rainFilter.frequency.value=1300;
  const rainVolume=audioCtx.createGain();
  rainVolume.gain.value=.18;
  rainGain=rainVolume;
  rainSource.connect(rainFilter);
  rainFilter.connect(rainGain);
  rainGain.connect(master);
  rainSource.start();

  musicGain=audioCtx.createGain();
  musicGain.gain.value=0;
  musicGain.connect(master);
  audioReady=true;
}
function makeTone(freq,when,duration,gain,filterType){
  const osc=audioCtx.createOscillator();
  const amp=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();
  osc.type='sine';
  osc.frequency.value=freq;
  filter.type=filterType||'lowpass';
  filter.frequency.value=1200;
  amp.gain.setValueAtTime(0.0001,when);
  amp.gain.exponentialRampToValueAtTime(gain,when+.4);
  amp.gain.setValueAtTime(gain,when+duration*.65);
  amp.gain.exponentialRampToValueAtTime(.0001,when+duration);
  osc.connect(filter);
  filter.connect(amp);
  amp.connect(musicGain);
  osc.start(when);
  osc.stop(when+duration+.05);
  musicNodes.push(osc);
}
let musicTimer=null;
function playMusic(){
  if(!audioCtx)return;
  if(musicTimer)clearInterval(musicTimer);
  musicNodes=[];
  const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,
               220,261.63,329.63,261.63,196,246.94,293.66,246.94];
  let index=0;
  const playPhrase=()=>{
    if(!musicOn||!audioCtx)return;
    const now=audioCtx.currentTime;
    makeTone(notes[index%notes.length],now,.95,.065);
    if(index%4===0)makeTone(notes[index%notes.length]/2,now,1.7,.045);
    index++;
  };
  playPhrase();
  musicTimer=setInterval(playPhrase,1050);
}
function stopMusic(){
  if(musicTimer)clearInterval(musicTimer);
  musicTimer=null;
  if(musicGain&&audioCtx){
    musicGain.gain.setTargetAtTime(0,audioCtx.currentTime,.2);
  }
  musicNodes.forEach(n=>{try{n.stop()}catch(e){}});
  musicNodes=[];
}
$('soundBtn').addEventListener('click',()=>{
  ensureAudio();
  if(!audioCtx)return;
  rainSoundOn=!rainSoundOn;
  rainGain.gain.setTargetAtTime(rainSoundOn?.2:0,audioCtx.currentTime,.15);
  buttonState('soundBtn',rainSoundOn);
  $('soundBtn').lastElementChild.textContent=rainSoundOn?'雨声已开':'雨声音效';
  if(rainSoundOn&&!musicOn)master.gain.setTargetAtTime(volume,audioCtx.currentTime,.1);
  toast(rainSoundOn?'雨声音效已开启':'雨声音效已关闭');
});
$('musicBtn').addEventListener('click',()=>{

    musicGain.gain.setTargetAtTime(1,audioCtx.currentTime,.5);
    playMusic();
  }
