
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07121d">
<title>深夜便利店｜3D 第一人称游戏</title>
<style>
*{box-sizing:border-box}
html,body,#game{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#07121d;color:#edf7ff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{border:1px solid #bce8ff55;border-radius:12px;padding:10px 14px;background:#0a1b2be8;color:#f3faff;font:inherit;user-select:none;-webkit-tap-highlight-color:transparent}
button:active{background:#2b5168}
#loading,#start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse,#17384b,#050a10 75%);text-align:center}
#start{display:none}
.panel{width:min(440px,100%);padding:24px;border:1px solid #9edfff45;border-radius:20px;background:#081522f2;box-shadow:0 18px 70px #0009}
h1{margin:0 0 12px;font-size:28px;letter-spacing:3px}
.small{font-size:12px;color:#a9c2d3;line-height:1.8}
.primary{width:100%;margin-top:12px;background:#c5eaff;color:#081522;border:0;font-weight:800;padding:13px}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.glass{background:#06131fce;border:1px solid #d2efff2b;border-radius:12px;padding:9px 11px;backdrop-filter:blur(7px);font-size:12px}
#time{font-size:16px;font-weight:800}
#goal{position:absolute;top:68px;left:10px;max-width:76vw;line-height:1.6}
#goal b{display:block;color:#a8e7ff}
#reticle{position:absolute;left:50%;top:50%;width:9px;height:9px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 8px #fff9}
#prompt{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);font-size:12px;white-space:nowrap;background:#06121cdb;padding:5px 9px;border-radius:7px}
#controls{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));height:155px}
#pad{position:absolute;left:14px;bottom:0;width:142px;height:142px;pointer-events:auto}
.move{position:absolute;width:44px;height:44px;padding:0;font-size:20px;background:#071827e8}
#up{left:49px;top:0}#down{left:49px;bottom:0}#left{left:0;top:49px}#right{right:0;top:49px}
#actions{position:absolute;right:12px;bottom:4px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#use{background:#c5eaff;color:#071521;font-weight:800;min-width:112px}
#dialog{display:none;position:absolute;left:10px;right:10px;bottom:180px;max-width:540px;margin:auto;padding:15px;border-radius:16px;border:1px solid #9edfff55;background:#071522f5;pointer-events:auto}
#speaker{color:#a0e4ff;font-size:12px;margin-bottom:7px}
#dialogText{font-size:14px;line-height:1.8}
#choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#choices button{font-size:12px}
#phone{display:none;position:absolute;top:65px;right:10px;bottom:75px;width:min(340px,calc(100vw - 20px));padding:15px;border:1px solid #a5e4ff55;border-radius:20px;background:#071521f5;overflow:auto;pointer-events:auto}
#phoneHeader{display:flex;justify-content:space-between;align-items:center}
#phone h2{font-size:18px;margin:4px 0 12px}
.note{padding:11px;margin:8px 0;background:#142a3b;border-radius:10px;font-size:12px;line-height:1.7}
.note b{color:#a6e7ff}
#toast{display:none;position:absolute;left:50%;top:25%;transform:translateX(-50%);max-width:85vw;padding:10px 14px;border:1px solid #a5e5ff55;border-radius:10px;background:#06131fee;text-align:center;font-size:13px}
@media(min-width:800px){#dialog{bottom:25px}#pad{left:25px}#actions{right:25px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="loading">
 <div class="panel">
  <h1>深夜便利店</h1>
  <p class="small">正在加载本地 Three.js 3D 引擎……</p>
  <p class="small">请确认 three.module.js 与 index.html 位于同一个目录。</p>
 </div>
</div>

<div id="start">
 <div class="panel">
  <h1>深夜便利店</h1>
  <p class="small">凌晨 02:17 · 城市街角 · 暴雨</p>
  <p class="small">你只是进来买瓶水，却发现一张时间异常的收据。店员似乎知道些什么。</p>
  <p class="small">左侧方向键移动，拖动画面转向。靠近人物或线索后点击“交互”。</p>
  <button class="primary" id="begin">进入便利店</button>
 </div>
</div>

<div id="hud">
 <div id="top">
  <div class="glass"><div id="time">02:17 AM</div><div>雨夜 · 便利店</div></div>
  <button id="phoneButton" style="pointer-events:auto">手机 / 线索</button>
 </div>
 <div id="goal" class="glass"><b>当前目标</b><span id="goalText">调查收银台附近。</span></div>
 <div id="reticle"></div>
 <div id="prompt">探索环境</div>
 <div id="controls">
  <div id="pad">
   <button class="move" id="up">▲</button><button class="move" id="down">▼</button>
   <button class="move" id="left">◀</button><button class="move" id="right">▶</button>
  </div>
  <div id="actions"><button id="use">交互 / 调查</button><button id="phoneButton2">打开手机</button></div>
 </div>
 <div id="dialog">
  <div id="speaker">线索</div><div id="dialogText"></div><div id="choices"></div>
 </div>
 <div id="phone">
  <div id="phoneHeader"><h2>手机 · 线索笔记</h2><button id="closePhone">关闭</button></div>
  <div class="note"><b>当前时间</b><br>凌晨 02:17。雨一直没有停。</div>
  <div id="notes"></div>
  <div class="note"><b>关键线索</b><br><span id="progress">0 / 4</span></div>
  <button id="alarm" style="width:100%">尝试拨打报警电话</button>
  <p class="small">虚构剧情，不会拨打真实电话。</p>
 </div>
 <div id="toast"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
const game=$("game");
let scene,camera,renderer,gameClock;
let started=false,phoneOpen=false,dialogOpen=false;
let yaw=0,pitch=0,elapsed=0;
const keys={up:false,down:false,left:false,right:false};
const interactables=[],cars=[],people=[],rainObjects=[];
const discovered=new Set(),notes=[];
const story={receipt:false,cctv:false,clerk:false,driver:false,footprints:false,ending:false};
let currentTarget=null,toastTimer=0;

function material(color,roughness=.7,metalness=0,extra={}){
 return new THREE.MeshStandardMaterial({color,roughness,metalness,...extra});
}
function cube(name,x,y,z,sx,sy,sz,mat,shadow=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 m.name=name;m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m;
}
function light(color,intensity,distance,x,y,z){
 const l=new THREE.PointLight(color,intensity,distance);l.position.set(x,y,z);scene.add(l);return l;
}
function interact(mesh,id,title,callback){
 mesh.userData.action={id,title,callback};interactables.push(mesh);return mesh;
}
function say(speaker,text,choices=[]){
 dialogOpen=true;$("dialog").style.display="block";
 $("speaker").textContent=speaker;$("dialogText").textContent=text;
 const wrap=$("choices");wrap.innerHTML="";
 const options=choices.length?choices:[{text:"继续",run:closeDialog}];
 for(const item of options){
  const b=document.createElement("button");b.textContent=item.text;
  b.onclick=()=>item.run?.();wrap.appendChild(b);
 }
}
function closeDialog(){dialogOpen=false;$("dialog").style.display="none";}
function toast(text){
 const el=$("toast");el.textContent=text;el.style.display="block";
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display="none",2200);
}
function safeText(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function addNote(id,title,text){
 if(discovered.has(id))return;
 discovered.add(id);notes.push({title,text});renderNotes();toast("已记录线索："+title);updateGoal();
}
function renderNotes(){
 $("notes").innerHTML=notes.length?notes.map(n=>`<div class="note"><b>${safeText(n.title)}</b><br>${safeText(n.text)}</div>`).join(""):'<div class="note">暂无线索。靠近物品或人物进行调查。</div>';
 $("progress").textContent=discovered.size+" / 4 条关键线索";
}
function updateGoal(){
 let t="调查收银台，找到异常收据。";
 if(story.receipt&&!story.cctv)t="检查收银台旁的监控屏幕。";
 else if(story.cctv&&!story.clerk)t="询问收银台后的店员。";
 else if(story.clerk&&!story.driver)t="走到店外，询问雨中的司机。";
 else if(story.driver&&!story.footprints)t="检查门边的湿脚印。";
 else if(discovered.size>=4)t="返回店员身边，弄清 02:22 的秘密。";
 $("goalText").textContent=t;
 if(discovered.size>=4&&!story.ending){
  story.ending=true;
  say("手机通知","你把收据、监控和司机的证词拼在了一起。凌晨 02:22，监控记录了一次不存在于当前时间线的进店事件。",[
   {text:"继续调查",run:()=>{closeDialog();toast("返回店员身边，继续调查。");}}
  ]);
 }
}

function buildScene(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x07121d);
 scene.fog=new THREE.FogExp2(0x091827,.022);
 camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,120);
 camera.position.set(0,1.65,0);
 camera.rotation.order="YXZ";

 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.1;
 game.appendChild(renderer.domElement);
 gameClock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xaac8df,0x1a2028,1.15));
 const moon=new THREE.DirectionalLight(0x83b2e2,1.0);moon.position.set(-8,12,-10);scene.add(moon);

 buildStreet();buildStore();buildShelves();buildRain();buildCars();buildPeople();buildClues();
 window.addEventListener("resize",resize);
 $("loading").style.display="none";$("start").style.display="flex";
}

function buildStreet(){
 cube("road",0,-.22,-14,70,.3,30,material(0x111d28,.24,.2),false);
 cube("sidewalk",0,-.04,-5.8,18,.2,2,material(0x40494c,.5),false);
 for(let x=-30;x<=30;x+=5)cube("road marking",x,-.055,-13,2,.012,.07,material(0xb0b9bd,.4),false);
 const buildingMat=material(0x17232e,.9);
 cube("left building",-13,4,-12,10,8,20,buildingMat);
 cube("right building",13,4,-12,10,8,20,buildingMat);
 for(let i=0;i<5;i++){
  const x=-22+i*11;
  cube("distant building",x,4,-28,7,8+Math.random()*5,7,material(0x182633,.9));
  for(let j=0;j<4;j++){
   cube("distant window",x-2+j*1.2,3,-24.45,.35,.5,.03,
    material(0x4b687b,.35,0,{emissive:0x102a3b}),false);
  }
 }
 for(const x of [-9,9]){
  cube("lamp pole",x,2.7,-9,.12,5.4,.12,material(0x263643,.5));
  cube("lamp head",x,5.4,-9,.65,.13,.28,material(0x9fc7ff,.3,0,{emissive:0x537fc0}));
  light(0x679bff,15,15,x,5,-9);
 }
 for(let i=0;i<18;i++){
  const p=new THREE.Mesh(new THREE.CircleGeometry(.4+Math.random()*1.0,20),
   new THREE.MeshStandardMaterial({color:0x344b5a,roughness:.13,metalness:.35,transparent:true,opacity:.42}));
  p.rotation.x=-Math.PI/2;p.scale.y=.35;
  p.position.set((Math.random()-.5)*22,.006,-6-Math.random()*18);scene.add(p);
 }
}

function buildStore(){
 const floor=material(0x353d40,.3,.1),wall=material(0x28343b,.75);
 cube("floor",0,-.08,1,12,.18,12,floor,false);
 cube("left wall",-6,2.1,1,.22,4.2,12,wall);
 cube("right wall",6,2.1,1,.22,4.2,12,wall);
 cube("back wall",0,2.1,7,12,4.2,.22,wall);
 cube("ceiling",0,4.22,1,12,.18,12,material(0x202d35,.8),false);
 cube("store sign",0,3.75,-5.08,7.2,.65,.2,material(0x143e49,.4,0,{emissive:0x0c222b}));
 const frame=material(0x263d48,.4,.3);
 cube("door left frame",-2.5,1.6,-4.9,.12,3.2,.18,frame);
 cube("door right frame",2.5,1.6,-4.9,.12,3.2,.18,frame);
 cube("door top frame",0,3.18,-4.9,5,.12,.18,frame);
 const glass=new THREE.MeshStandardMaterial({color:0x6d9db3,roughness:.15,transparent:true,opacity:.16});
 cube("front window left",-4.1,1.7,-4.92,2.8,3.25,.06,glass,false);
 cube("front window right",4.1,1.7,-4.92,2.8,3.25,.06,glass,false);
 for(const x of [-3,0,3]){
  cube("ceiling light",x,4.08,1.5,1.8,.04,.5,material(0xffe8bd,.25,0,{emissive:0xffdca1,emissiveIntensity:1.5}),false);
  light(0xffdfad,19,9,x,3.75,1.5);
 }
 light(0xffd8a1,12,8,0,2.6,5.8);
 cube("counter",0,.65,4.15,4.1,1.3,.9,material(0x493d32,.5));
 cube("counter top",0,1.34,4.1,4.3,.12,1.05,material(0x252b2d,.28,.2));
 cube("cash register",-.8,1.55,3.9,.65,.35,.48,material(0x111c24,.35));
 cube("register screen",-.8,1.78,3.65,.5,.25,.035,material(0x4cb5bb,.25,0,{emissive:0x124b50}));
 for(const x of [-4.9,4.9]){
  cube("refrigerator",x,1.55,0,1.2,3.1,4.3,material(0x243843,.3,.2));
  for(let j=0;j<4;j++)cube("fridge shelf",x,.55+j*.63,-1.6,1.08,.035,1.5,material(0x78909a,.3,.15));
  cube("fridge glass",x,1.6,-2.12,1.05,2.8,.035,
   new THREE.MeshStandardMaterial({color:0x9acbdc,roughness:.14,transparent:true,opacity:.13}),false);
 }
}

function buildShelves(){
 const shelf=material(0x4a5458,.7);
 const colors=[0x7fc4d4,0xe4b96e,0x8ac5a1,0xd9857e,0x9baee3];
 for(const x of [-3.6,3.6]){
  for(const z of [-1.6,1.0]){
   cube("aisle shelf",x,1.05,z,1.35,2.1,2.2,shelf);
   for(let level=0;level<3;level++){
    cube("shelf plank",x,.45+level*.62,z,1.4,.06,2.25,material(0x737b7d,.55));
    for(let n=0;n<5;n++){
     const bottle=new THREE.Mesh(new THREE.CylinderGeometry(.055,.065,.32,8),material(colors[(n+level)%colors.length],.3,.1));
     bottle.position.set(x-.48+n*.24,.64+level*.62,z-.7+Math.random()*1.4);bottle.castShadow=true;scene.add(bottle);
    }
   }
  }
 }
 for(let i=0;i<8;i++)cube("price label",-4.1+i*1.17,2.25,2.1,.25,.13,.025,material(0xf3e7bd,.8));
 cube("cardboard box",-4.7,.3,3.2,.7,.6,.7,material(0x8a6848,.95));
 cube("trash bin",4.6,.5,-3.9,.55,1,.55,material(0x293e47,.65));
}

function buildRain(){
 const count=1000,pos=new Float32Array(count*3),speed=new Float32Array(count);
 for(let i=0;i<count;i++){
  pos[i*3]=(Math.random()-.5)*34;pos[i*3+1]=Math.random()*13;pos[i*3+2]=-5-Math.random()*28;
  speed[i]=8+Math.random()*9;
 }
 const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
 const rain=new THREE.Points(geo,new THREE.PointsMaterial({color:0xa4cce5,size:.045,transparent:true,opacity:.7,depthWrite:false}));
 rain.userData={pos,speed,count};scene.add(rain);rainObjects.push(rain);
 const dropMat=new THREE.MeshBasicMaterial({color:0x7baac2,transparent:true,opacity:.35});
 for(let i=0;i<36;i++){
  const d=new THREE.Mesh(new THREE.SphereGeometry(.018,6,6),dropMat);
  d.position.set((Math.random()-.5)*5,Math.random()*2.7,-4.82);
  d.userData.phase=Math.random()*6;scene.add(d);rainObjects.push(d);
 }
}

function makeCar(x,z,color,speed){
 const root=new THREE.Group();root.position.set(x,.05,z);scene.add(root);
 const body=material(color,.25,.3);
 const shell=new THREE.Mesh(new THREE.BoxGeometry(2.1,.62,1.02),body);shell.position.y=.42;shell.castShadow=true;root.add(shell);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.05,.42,.82),material(0x344c5c,.24,.15));roof.position.set(-.12,.91,0);root.add(roof);
 const windshield=new THREE.Mesh(new THREE.BoxGeometry(.8,.27,.025),material(0x7da6b9,.16,.1));windshield.position.set(.35,.9,-.42);root.add(windshield);
 for(const xx of [-.68,.68])for(const zz of [-.53,.53]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.12,12),material(0x101820,.38,.1));
  wheel.rotation.x=Math.PI/2;wheel.position.set(xx,.24,zz);root.add(wheel);
 }
 for(const z0 of [-.34,.34]){
  const h=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.04),new THREE.MeshBasicMaterial({color:0xffe8bd}));
  h.position.set(1.06,.46,z0);root.add(h);
  const t=new THREE.Mesh(new THREE.BoxGeometry(.08,.12,.04),new THREE.MeshBasicMaterial({color:0xff3838}));
  t.position.set(-1.06,.46,z0);root.add(t);
 }
 root.userData.speed=speed;cars.push(root);
}
function buildCars(){
 makeCar(-15,-8,0x293e51,3.1);
 makeCar(13,-12,0x6c3933,-2.5);
 makeCar(-5,-19,0x69716f,2.0);
}

function makePerson(x,z,color,kind){
 const root=new THREE.Group();root.position.set(x,0,z);scene.add(root);
 const coat=material(color,.9),skin=material(0xd1a58b,.85);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.15,12,10),skin);head.position.y=1.55;root.add(head);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.62,4,8),coat);torso.position.y=1.05;root.add(torso);
 for(const side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.5,3,6),material(0x1c2934,.9));
  leg.position.set(side*.11,.43,0);root.add(leg);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.06,.4,3,6),coat);
  arm.position.set(side*.25,1.08,0);root.add(arm);
 }
 if(kind==="umbrella"){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.8,6),material(0x28333c));pole.position.y=2;root.add(pole);
  const canopy=new THREE.Mesh(new THREE.SphereGeometry(.68,16,8,0,Math.PI*2,0,Math.PI/2),
   new THREE.MeshStandardMaterial({color:0x253a4d,roughness:.45,side:THREE.DoubleSide}));
  canopy.position.y=2.3;canopy.scale.y=.35;root.add(canopy);
 }
 root.userData={kind,ox:x,oz:z,phase:Math.random()*6};
 people.push(root);return root;
}
function buildPeople(){
 makePerson(-4.4,-5.5,0x253e52,"umbrella");
 makePerson(7,-10,0x60483f,"umbrella");
 makePerson(.6,5,0x425b63,"clerk");
}

function buildClues(){
 const paper=cube("receipt",.95,1.43,3.78,.22,.018,.32,material(0xe7dfc8,.95));
 paper.rotation.y=.16;
 interact(paper,"receipt","异常收据",()=>{
  story.receipt=true;
  addNote("receipt","异常收据","收据打印时间是 02:22，但当前时间明明是 02:17。");
  say("收据","纸张被雨水打湿了一角，但时间印得很清楚：02:22。",[{text:"收起收据",run:closeDialog}]);
 });

 const screen=cube("monitor screen",-1.45,2.16,3.97,.55,.3,.025,material(0x244c57,.3,0,{emissive:0x0a2529}));
 interact(screen,"cctv","监控屏幕",()=>{
  story.cctv=true;
  addNote("cctv","异常监控","监控在 02:22 黑屏 11 秒，恢复后门口出现了模糊人影。");
  say("监控屏幕","录像在 02:22 黑屏了十一秒。恢复后，门口多了一个人影，但门感应器没有记录开门。",[{text:"保存记录",run:closeDialog}]);
 });

 const clerk=people.find(p=>p.userData.kind==="clerk");
 interact(clerk,"clerk","疲惫的店员",()=>{
  if(!story.clerk){

let audio=null;
function startAudio(){
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.2;
  const src=audio.createBufferSource();src.buffer=buffer;src.loop=true;
  const filter=audio.createBiquadFilter();filter.type="lowpass";filter.frequency.value=1500;
  const gain=audio.createGain();gain.gain.value=.05;
  src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start();
 }catch(e){console.warn("音频未启用",e);}
}
function beep(freq=650){
 if(!audio)return;
 try{
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.1);
 }catch(e){}
}
function beginGame(){
 started=true;$("start").style.display="none";$("hud").style.display="block";
 startAudio();beep(520);toast("雨声已开启。开始调查。");
}

function targetObject(){
 const direction=new THREE.Vector3();camera.getWorldDirection(direction);
 let best=null,limit=2.6;
 for(const obj of interactables){
  if(!obj.visible)continue;
  const p=new THREE.Vector3();obj.getWorldPosition(p);
  const d=p.distanceTo(camera.position);if(d>limit)continue;
  const to=p.sub(camera.position).normalize();
  if(to.dot(direction)<.12)continue;
  limit=d;best=obj;
 }
 return best;
}
function doInteract(){
 if(!started||dialogOpen||phoneOpen)return;
 const obj=targetObject();
 if(!obj){toast("附近没有可调查的物品，请靠近目标。");return;}
 obj.userData.action.callback();
 beep(700);
}
function togglePhone(){
 if(!started||dialogOpen)return;
 phoneOpen=!phoneOpen;$("phone").style.display=phoneOpen?"block":"none";
}

function bind(){
 $("begin").onclick=beginGame;
 $("use").onclick=doInteract;
 $("phoneButton").onclick=togglePhone;$("phoneButton2").onclick=togglePhone;
 $("closePhone").onclick=()=>{phoneOpen=false;$("phone").style.display="none";};
 $("alarm").onclick=()=>{
  say("手机","手机没有信号，但屏幕突然出现一条陌生短信：不要让他在 02:22 出门。",[
   {text:"保存短信",run:()=>{addNote("message","未知短信","手机无信号时出现短信：不要让他在 02:22 出门。");closeDialog();}},
   {text:"关闭",run:closeDialog}
  ]);
 };
 for(const [id,key] of [["up","up"],["down","down"],["left","left"],["right","right"]]){
  const el=$(id),down=e=>{e.preventDefault();keys[key]=true;},up=e=>{e.preventDefault();keys[key]=false;};
  el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);el.addEventListener("pointerleave",up);
 }
 window.addEventListener("keydown",e=>{
  if(e.code==="KeyW"||e.code==="ArrowUp")keys.up=true;
  if(e.code==="KeyS"||e.code==="ArrowDown")keys.down=true;
  if(e.code==="KeyA"||e.code==="ArrowLeft")keys.left=true;
  if(e.code==="KeyD"||e.code==="ArrowRight")keys.right=true;
  if(e.code==="KeyE"||e.code==="Enter")doInteract();
  if(e.code==="KeyQ"||e.code==="KeyN")togglePhone();
  if(e.code==="Escape"){closeDialog();phoneOpen=false;$("phone").style.display="none";}
 });
 window.addEventListener("keyup",e=>{
  if(["KeyW","ArrowUp"].includes(e.code))keys.up=false;
  if(["KeyS","ArrowDown"].includes(e.code))keys.down=false;
  if(["KeyA","ArrowLeft"].includes(e.code))keys.left=false;
  if(["KeyD","ArrowRight"].includes(e.code))keys.right=false;
 });
 let dragging=false,lastX=0,lastY=0;
 renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.clientX>innerWidth*.38&&e.clientY>innerHeight*.12&&!phoneOpen&&!dialogOpen){
   dragging=true;lastX=e.clientX;lastY=e.clientY;
   try{renderer.domElement.setPointerCapture(e.pointerId);}catch(_){}
  }
 });
 renderer.domElement.addEventListener("pointermove",e=>{
  if(!dragging||!started||phoneOpen||dialogOpen)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  yaw-=dx*.004;pitch=THREE.MathUtils.clamp(pitch-dy*.003,-1.1,1.1);
 });
 const release=()=>dragging=false;
 renderer.domElement.addEventListener("pointerup",release);
 renderer.domElement.addEventListener("pointercancel",release);
 renderer.domElement.addEventListener("dblclick",doInteract);
}
