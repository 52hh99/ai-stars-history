<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080e20"><title>轨道引力实验室</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e20;color:#eaf3ff;font-family:system-ui,sans-serif}#space{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}.top{position:fixed;z-index:2;top:12px;left:14px;pointer-events:none;text-shadow:0 2px 14px #000}h1{font-size:clamp(18px,4vw,25px);margin:0;font-weight:800}.sub{font-size:12px;color:#b2c7e9;margin-top:4px}.hud{position:fixed;z-index:2;left:12px;top:76px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.pill{background:#101b31d9;border:1px solid #334866;border-radius:999px;padding:6px 10px;font-size:11px}.panel{position:fixed;z-index:3;left:10px;right:10px;bottom:10px;max-height:47vh;overflow:auto;border:1px solid #304362;border-radius:18px;background:#0b1326f2;padding:12px;backdrop-filter:blur(14px)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:10px}button,select{font:inherit;color:#eaf3ff;background:#1a2945;border:1px solid #3b5274;border-radius:11px;padding:9px 11px;min-height:38px}button:active{transform:scale(.98)}button.primary{background:#1e526c;border-color:#55c6e8}button.danger{background:#482b3a;border-color:#78445c}label{font-size:12px;color:#b4c9e9;display:flex;align-items:center;gap:8px;flex:1;min-width:135px}.control{flex:1;min-width:130px}.head{display:flex;justify-content:space-between;font-size:12px;color:#b4c9e9;margin-bottom:4px}input[type=range]{width:100%;accent-color:#72e3ff}.help{font-size:11px;color:#a6bad9;line-height:1.5;margin-top:9px}#toast{position:fixed;z-index:4;left:50%;top:45%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#0c1b2be8;border:1px solid #4d7b9c;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}@media(min-width:760px){.panel{left:14px;right:auto;bottom:14px;width:370px;max-height:calc(100vh - 135px)}}
</style></head><body><canvas id="space"></canvas><header class="top"><h1>轨道引力实验室</h1><div class="sub">拖动发射天体 · 观察引力弹射、轨道与碰撞</div></header><div class="hud"><span class="pill" id="count">天体：0</span><span class="pill" id="energy">G = 1.0</span></div><div id="toast"></div><section class="panel"><div class="row"><button id="pause" class="primary">暂停</button><button id="clear" class="danger">清除全部</button><button id="seed">生成轨道示例</button></div><div class="row"><div class="control"><div class="head"><span>时间尺度</span><b id="timeVal">1.0×</b></div><input id="timeScale" type="range" min=".1" max="3" step=".1" value="1"></div><div class="control"><div class="head"><span>引力强度</span><b id="gravVal">1.0</b></div><input id="gravity" type="range" min=".2" max="2" step=".1" value="1"></div></div><div class="row"><label>质量预设<select id="mass"><option value=".7">小行星 · 轻</option><option value="1.5" selected>行星 · 中</option><option value="3.2">超级行星 · 重</option><option value="6">巨型天体 · 极重</option></select></label><label>轨迹长度<select id="trail"><option value="100">短</option><option value="260" selected>中</option><option value="520">长</option></select></label></div><div class="row"><button id="trails" class="primary">轨迹：开</button><button id="helpBtn">操作说明</button></div><div class="help">在空白处按住并拖动：松开时发射行星。拖动方向与抛出速度相反（像拉弓）；拖得越长，初速度越大。靠近天体会被引力弯曲，接触时合并碰撞。建议先点“生成轨道示例”。</div></section>
<script>
(()=>{'use strict';
const canvas=document.getElementById('space'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,bodies=[],paused=false,showTrails=true,drag=null,last=0,timeScale=1,G=1,trailMax=260,massPreset=1.5;
const colors=['#6ee7ff','#ffbd70','#c49bff','#ff718f','#82f6bd','#f6ed8b','#8daeff'];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);
function center(){return{x:W*.5,y:H*.43}}function make(x,y,vx,vy,m,color){return{x,y,vx,vy,m,r:3.5+Math.sqrt(m)*3.2,color:color||colors[Math.floor(Math.random()*colors.length)],trail:[]}}
function updateHud(){$('count').textContent='天体：'+bodies.length;$('energy').textContent='G = '+G.toFixed(1)}
function toast(s){let e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1700)}
function add(b){if(bodies.length>=36){toast('最多同时模拟 36 个天体');return}bodies.push(b);updateHud()}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{drag={start:pos(e),now:pos(e)};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag)drag.now=pos(e)});
canvas.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;let p=pos(e),dx=d.start.x-p.x,dy=d.start.y-p.y,len=Math.hypot(dx,dy);if(len<8){toast('按住并拖动，再松开发射');return}let speed=Math.min(len,210)*.026;add(make(d.start.x,d.start.y,dx/len*speed,dy/len*speed,massPreset))});
canvas.addEventListener('pointercancel',()=>drag=null);
function accel(xs,ys,ox,oy,n){ox.fill(0);oy.fill(0);for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let a=bodies[i],b=bodies[j],dx=xs[j]-xs[i],dy=ys[j]-ys[i],r2=dx*dx+dy*dy+100,inv=1/(r2*Math.sqrt(r2)),f=G*42*inv;ox[i]+=f*b.m*dx;oy[i]+=f*b.m*dy;ox[j]-=f*a.m*dx;oy[j]-=f*a.m*dy}}
function collisions(){for(let i=0;i<bodies.length;i++){for(let j=i+1;j<bodies.length;j++){let a=bodies[i],b=bodies[j];if(Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r){let m=a.m+b.m,c=a.m>=b.m?a:b,merged=make((a.x*a.m+b.x*b.m)/m,(a.y*a.m+b.y*b.m)/m,(a.vx*a.m+b.vx*b.m)/m,(a.vy*a.m+b.vy*b.m)/m,m,c.color);merged.r=Math.min(28,Math.sqrt(a.r*a.r+b.r*b.r));merged.trail=a.trail.concat(b.trail).slice(-trailMax);bodies.splice(j,1);bodies.splice(i,1,merged);i=-1;break}}}}
function step(dt){let n=bodies.length;if(!n)return;let xs=bodies.map(b=>b.x),ys=bodies.map(b=>b.y),ax=new Float64Array(n),ay=new Float64Array(n);accel(xs,ys,ax,ay,n);let nx=[],ny=[],bx=new Float64Array(n),by=new Float64Array(n);for(let i=0;i<n;i++){let b=bodies[i];b.x+=b.vx*dt+.5*ax[i]*dt*dt;b.y+=b.vy*dt+.5*ay[i]*dt*dt;nx[i]=b.x;ny[i]=b.y}accel(nx,ny,bx,by,n);for(let i=0;i<n;i++){bodies[i].vx+=.5*(ax[i]+bx[i])*dt;bodies[i].vy+=.5*(ay[i]+by[i])*dt}collisions();for(let b of bodies){if(b.x<-W*.8)b.x=W*1.8;if(b.x>W*1.8)b.x=-W*.8;if(b.y<-H*.8)b.y=H*1.8;if(b.y>H*1.8)b.y=-H*.8}}
function background(){ctx.fillStyle='#080e20';ctx.fillRect(0,0,W,H);let c=center(),g=ctx.createRadialGradient(c.x,c.y,5,c.x,c.y,Math.max(W,H)*.72);g.addColorStop(0,'#142b48');g.addColorStop(.5,'#0c1931');g.addColorStop(1,'#080e20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<90;i++){ctx.fillStyle=`rgba(173,213,255,${.12+(i%5)*.055})`;ctx.fillRect(i*173.31%W,i*97.73%H,1.2,1.2)}ctx.strokeStyle='rgba(105,157,210,.055)';ctx.beginPath();for(let x=W/2%48;x<W;x+=48){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=H/2%48;y<H;y+=48){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke()}
function draw(){background();if(showTrails)for(let b of bodies){if(b.trail.length>1){ctx.beginPath();ctx.moveTo(b.trail[0].x,b.trail[0].y);for(let p of b.trail)ctx.lineTo(p.x,p.y);ctx.strokeStyle=b.color+'99';ctx.lineWidth=1.5;ctx.stroke()}}for(let b of bodies){let g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);g.addColorStop(0,b.color+'66');g.addColorStop(1,b.color+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*3,0,Math.PI*2);ctx.fill();let grad=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,1,b.x,b.y,b.r*1.2);grad.addColorStop(0,'#fff');grad.addColorStop(.2,b.color);grad.addColorStop(1,'#17243d');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=b.color+'aa';ctx.stroke()}if(drag){let dx=drag.start.x-drag.now.x,dy=drag.start.y-drag.now.y;ctx.setLineDash([5,5]);ctx.strokeStyle='#b8f2ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(drag.start.x,drag.start.y);ctx.lineTo(drag.start.x+dx,drag.start.y+dy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#6ee7ffaa';ctx.beginPath();ctx.arc(drag.start.x,drag.start.y,3.5+Math.sqrt(massPreset)*3.2,0,Math.PI*2);ctx.fill()}}
function frame(now){let real=Math.min(.04,(now-last)/1000||0);last=now;if(!paused){let simdt=real*timeScale,sub=Math.max(1,Math.ceil(simdt/.006)),dt=simdt/sub;for(let i=0;i<sub;i++)step(dt);if(showTrails)for(let b of bodies){b.trail.push({x:b.x,y:b.y});if(b.trail.length>trailMax)b.trail.shift()}}draw();requestAnimationFrame(frame)}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';toast(paused?'模拟已暂停':'模拟继续运行')};$('clear').onclick=()=>{bodies=[];drag=null;updateHud();toast('已清除全部天体')};
$('timeScale').oninput=e=>{timeScale=+e.target.value;$('timeVal').textContent=timeScale.toFixed(1)+'×'};$('gravity').oninput=e=>{G=+e.target.value;$('gravVal').textContent=G.toFixed(1);updateHud()};$('mass').onchange=e=>{massPreset=+e.target.value;toast('已选择质量 '+massPreset)};$('trail').onchange=e=>{trailMax=+e.target.value;for(let b of bodies)b.trail=b.trail.slice(-trailMax)};
$('trails').onclick=()=>{showTrails=!showTrails;$('trails').textContent='轨迹：'+(showTrails?'开':'关')};$('seed').onclick=()=>{bodies=[];let c=center();add(make(c.x,c.y,0,0,6,'#ffe2a0'));[{r:90,m:1.5},{r:145,m:.7},{r:205,m:2.4},{r:260,m:1}].forEach((s,i)=>{let a=i*1.62+.4,x=c.x+Math.cos(a)*s.r,y=c.y+Math.sin(a)*s.r*.62,v=Math.sqrt(G*42*6/Math.max(s.r,30))*.74;add(make(x,y,-Math.sin(a)*v,Math.cos(a)*v*.62,s.m,colors[i+1]))});toast('已生成轨道示例，可继续发射天体')};$('helpBtn').onclick=()=>toast('按住空白处向后拖，松开发射；拖得越远速度越快。碰撞时天体合并。');
resize();updateHud();requestAnimationFrame(frame);
})();
</script></body></html>
