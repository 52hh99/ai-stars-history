<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b1a">
<meta name="description" content="群星闪耀：从人工智能诞生到大模型时代的交互式发展史。">
<title>群星闪耀｜AI 大模型发展史</title>
<style>
:root{--bg:#070a17;--panel:#10162b;--panel2:#151d38;--text:#f2f5ff;--muted:#aab4d2;--cyan:#76e4ff;--purple:#b9a0ff;--line:#293453;--gold:#ffd98a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1a2450 0,transparent 48%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;line-height:1.7}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:radial-gradient(1px 1px at 8% 17%,#fff 99%,transparent),radial-gradient(1px 1px at 77% 26%,#a9dfff 99%,transparent),radial-gradient(2px 2px at 45% 65%,#fff 99%,transparent),radial-gradient(1px 1px at 92% 83%,#c6b4ff 99%,transparent),radial-gradient(1px 1px at 22% 78%,#fff 99%,transparent);background-size:310px 270px}
a{color:var(--cyan)}button,input,select{font:inherit}
button{cursor:pointer}
.hero{padding:54px 18px 34px;text-align:center;position:relative;overflow:hidden}
.orbit{width:86px;height:86px;border:1px solid #6074bb;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;box-shadow:0 0 38px #7a71ff44,inset 0 0 24px #7a71ff22;position:relative}
.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #8fdfff88;border-radius:50%;width:125px;height:35px;transform:rotate(-28deg)}
.orbit:after{transform:rotate(50deg);width:112px;height:30px}
.orbit span{font-size:34px}
.eyebrow{color:var(--cyan);letter-spacing:.22em;font-size:12px;font-weight:700}
h1{font-size:clamp(38px,8vw,68px);line-height:1.15;letter-spacing:.06em;margin:10px 0;background:linear-gradient(100deg,#fff,#8beaff 48%,#c7a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);max-width:700px;margin:0 auto 22px}
.hero-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #43527b;background:#151e3b;color:var(--text);padding:10px 15px;border-radius:12px}
.btn.primary{background:linear-gradient(110deg,#4266bd,#7b57bb);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:720px;margin:28px auto 0}
.stat{border:1px solid #293657;background:#0e1429c9;border-radius:14px;padding:12px 8px}
.stat strong{display:block;font-size:24px;color:var(--cyan)}
.stat span{font-size:12px;color:var(--muted)}
main{max-width:1000px;margin:auto;padding:0 16px 60px}
.intro{border:1px solid #2c3b60;background:linear-gradient(120deg,#131b36dd,#11152add);border-radius:18px;padding:20px;margin:10px 0 26px}
.intro h2{margin:0 0 8px;font-size:20px}
.intro p{margin:0;color:var(--muted)}
.controls{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto;gap:9px;padding:12px 0;background:#070a17eF;backdrop-filter:blur(12px)}
.search{width:100%;min-width:0;background:#11182e;color:var(--text);border:1px solid #344264;border-radius:12px;padding:12px}
select{background:#11182e;color:var(--text);border:1px solid #344264;border-radius:12px;padding:10px;max-width:44vw}
.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px}
.section-title h2{font-size:22px;margin:0}
.section-title span{font-size:12px;color:var(--muted)}
.timeline{position:relative;margin-left:10px;padding-left:24px;border-left:1px solid #42527b}
.event{position:relative;margin:0 0 16px}
.event:before{content:"";position:absolute;left:-31px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px #76e4ff88;border:2px solid var(--bg)}
.event summary{list-style:none;cursor:pointer}
.event summary::-webkit-details-marker{display:none}
.event-card{border:1px solid #293657;background:linear-gradient(135deg,#121a32f5,#0e1428f5);border-radius:16px;padding:15px;transition:.2s}
.event-card:hover{border-color:#6376b5;transform:translateY(-1px)}
.event-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.year{color:var(--gold);font-weight:800;font-size:14px;letter-spacing:.04em}
.tag{font-size:11px;color:#d4c8ff;background:#40366a66;border:1px solid #5c4d91;padding:2px 8px;border-radius:20px}
.event h3{font-size:18px;margin:7px 0 4px;line-height:1.45}
.short{color:var(--muted);font-size:14px;margin:0}
.expand{color:var(--cyan);font-size:12px;margin-top:8px;display:inline-block}
.details{padding:0 15px 16px;color:#c8d0e7;font-size:14px}
.details p{margin:10px 0}
.details strong{color:#f2f5ff}
.details ul{padding-left:20px;margin:6px 0}
.details li{margin:4px 0}
.why{border-left:2px solid var(--purple);padding:8px 12px;background:#9c83ff0d;border-radius:0 8px 8px 0}
.empty{display:none;text-align:center;padding:28px;color:var(--muted)}
.glossary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.term{background:#11182e;border:1px solid #293657;border-radius:12px;padding:13px}
.term strong{display:block;color:var(--cyan);margin-bottom:4px}
.term p{font-size:13px;color:var(--muted);margin:0}
.footer{text-align:center;color:#8792b3;font-size:12px;padding:28px 16px;border-top:1px solid #202a47}
.toplink{display:block;text-align:center;margin:24px auto;color:var(--cyan);text-decoration:none}
@media(min-width:700px){.timeline{margin-left:70px;padding-left:30px}.event:before{left:-37px}.event-card{padding:18px 20px}.details{padding:0 20px 20px}.glossary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){.controls{grid-template-columns:1fr}.controls select{max-width:none;width:100%}.stats{gap:6div}.px solid{font-size:20auto}.span{padding-top:36solid}.solid h3{font-size:16大模型时代（2018}}
</style>
</head>
