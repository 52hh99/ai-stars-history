<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>王者荣耀 · 李白发展史</title>
<style>
  :root {
    --bg: #05080f;
    --text: #eaf1ff;
    --muted: #9fb0d0;
    --accent: #6ea8fe;
    --gold: #f5c76b;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
    /* 李白原画背景 */
    background: url('https://p3-flow-imagex-sign.byteimg.com/ocean-cloud-tos/7539692598944868920~tplv-be4g62t4ka-image.image') center / cover fixed no-repeat;
  }
  /* 暗色遮罩，保护文字可读性 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(5,8,15,0.72) 0%, rgba(5,8,15,0.86) 45%, rgba(5,8,15,0.94) 100%);
    z-index: 0;
    pointer-events: none;
  }
  #bgCanvas {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 1; display: block; pointer-events: none;
  }
  .nebula {
    position: fixed; z-index: 2; pointer-events: none; border-radius: 50%;
    will-change: transform; transform: translate3d(0, 0, 0);
  }
  .nebula-a {
    width: 75vmax; height: 75vmax; left: -25vmax; top: -28vmax;
    background: radial-gradient(circle, rgba(64, 124, 255, .13) 0%, rgba(64, 124, 255, .05) 32%, transparent 72%);
    animation: drift-a 30s ease-in-out infinite alternate;
  }
  .nebula-b {
    width: 65vmax; height: 65vmax; right: -22vmax; top: -12vmax;
    background: radial-gradient(circle, rgba(139, 92, 246, .11) 0%, rgba(139, 92, 246, .04) 34%, transparent 70%);
    animation: drift-b 38s ease-in-out infinite alternate;
  }
  .nebula-c {
    width: 80vmax; height: 80vmax; left: 10vmax; bottom: -45vmax;
    background: radial-gradient(circle, rgba(245, 199, 107, .07) 0%, rgba(245, 199, 107, .025) 35%, transparent 70%);
    animation: drift-c 44s ease-in-out infinite alternate;
  }
  @keyframes drift-a { from { transform: scale(1); } to { transform: translate(5vw, 4vh) scale(1.12); } }
  @keyframes drift-b { from { transform: scale(1.08); } to { transform: translate(-6vw, 6vh) scale(0.95); } }
  @keyframes drift-c { from { transform: scale(1); } to { transform: translate(4vw, -5vh) scale(1.15); } }

  .wrap {
    position: relative; z-index: 3; width: min(1120px, calc(100% - 32px));
    margin: 0 auto; padding: 56px 0 80px;
  }
  header { text-align: center; margin-bottom: 34px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px;
    border: 1px solid rgba(110, 168, 254, .35); border-radius: 999px;
    color: #bcd2ff; font-size: 13px; background: rgba(18, 26, 48, 0.8); margin-bottom: 16px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 14px var(--gold); }
  h1 {
    margin: 0 0 12px; font-size: clamp(30px, 5vw, 54px); letter-spacing: .04em; line-height: 1.15;
    background: linear-gradient(90deg, #ffffff, #b9d1ff 45%, #d8c2ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { max-width: 720px; margin: 0 auto; color: var(--muted); line-height: 1.8; font-size: 15px; }

  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 28px 0 42px; }
  .filter-btn {
    appearance: none; border: 1px solid rgba(140, 170, 230, .25); background: rgba(18, 26, 48, .8);
    color: var(--muted); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; transition: .25s ease;
  }
  .filter-btn.active {
    color: #07101f; background: linear-gradient(135deg, #9ec5ff, #c7b4ff); border-color: transparent; font-weight: 700;
  }

  .timeline { position: relative; padding: 8px 0; }
  .timeline::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, rgba(110, 168, 254, .55) 8%, rgba(139, 92, 246, .5) 50%, rgba(245, 199, 107, .45) 92%, transparent);
  }
  .item {
    position: relative; width: 50%; padding: 0 42px 34px 0;
    animation: rise .55s ease forwards; opacity: 0; transform: translateY(18px);
  }
  .item:nth-child(even) { margin-left: 50%; padding: 0 0 34px 42px; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .item::before {
    content: ""; position: absolute; top: 24px; right: -8px; width: 15px; height: 15px; border-radius: 50%;
    background: #0b1224; border: 2px solid var(--accent); box-shadow: 0 0 0 5px rgba(110, 168, 254, .12), 0 0 18px rgba(110, 168, 254, .55); z-index: 2;
  }
  .item:nth-child(even)::before { right: auto; left: -7px; }

  .card {
    position: relative; cursor: pointer; border: 1px solid rgba(140, 170, 230, .2); border-radius: var(--radius);
    background: rgba(15, 23, 42, 0.95); padding: 20px 20px 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, .35); transition: .28s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(110, 168, 254, .55); }
  .year { display: inline-block; font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.35; }
  .card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .tag { font-size: 12px; color: #bcd2ff; border: 1px solid rgba(110, 168, 254, .22); background: rgba(110, 168, 254, .08); padding: 4px 9px; border-radius: 999px; }
  .hint { display: block; margin-top: 14px; color: rgba(159, 176, 208, .72); font-size: 12px; }

  /* 模态框 */
  .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(2, 6, 16, .85); }
  .modal-backdrop.show { display: flex; }
  .modal { width: min(640px, 100%); max-height: 85vh; overflow: auto; border: 1px solid rgba(140, 170, 230, .3); border-radius: 24px; background: #151e36; padding: 30px; box-shadow: 0 30px 100px rgba(0, 0, 0, .6); }
  .modal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .modal-year { color: var(--gold); font-weight: 800; }
  .close-btn { border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); color: var(--text); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 20px; }
  .modal h3 { margin: 0 0 14px; font-size: 24px; }
  .modal .detail { color: #c3d0e8; line-height: 1.9; font-size: 15px; white-space: pre-wrap; }

  @media (max-width: 760px) {
    .timeline::before { left: 10px; transform: none; }
    .item, .item:nth-child(even) { width: 100%; margin-left: 0; padding: 0 0 26px 34px; }
    .item::before, .item:nth-child(even)::before { left: 3px; right: auto; top: 22px; }
  }
</style>
</head>

  <main class="wrap">
    <header>

    <div class="toolbar" id="toolbar"></div>
    <section class="timeline" id="timeline"></section>

      <div class="tags" id="modalTags"></div>
